<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<style>
html,body{height:100%;margin:0;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.logo{font-size:44px;font-weight:800}.msg{margin-top:18px;color:#9999b5;line-height:1.8}.err{max-width:720px;color:#ff8bad;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري تشغيل NOVA AI…</div></div>
<script>
window.__NOVA_HTML=[];
window.__NOVA_JS64=[];
window.__NOVA_LOAD_ERROR='';
function novaPartError(name){window.__NOVA_LOAD_ERROR=name;}
</script>
<script src="../nova-ai-original-clean/raw-1.js?v=same-origin-29" onerror="novaPartError('raw-1.js')"></script>
<script src="../nova-ai-original-clean/raw-2.js?v=same-origin-29" onerror="novaPartError('raw-2.js')"></script>
<script src="../nova-ai-original-clean/raw-3.js?v=same-origin-29" onerror="novaPartError('raw-3.js')"></script>
<script src="../nova-ai-original-clean/raw-4.js?v=same-origin-29" onerror="novaPartError('raw-4.js')"></script>
<script src="../nova-ai-original-clean/raw-5.js?v=same-origin-29" onerror="novaPartError('raw-5.js')"></script>
<script src="../nova-ai-original-clean/raw-6b.js?v=same-origin-29" onerror="novaPartError('raw-6b.js')"></script>
<script src="../nova-ai-original-clean/raw-7b.js?v=same-origin-29" onerror="novaPartError('raw-7b.js')"></script>
<script src="../nova-ai-original-clean/raw-8b.js?v=same-origin-29" onerror="novaPartError('raw-8b.js')"></script>
<script>
(function(){
 const status=document.getElementById('status');
 function fail(msg){status.className='msg err';status.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+msg;}
 function decode64(input){
   const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
   const map=new Int16Array(128);map.fill(-1);
   for(let i=0;i<alphabet.length;i++)map[alphabet.charCodeAt(i)]=i;
   const clean=String(input||'').replace(/[^A-Za-z0-9+/]/g,'');
   const out=new Uint8Array(Math.ceil(clean.length*3/4));let oi=0;
   for(let i=0;i<clean.length;i+=4){
     const a=map[clean.charCodeAt(i)],b=i+1<clean.length?map[clean.charCodeAt(i+1)]:0,c=i+2<clean.length?map[clean.charCodeAt(i+2)]:0,d=i+3<clean.length?map[clean.charCodeAt(i+3)]:0;
     if(a<0||b<0||c<0||d<0)throw new Error('Base64 غير صالح');
     const n=(a<<18)|(b<<12)|(c<<6)|d;
     out[oi++]=(n>>16)&255;if(i+2<clean.length)out[oi++]=(n>>8)&255;if(i+3<clean.length)out[oi++]=n&255;
   }
   return new TextDecoder('utf-8').decode(out.subarray(0,oi));
 }
 try{
   if(window.__NOVA_LOAD_ERROR)throw new Error('تعذر تحميل '+window.__NOVA_LOAD_ERROR);
   if(window.__NOVA_HTML.length!==5)throw new Error('الأجزاء المباشرة '+window.__NOVA_HTML.length+'/5');
   if(window.__NOVA_JS64.length!==3)throw new Error('الأجزاء الأخيرة '+window.__NOVA_JS64.length+'/3');
   for(const encoded of window.__NOVA_JS64){new Function('window',decode64(encoded))(window);}
   if(window.__NOVA_HTML.length!==8)throw new Error('إجمالي الأجزاء '+window.__NOVA_HTML.length+'/8');
   let html=window.__NOVA_HTML.join('');
   if(!html.includes('initApp()'))throw new Error('ملف التطبيق النهائي غير مكتمل');
   html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>NOVA AI</title>').replaceAll('NovaAI','NOVA AI');
   document.open();document.write(html);document.close();
 }catch(e){fail(e&&e.message?e.message:String(e));}
})();
</script>
</body>
</html>
