<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<title>NovaAI</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#0d0d12;--side:#101016;--panel:#17171f;--panel2:#1d1d27;--line:#2a2a36;--text:#ededf5;--muted:#9292a8;--purple:#7c6aff;--pink:#ff6b9d;--shadow:0 18px 50px rgba(0,0,0,.36);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:270px 1fr;overflow:hidden}.side{background:var(--side);border-left:1px solid #20202a;padding:14px;display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}.gem{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 0 28px rgba(124,106,255,.24);font-size:18px}.brandText{font-weight:750;font-size:17px;letter-spacing:.1px}.newChat{width:100%;height:44px;border:1px solid #2b2b38;background:#17171f;color:var(--text);border-radius:13px;padding:0 13px;display:flex;align-items:center;gap:10px;justify-content:flex-start}.newChat:hover{background:#1c1c26}.sideLabel{font-size:11px;color:#6f6f84;padding:18px 9px 7px}.history{display:grid;gap:4px;overflow:auto}.history button{border:0;background:transparent;color:#b7b7c8;border-radius:10px;padding:10px 11px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover,.history button.active{background:#191922;color:#fff}.sideBottom{margin-top:auto;padding-top:12px}.sideBottom button{width:100%;border:0;background:transparent;color:#8d8da3;border-radius:10px;padding:10px;text-align:start}.sideBottom button:hover{background:#191922;color:#fff}.main{min-width:0;height:100dvh;display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 50% -20%,rgba(124,106,255,.08),transparent 30%),var(--bg)}.top{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.045);background:rgba(13,13,18,.78);backdrop-filter:blur(16px);z-index:6}.topGroup{display:flex;align-items:center;gap:8px}.modelBtn,.ghost{border:0;background:transparent;color:#c9c9d6;border-radius:10px;padding:8px 10px}.modelBtn:hover,.ghost:hover{background:#191922}.modelBtn{font-weight:650}.menuBtn{display:none;width:38px;height:38px;padding:0}.stage{flex:1;min-height:0;position:relative}.messages{height:100%;overflow:auto;padding:26px max(22px,calc((100% - 800px)/2)) 190px;scroll-behavior:smooth}.welcome{max-width:690px;margin:13vh auto 0;text-align:center}.heroGem{width:62px;height:62px;margin:auto;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));font-size:28px;box-shadow:0 12px 42px rgba(124,106,255,.22)}.welcome h1{font-size:30px;margin:18px 0 7px}.welcome p{margin:0;color:var(--muted);line-height:1.75}.suggestions{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:start}.suggestions button{border:1px solid #262631;background:#121218;color:#cfcfdb;border-radius:14px;padding:13px 14px;text-align:start;line-height:1.45}.suggestions button:hover{background:#17171f;border-color:#343442}.msg{max-width:800px;margin:0 auto 24px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:#1b1b24}.msg.ai .avatar{background:linear-gradient(135deg,var(--purple),#b665e8);color:#fff}.msg.user .avatar{background:#252532}.bubble{line-height:1.8;color:#e8e8ef;overflow-wrap:anywhere}.msg.user .bubble{color:#d7d7e2}.bubble pre{direction:ltr;text-align:left;overflow:auto;background:#09090d;border:1px solid #272732;border-radius:13px;padding:14px}.meta{font-size:11px;color:#69697d;margin-top:5px}.thinking{opacity:.65}.composerArea{position:absolute;left:0;right:0;bottom:0;padding:42px max(14px,calc((100% - 830px)/2)) 18px;background:linear-gradient(transparent 0,var(--bg) 34%);z-index:5}.chips{display:flex;gap:6px;overflow:auto;padding:0 4px 7px}.chip{flex:0 0 auto;border:1px solid #2b2b37;background:#15151d;color:#9e9eb2;border-radius:999px;padding:5px 9px;font-size:11px}.composer{background:#17171f;border:1px solid #2a2a36;border-radius:19px;padding:9px 9px 9px 10px;box-shadow:var(--shadow)}.composer textarea{width:100%;resize:none;border:0;outline:0;background:transparent;color:#f2f2f7;min-height:44px;max-height:160px;padding:9px 10px;line-height:1.5}.composerBottom{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:3px}.leftActions,.rightActions{display:flex;align-items:center;gap:6px}.round{width:37px;height:37px;border:0;background:transparent;color:#aaaabd;border-radius:11px;display:grid;place-items:center;font-size:18px}.round:hover{background:#22222c;color:#fff}.send{width:38px;height:38px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--purple),#6a5bea);color:#fff;display:grid;place-items:center;font-size:17px}.send:disabled{opacity:.45}.modePill{border:0;background:transparent;color:#8f8fa3;border-radius:10px;padding:8px 10px;font-size:12px}.modePill:hover{background:#22222c;color:#fff}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.54);backdrop-filter:blur(5px);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:18px}.overlay.open{display:flex}.sheet{width:min(760px,100%);max-height:min(720px,88vh);overflow:auto;background:#13131a;border:1px solid #2a2a36;border-radius:22px;box-shadow:0 30px 90px #0009;padding:14px}.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:6px 7px 13px}.sheetHead h2{font-size:17px;margin:0}.close{border:0;background:#1e1e28;color:#aaaabd;border-radius:10px;width:35px;height:35px}.toolMenu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.toolTile{border:1px solid #292935;background:#181820;color:#ededf5;border-radius:15px;padding:15px;text-align:start}.toolTile:hover{background:#1d1d27}.toolTile b{display:block;margin-bottom:4px}.toolTile span{color:#848497;font-size:12px}.pane{display:none;padding:4px 5px 8px}.pane.active{display:block}.back{border:0;background:transparent;color:#9c9caf;padding:7px 4px;margin-bottom:8px}.field{display:grid;gap:7px;margin:11px 0}.field label{font-size:12px;color:#8d8da2}.input,.area,.select{width:100%;border:1px solid #2b2b37;background:#0e0e14;color:#ededf5;border-radius:12px;padding:11px;outline:0}.area{min-height:130px;resize:vertical}.btn{border:1px solid #2c2c39;background:#1b1b24;color:#e8e8ef;border-radius:11px;padding:9px 12px}.btn:hover{background:#23232e}.primary{border:0;background:linear-gradient(135deg,var(--purple),#6c5deb);color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.drop{border:1px dashed #3b3b49;background:#0f0f15;border-radius:14px;padding:24px;text-align:center;color:#8e8ea2}.fileList{display:grid;gap:7px;margin-top:10px}.fileItem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #272732;background:#16161e;border-radius:11px;padding:10px}.codeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.codeEditor{width:100%;min-height:390px;border:1px solid #292936;background:#09090d;color:#e9e9f2;border-radius:13px;padding:12px;resize:vertical;direction:ltr;text-align:left;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.preview{width:100%;min-height:390px;border:1px solid #292936;border-radius:13px;background:white}.canvasWrap{min-height:300px;background:#09090d;border:1px solid #292936;border-radius:14px;display:grid;place-items:center;overflow:auto;padding:8px}.canvasWrap canvas{max-width:100%;height:auto}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:12px;color:#7f7f93;min-height:18px;padding-top:6px}.modelMenu{position:absolute;top:50px;right:18px;width:210px;background:#16161e;border:1px solid #2b2b37;border-radius:13px;padding:6px;box-shadow:var(--shadow);z-index:20;display:none}.modelMenu.open{display:block}.modelMenu button{width:100%;border:0;background:transparent;color:#cfcfda;border-radius:9px;padding:9px 10px;text-align:start}.modelMenu button:hover,.modelMenu button.active{background:#22222c;color:#fff}.mobileShade{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:50;inset:0 0 0 auto;width:min(285px,86vw);transform:translateX(105%);transition:.2s;box-shadow:-20px 0 60px #0008}.side.open{transform:translateX(0)}.mobileShade.open{display:block;position:fixed;inset:0;background:#0008;z-index:45}.menuBtn{display:grid}.top{padding:0 10px}.messages{padding:20px 14px 175px}.welcome{margin-top:9vh;padding:0 8px}.welcome h1{font-size:25px}.suggestions{grid-template-columns:1fr}.composerArea{padding:32px 8px 10px}.toolMenu{grid-template-columns:1fr}.codeGrid{grid-template-columns:1fr}.ranges{grid-template-columns:1fr}.modelMenu{right:52px}}
@media(max-width:480px){.top .ghost.hidePhone{display:none}.brandText{font-size:16px}.welcome p{font-size:14px}.composer{border-radius:17px}.modePill{max-width:115px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand"><div class="gem">✦</div><div class="brandText">NovaAI</div></div>
  <button class="newChat" id="newChat">＋ <span>محادثة جديدة</span></button>
  <div class="sideLabel">المحادثات</div>
  <div class="history" id="history"></div>
  <div class="sideBottom"><button id="openSettings">⚙️ الإعدادات</button></div>
</aside>
<div class="mobileShade" id="shade"></div>
<main class="main">
  <header class="top">
    <div class="topGroup"><button class="ghost menuBtn" id="menuBtn">☰</button><button class="modelBtn" id="modelBtn">NovaAI ▾</button></div>
    <div class="topGroup"><button class="ghost hidePhone" id="exportBtn">تصدير</button><button class="ghost" id="clearBtn" title="مسح المحادثة">⌫</button></div>
  </header>
  <div class="modelMenu" id="modelMenu">
    <button data-mode="general" class="active">عام</button>
    <button data-mode="study">دراسة</button>
    <button data-mode="coding">برمجة</button>
    <button data-mode="research">بحث وتحليل</button>
    <button data-mode="writing">كتابة</button>
  </div>
  <section class="stage">
    <div class="messages" id="messages"></div>
    <div class="composerArea">
      <div class="chips" id="chips"></div>
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="اسأل NovaAI أي شيء…"></textarea>
        <div class="composerBottom">
          <div class="leftActions"><button class="round" id="plusBtn" title="إضافة">＋</button><button class="round" id="voiceBtn" title="صوت">◉</button><button class="modePill" id="modePill">عام</button></div>
          <div class="rightActions"><button class="send" id="sendBtn">➤</button></div>
        </div>
      </div>
    </div>
  </section>
</main>
</div>

<div class="overlay" id="toolsOverlay">
  <div class="sheet">
    <div class="sheetHead"><h2 id="sheetTitle">إضافة إلى المحادثة</h2><button class="close" id="closeTools">×</button></div>
    <div id="toolHome" class="pane active">
      <div class="toolMenu">
        <button class="toolTile" data-pane="filesPane"><b>📎 الملفات والصور</b><span>PDF، صور، كود، نصوص وبيانات</span></button>
        <button class="toolTile" data-pane="imagePane"><b>🎨 الصور</b><span>تعديل محلي وتوليد AI عند توفر الخادم</span></button>
        <button class="toolTile" data-pane="codePane"><b>⌨️ Code Studio</b><span>اكتب HTML وشغّله في Preview</span></button>
        <button class="toolTile" data-pane="utilityPane"><b>🧰 أدوات سريعة</b><span>حاسبة، JSON وعد الكلمات</span></button>
      </div>
    </div>
    <div id="filesPane" class="pane"><button class="back">→ رجوع</button><div class="drop" id="dropZone">اضغط هنا لاختيار ملفات أو اسحبها هنا</div><input id="fileInput" type="file" hidden multiple accept=".txt,.md,.json,.csv,.html,.css,.js,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.pdf,image/png,image/jpeg,image/webp"><div class="fileList" id="fileList"></div></div>
    <div id="imagePane" class="pane"><button class="back">→ رجوع</button><div class="row"><button class="btn" id="openImage">فتح صورة</button><button class="btn" id="resetImage">إعادة ضبط</button><button class="btn primary" id="saveImage">حفظ PNG</button></div><input id="imageInput" type="file" accept="image/*" hidden><div class="ranges"><div class="field"><label>Brightness <span id="bVal">100</span>%</label><input id="brightness" type="range" min="0" max="200" value="100"></div><div class="field"><label>Contrast <span id="cVal">100</span>%</label><input id="contrast" type="range" min="0" max="200" value="100"></div></div><div class="canvasWrap"><canvas id="canvas" width="800" height="500"></canvas></div><div class="field"><label>AI Image Prompt</label><textarea class="area" id="imagePrompt" placeholder="صف الصورة التي تريدها…"></textarea></div><div class="row"><button class="btn primary" id="generateImage">توليد صورة</button><select class="select" id="imageModel" style="max-width:220px"><option value="flux">Flux</option><option value="qwen-image">Qwen Image</option><option value="gptimage">GPT Image</option></select></div><div class="status" id="imageStatus"></div><img id="generatedImage" alt="" style="display:none;width:100%;margin-top:10px;border-radius:14px"></div>
    <div id="codePane" class="pane"><button class="back">→ رجوع</button><div class="row" style="margin-bottom:8px"><button class="btn primary" id="runCode">تشغيل</button><button class="btn" id="downloadCode">حفظ HTML</button></div><div class="codeGrid"><textarea class="codeEditor" id="codeEditor"><!doctype html>
<html><body style="font-family:system-ui;padding:32px"><h1>Hello NovaAI</h1><p>Edit this code and press Run.</p></body></html></textarea><iframe class="preview" id="preview" sandbox="allow-scripts"></iframe></div></div>
    <div id="utilityPane" class="pane"><button class="back">→ رجوع</button><div class="field"><label>حاسبة</label><input class="input" id="calcInput" placeholder="مثال: (12+8)*3/2"><button class="btn" id="calcBtn">احسب</button><div class="status" id="calcOut"></div></div><div class="field"><label>JSON Formatter</label><textarea class="area" id="jsonInput" placeholder='{"name":"NovaAI"}'></textarea><button class="btn" id="jsonBtn">تنسيق JSON</button></div><div class="field"><label>عداد النص</label><textarea class="area" id="countInput" placeholder="الصق النص هنا…"></textarea><div class="status" id="countOut">0 كلمة • 0 حرف</div></div></div>
  </div>
</div>

<div class="overlay" id="settingsOverlay"><div class="sheet" style="max-width:520px"><div class="sheetHead"><h2>الإعدادات</h2><button class="close" id="closeSettings">×</button></div><div class="field"><label>عنوان API اختياري</label><input class="input" id="apiBase" placeholder="اتركه فارغًا لاستخدام /api"></div><div class="field"><label>اللغة والاتجاه</label><select class="select" id="dirSelect"><option value="rtl">العربية / RTL</option><option value="ltr">English / LTR</option></select></div><div class="row"><button class="btn primary" id="saveSettings">حفظ</button></div><div class="status">مفاتيح الخدمات لا يتم حفظها في المتصفح.</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs" type="module"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={mode:'general',messages:JSON.parse(localStorage.getItem('nova_clean_messages')||'[]'),files:[],apiBase:localStorage.getItem('nova_api_base')||''};
const modeNames={general:'عام',study:'دراسة',coding:'برمجة',research:'بحث وتحليل',writing:'كتابة'};
const messages=$('#messages'), prompt=$('#prompt'), sendBtn=$('#sendBtn'), chips=$('#chips');
function escapeHtml(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatText(s=''){let t=escapeHtml(s);t=t.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>');t=t.replace(/\n/g,'<br>');return t}
function save(){localStorage.setItem('nova_clean_messages',JSON.stringify(state.messages.slice(-80)))}
function welcome(){return `<div class="welcome"><div class="heroGem">✦</div><h1>كيف أقدر أساعدك؟</h1><p>اسأل، ارفع ملف، حلّل صورة، اكتب كود أو ذاكر موضوع — من مكان واحد بدون زحمة.</p><div class="suggestions"><button data-q="اشرح لي الموضوع ده بطريقة بسيطة خطوة بخطوة">اشرح لي موضوعًا ببساطة</button><button data-q="ساعدني أعمل مشروع برمجة مرتب من البداية للنهاية">ابدأ مشروع برمجة</button><button data-q="راجع الملف الذي سأرفعه واستخرج أهم النقاط">حلّل ملفًا</button><button data-q="ساعدني أرتب أفكاري وأوصل لأفضل قرار">فكّر معي في قرار</button></div></div>`}
function render(){if(!state.messages.length){messages.innerHTML=welcome();$$('[data-q]').forEach(b=>b.onclick=()=>{prompt.value=b.dataset.q;autoGrow();prompt.focus()});return}messages.innerHTML=state.messages.map(m=>`<div class="msg ${m.role==='assistant'?'ai':'user'}"><div class="avatar">${m.role==='assistant'?'✦':'أ'}</div><div><div class="bubble">${formatText(m.content)}</div>${m.model?`<div class="meta">${escapeHtml(m.model)}</div>`:''}</div></div>`).join('');messages.scrollTop=messages.scrollHeight}
function autoGrow(){prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,160)+'px'}
prompt.addEventListener('input',autoGrow);prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function api(path){const base=(state.apiBase||'').replace(/\/$/,'');return base?base+path:path}
async function send(){const text=prompt.value.trim();if(!text)return;state.messages.push({role:'user',content:text});prompt.value='';autoGrow();save();render();sendBtn.disabled=true;state.messages.push({role:'assistant',content:'...',thinking:true});render();try{const attachments=state.files.map(f=>({name:f.name,type:f.type,text:f.text||'',dataUrl:f.dataUrl||''}));const history=state.messages.filter(m=>!m.thinking).slice(-24,-1);const r=await fetch(api('/api/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:state.mode,history,attachments})});const d=await r.json().catch(()=>({}));state.messages.pop();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);state.messages.push({role:'assistant',content:d.reply||'لم يصل رد.',model:d.model||''});save();render()}catch(e){state.messages.pop();state.messages.push({role:'assistant',content:`تعذر الاتصال بخدمة الذكاء الاصطناعي. ${e.message||''}`});save();render()}finally{sendBtn.disabled=false}}
sendBtn.onclick=send;
$('#newChat').onclick=()=>{state.messages=[];state.files=[];save();render();renderFiles();closeSide()};
$('#clearBtn').onclick=()=>{state.messages=[];save();render()};
$('#exportBtn').onclick=()=>{const text=state.messages.map(m=>`${m.role==='user'?'User':'NovaAI'}:\n${m.content}`).join('\n\n');download('nova-chat.md',text,'text/markdown')};
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setMode(mode){state.mode=mode;$('#modePill').textContent=modeNames[mode];$$('#modelMenu button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#modelMenu').classList.remove('open')}
$('#modelBtn').onclick=e=>{e.stopPropagation();$('#modelMenu').classList.toggle('open')};$('#modePill').onclick=()=>$('#modelMenu').classList.toggle('open');$$('#modelMenu button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.addEventListener('click',e=>{if(!e.target.closest('#modelMenu')&&!e.target.closest('#modelBtn')&&!e.target.closest('#modePill'))$('#modelMenu').classList.remove('open')});
const toolsOverlay=$('#toolsOverlay');$('#plusBtn').onclick=()=>{showPane('toolHome');toolsOverlay.classList.add('open')};$('#closeTools').onclick=()=>toolsOverlay.classList.remove('open');toolsOverlay.addEventListener('click',e=>{if(e.target===toolsOverlay)toolsOverlay.classList.remove('open')});
function showPane(id){$$('#toolsOverlay .pane').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');$('#sheetTitle').textContent=id==='toolHome'?'إضافة إلى المحادثة':({filesPane:'الملفات والصور',imagePane:'الصور',codePane:'Code Studio',utilityPane:'أدوات سريعة'}[id]||'أدوات')}
$$('.toolTile').forEach(b=>b.onclick=()=>showPane(b.dataset.pane));$$('.back').forEach(b=>b.onclick=()=>showPane('toolHome'));
const fileInput=$('#fileInput'),dropZone=$('#dropZone');dropZone.onclick=()=>fileInput.click();fileInput.onchange=e=>addFiles([...e.target.files]);dropZone.ondragover=e=>{e.preventDefault();dropZone.style.borderColor='#7c6aff'};dropZone.ondragleave=()=>dropZone.style.borderColor='';dropZone.ondrop=e=>{e.preventDefault();dropZone.style.borderColor='';addFiles([...e.dataTransfer.files])};
async function addFiles(files){for(const f of files.slice(0,8)){const item={name:f.name,type:f.type,size:f.size};if(f.type.startsWith('image/'))item.dataUrl=await readData(f);else if(f.type==='application/pdf'){item.text='[PDF مرفق: افتحه عبر خدمة تدعم استخراج PDF أو حوّله إلى نص إذا لم يتم استخراجه تلقائيًا]'}else item.text=(await f.text()).slice(0,70000);state.files.push(item)}renderFiles();showPane('filesPane')}
function readData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function renderFiles(){chips.innerHTML=state.files.map((f,i)=>`<button class="chip" data-i="${i}">📎 ${escapeHtml(f.name)} ×</button>`).join('');$$('.chip').forEach(b=>b.onclick=()=>{state.files.splice(+b.dataset.i,1);renderFiles()});$('#fileList').innerHTML=state.files.length?state.files.map((f,i)=>`<div class="fileItem"><span>${escapeHtml(f.name)}</span><button class="close" data-rm="${i}">×</button></div>`).join(''):'<div class="status">لا توجد ملفات مرفقة.</div>';$$('[data-rm]').forEach(b=>b.onclick=()=>{state.files.splice(+b.dataset.rm,1);renderFiles()})}
let img=null;const canvas=$('#canvas'),ctx=canvas.getContext('2d');function drawImage(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!img)return;const b=$('#brightness').value,c=$('#contrast').value;ctx.filter=`brightness(${b}%) contrast(${c}%)`;const scale=Math.min(canvas.width/img.width,canvas.height/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);$('#bVal').textContent=b;$('#cVal').textContent=c}
$('#openImage').onclick=()=>$('#imageInput').click();$('#imageInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;img=new Image();img.onload=drawImage;img.src=await readData(f)};$('#brightness').oninput=drawImage;$('#contrast').oninput=drawImage;$('#resetImage').onclick=()=>{$('#brightness').value=100;$('#contrast').value=100;drawImage()};$('#saveImage').onclick=()=>{const a=document.createElement('a');a.download='nova-image.png';a.href=canvas.toDataURL('image/png');a.click()};
$('#generateImage').onclick=async()=>{const p=$('#imagePrompt').value.trim();if(!p)return;const st=$('#imageStatus');st.textContent='جاري التوليد…';try{const r=await fetch(api('/api/image'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,model:$('#imageModel').value,width:1024,height:1024})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||`HTTP ${r.status}`)}const blob=await r.blob(),url=URL.createObjectURL(blob);$('#generatedImage').src=url;$('#generatedImage').style.display='block';st.textContent='تم ✅'}catch(e){st.textContent='تعذر التوليد: '+e.message}};
$('#runCode').onclick=()=>$('#preview').srcdoc=$('#codeEditor').value;$('#downloadCode').onclick=()=>download('nova-project.html',$('#codeEditor').value,'text/html');
$('#calcBtn').onclick=()=>{const v=$('#calcInput').value.trim();if(!/^[0-9+\-*/().%\s]+$/.test(v))return $('#calcOut').textContent='استخدم أرقامًا وعمليات حسابية فقط.';try{$('#calcOut').textContent=String(Function('"use strict";return ('+v+')')())}catch{$('#calcOut').textContent='صيغة غير صحيحة'}};
$('#jsonBtn').onclick=()=>{try{$('#jsonInput').value=JSON.stringify(JSON.parse($('#jsonInput').value),null,2)}catch{$('#jsonInput').value='JSON غير صالح'}};$('#countInput').oninput=e=>{const t=e.target.value.trim();$('#countOut').textContent=`${t?t.split(/\s+/).length:0} كلمة • ${e.target.value.length} حرف`};
const settings=$('#settingsOverlay');$('#openSettings').onclick=()=>{settings.classList.add('open');$('#apiBase').value=state.apiBase;$('#dirSelect').value=document.documentElement.dir};$('#closeSettings').onclick=()=>settings.classList.remove('open');settings.onclick=e=>{if(e.target===settings)settings.classList.remove('open')};$('#saveSettings').onclick=()=>{state.apiBase=$('#apiBase').value.trim();localStorage.setItem('nova_api_base',state.apiBase);document.documentElement.dir=$('#dirSelect').value;settings.classList.remove('open')};
const side=$('#side'),shade=$('#shade');function closeSide(){side.classList.remove('open');shade.classList.remove('open')}$('#menuBtn').onclick=()=>{side.classList.add('open');shade.classList.add('open')};shade.onclick=closeSide;
$('#voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('المتصفح لا يدعم الإدخال الصوتي هنا.');const r=new SR();r.lang=document.documentElement.dir==='rtl'?'ar-EG':'en-US';r.onresult=e=>{prompt.value=e.results[0][0].transcript;autoGrow()};r.start()};
function renderHistory(){const h=$('#history');h.innerHTML=state.messages.length?`<button class="active">${escapeHtml((state.messages.find(m=>m.role==='user')?.content||'المحادثة الحالية').slice(0,34))}</button>`:'<button class="active">محادثة جديدة</button>'}
window.addEventListener('online',()=>{});window.addEventListener('offline',()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();renderFiles();renderHistory();setMode('general');$('#runCode').click();
</script>
</body>
</html>
