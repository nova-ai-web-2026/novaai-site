<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<title>NovaAI</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
:root{--bg:#0d0d12;--side:#101016;--panel:#16161e;--panel2:#1b1b24;--line:#292934;--text:#ededf5;--muted:#8e8ea3;--purple:#7c6aff;--pink:#ff6b9d;--good:#49c99a;--bad:#ff7f99;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color-scheme:dark;font-size:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:232px 1fr}.side{background:var(--side);border-left:1px solid #202028;padding:12px;display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 13px}.gem{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 0 22px rgba(124,106,255,.2);font-size:16px}.brand b{font-size:15px}.newChat{height:40px;border:1px solid #2a2a35;background:#17171f;color:#ededf5;border-radius:11px;padding:0 11px;display:flex;align-items:center;gap:8px}.newChat:hover{background:#1c1c25}.sideLabel{font-size:10.5px;color:#68687a;padding:16px 7px 6px}.history{display:grid;gap:3px;overflow:auto}.history button{border:0;background:transparent;color:#b0b0c1;border-radius:9px;padding:8px 9px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover,.history button.active{background:#191920;color:#fff}.sideBottom{margin-top:auto;display:grid;gap:4px}.sideBottom button{border:0;background:transparent;color:#89899d;border-radius:9px;padding:9px;text-align:start}.sideBottom button:hover{background:#191920;color:#fff}.main{min-width:0;height:100dvh;display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 50% -15%,rgba(124,106,255,.055),transparent 28%),var(--bg)}.top{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(13,13,18,.82);backdrop-filter:blur(14px);z-index:6}.topGroup{display:flex;align-items:center;gap:5px}.ghost,.modelBtn{border:0;background:transparent;color:#c3c3d0;border-radius:9px;padding:7px 9px}.ghost:hover,.modelBtn:hover{background:#191920}.modelBtn{font-weight:650}.menuBtn{display:none;width:34px;height:34px;padding:0}.stage{flex:1;min-height:0;position:relative}.messages{height:100%;overflow:auto;padding:22px max(18px,calc((100% - 760px)/2)) 156px;scroll-behavior:smooth}.welcome{max-width:600px;margin:11vh auto 0;text-align:center}.heroGem{width:52px;height:52px;margin:auto;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));font-size:23px;box-shadow:0 10px 32px rgba(124,106,255,.18)}.welcome h1{font-size:24px;margin:15px 0 6px}.welcome p{margin:0;color:var(--muted);line-height:1.65}.suggestions{margin-top:21px;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:start}.suggestions button{border:1px solid #252530;background:#121218;color:#cfcfda;border-radius:12px;padding:11px 12px;text-align:start;line-height:1.4}.suggestions button:hover{background:#17171f;border-color:#343440}.msg{max-width:760px;margin:0 auto 20px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}.avatar{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;font-size:12px;background:#1b1b23}.msg.ai .avatar{background:linear-gradient(135deg,var(--purple),#b665e8);color:#fff}.msg.user .avatar{background:#24242d}.bubble{line-height:1.72;color:#e5e5ed;overflow-wrap:anywhere}.bubble pre{direction:ltr;text-align:left;overflow:auto;background:#09090d;border:1px solid #262630;border-radius:11px;padding:12px}.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.meta{font-size:10.5px;color:#666678;margin-top:4px}.composerArea{position:absolute;left:0;right:0;bottom:0;padding:32px max(12px,calc((100% - 790px)/2)) 13px;background:linear-gradient(transparent 0,var(--bg) 34%);z-index:5}.chips{display:flex;gap:5px;overflow:auto;padding:0 3px 6px}.chip{flex:0 0 auto;border:1px solid #292934;background:#14141b;color:#9999ad;border-radius:999px;padding:4px 8px;font-size:10.5px}.composer{background:#16161e;border:1px solid #292934;border-radius:16px;padding:7px 8px 7px;box-shadow:0 14px 42px rgba(0,0,0,.3)}.composer textarea{width:100%;resize:none;border:0;outline:0;background:transparent;color:#f1f1f6;min-height:39px;max-height:135px;padding:7px 8px;line-height:1.45}.composerBottom{display:flex;justify-content:space-between;align-items:center;gap:7px}.leftActions,.rightActions{display:flex;align-items:center;gap:4px}.round{width:33px;height:33px;border:0;background:transparent;color:#aaaabb;border-radius:9px;display:grid;place-items:center;font-size:16px}.round:hover{background:#22222b;color:#fff}.send{width:34px;height:34px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--purple),#6b5cec);color:#fff;display:grid;place-items:center;font-size:15px}.send:disabled{opacity:.45}.modePill{border:0;background:transparent;color:#8e8ea1;border-radius:9px;padding:7px 8px;font-size:11.5px}.modePill:hover{background:#22222b;color:#fff}.modelMenu{position:absolute;top:45px;right:14px;width:188px;background:#15151d;border:1px solid #292934;border-radius:11px;padding:5px;box-shadow:0 18px 50px #0008;z-index:20;display:none}.modelMenu.open{display:block}.modelMenu button{width:100%;border:0;background:transparent;color:#cfcfda;border-radius:8px;padding:8px 9px;text-align:start}.modelMenu button:hover,.modelMenu button.active{background:#22222b;color:#fff}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.56);backdrop-filter:blur(5px);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:14px}.overlay.open{display:flex}.sheet{width:min(700px,100%);max-height:min(650px,88vh);overflow:auto;background:#13131a;border:1px solid #292934;border-radius:18px;box-shadow:0 28px 80px #0009;padding:12px}.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:4px 5px 11px}.sheetHead h2{font-size:15px;margin:0}.close{border:0;background:#1e1e27;color:#aaaabb;border-radius:9px;width:32px;height:32px}.toolMenu{display:grid;grid-template-columns:1fr 1fr;gap:7px}.toolTile{border:1px solid #282833;background:#17171f;color:#ededf5;border-radius:13px;padding:13px;text-align:start}.toolTile:hover{background:#1d1d26}.toolTile b{display:block;margin-bottom:3px}.toolTile span{color:#818194;font-size:11px}.pane{display:none;padding:3px 4px 7px}.pane.active{display:block}.back{border:0;background:transparent;color:#9898ac;padding:6px 3px;margin-bottom:6px}.field{display:grid;gap:6px;margin:9px 0}.field label{font-size:11px;color:#89899c}.input,.area,.select{width:100%;border:1px solid #2a2a35;background:#0e0e14;color:#ededf5;border-radius:10px;padding:9px;outline:0}.area{min-height:110px;resize:vertical}.btn{border:1px solid #2b2b37;background:#1a1a22;color:#e6e6ee;border-radius:9px;padding:8px 10px}.btn:hover{background:#22222b}.primary{border:0;background:linear-gradient(135deg,var(--purple),#6c5deb);color:#fff}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.drop{border:1px dashed #393947;background:#0f0f15;border-radius:12px;padding:20px;text-align:center;color:#8b8b9e}.fileList{display:grid;gap:6px;margin-top:8px}.fileItem{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #262631;background:#15151c;border-radius:10px;padding:8px}.codeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.codeEditor{width:100%;min-height:330px;border:1px solid #282833;background:#09090d;color:#e9e9f1;border-radius:11px;padding:10px;resize:vertical;direction:ltr;text-align:left;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.preview{width:100%;min-height:330px;border:1px solid #282833;border-radius:11px;background:#fff}.canvasWrap{min-height:240px;background:#09090d;border:1px solid #282833;border-radius:12px;display:grid;place-items:center;overflow:auto;padding:7px}.canvasWrap canvas{max-width:100%;height:auto}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font-size:11px;color:#7d7d90;min-height:16px;padding-top:5px}.ok{color:var(--good)}.err{color:var(--bad)}.mobileShade{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:50;inset:0 0 0 auto;width:min(258px,84vw);transform:translateX(105%);transition:.2s;box-shadow:-20px 0 55px #0008}.side.open{transform:translateX(0)}.mobileShade.open{display:block;position:fixed;inset:0;background:#0008;z-index:45}.menuBtn{display:grid}.top{padding:0 8px}.messages{padding:17px 12px 148px}.welcome{margin-top:8vh;padding:0 6px}.welcome h1{font-size:22px}.suggestions{grid-template-columns:1fr}.composerArea{padding:28px 7px 8px}.toolMenu,.codeGrid,.ranges{grid-template-columns:1fr}.modelMenu{right:45px}.sheet{border-radius:16px}}
@media(max-width:480px){.top .hidePhone{display:none}.welcome p{font-size:13px}.composer{border-radius:15px}.modePill{max-width:105px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heroGem{width:48px;height:48px}.welcome h1{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand"><div class="gem">✦</div><b>NovaAI</b></div>
  <button class="newChat" id="newChat">＋ <span>محادثة جديدة</span></button>
  <div class="sideLabel">المحادثات</div>
  <div class="history" id="history"></div>
  <div class="sideBottom"><button id="openSettings">⚙️ الإعدادات</button></div>
</aside>
<div class="mobileShade" id="shade"></div>
<main class="main">
  <header class="top">
    <div class="topGroup"><button class="ghost menuBtn" id="menuBtn">☰</button><button class="modelBtn" id="modelBtn">NovaAI ▾</button></div>
    <div class="topGroup"><button class="ghost hidePhone" id="exportBtn">تصدير</button><button class="ghost" id="clearBtn" title="مسح">⌫</button></div>
  </header>
  <div class="modelMenu" id="modelMenu">
    <button data-mode="general" class="active">عام</button><button data-mode="study">دراسة</button><button data-mode="coding">برمجة</button><button data-mode="research">بحث وتحليل</button><button data-mode="writing">كتابة</button>
  </div>
  <section class="stage">
    <div class="messages" id="messages"></div>
    <div class="composerArea">
      <div class="chips" id="chips"></div>
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="اسأل NovaAI أي شيء…"></textarea>
        <div class="composerBottom"><div class="leftActions"><button class="round" id="plusBtn" title="إضافة">＋</button><button class="round" id="voiceBtn" title="صوت">◉</button><button class="modePill" id="modePill">عام</button></div><div class="rightActions"><button class="send" id="sendBtn">➤</button></div></div>
      </div>
    </div>
  </section>
</main>
</div>

<div class="overlay" id="toolsOverlay"><div class="sheet"><div class="sheetHead"><h2 id="sheetTitle">إضافة إلى المحادثة</h2><button class="close" id="closeTools">×</button></div>
<div id="toolHome" class="pane active"><div class="toolMenu">
<button class="toolTile" data-pane="filesPane"><b>📎 الملفات والصور</b><span>PDF، صور، كود ونصوص</span></button>
<button class="toolTile" data-pane="imagePane"><b>🎨 الصور</b><span>تعديل محلي وتوليد AI عند ربط الخادم</span></button>
<button class="toolTile" data-pane="codePane"><b>⌨️ Code Studio</b><span>HTML مباشر مع Preview</span></button>
<button class="toolTile" data-pane="utilityPane"><b>🧰 أدوات سريعة</b><span>حاسبة، JSON وعدّ الكلمات</span></button>
</div></div>
<div id="filesPane" class="pane"><button class="back">→ رجوع</button><div class="drop" id="dropZone">اضغط أو اسحب الملفات هنا</div><input id="fileInput" type="file" hidden multiple accept=".txt,.md,.json,.csv,.html,.css,.js,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.pdf,image/png,image/jpeg,image/webp"><div class="fileList" id="fileList"></div></div>
<div id="imagePane" class="pane"><button class="back">→ رجوع</button><div class="row"><button class="btn" id="openImage">فتح صورة</button><button class="btn" id="resetImage">إعادة ضبط</button><button class="btn primary" id="saveImage">تنزيل PNG</button></div><input id="imageInput" type="file" accept="image/*" hidden><div class="ranges"><div class="field"><label>الإضاءة <span id="bVal">100</span>%</label><input id="brightness" type="range" min="0" max="200" value="100"></div><div class="field"><label>التباين <span id="cVal">100</span>%</label><input id="contrast" type="range" min="0" max="200" value="100"></div><div class="field"><label>التشبع <span id="sVal">100</span>%</label><input id="saturate" type="range" min="0" max="200" value="100"></div><div class="field"><label>Blur <span id="blVal">0</span>px</label><input id="blur" type="range" min="0" max="12" value="0"></div></div><div class="canvasWrap"><canvas id="canvas" width="800" height="520"></canvas></div><div class="field"><label>توليد صورة AI</label><textarea class="area" id="imagePrompt" placeholder="اكتب وصف الصورة…"></textarea></div><button class="btn primary" id="generateImage">توليد</button><div class="status" id="imageStatus"></div><img id="generatedImage" style="display:none;width:100%;margin-top:8px;border-radius:11px" alt="Generated"></div>
<div id="codePane" class="pane"><button class="back">→ رجوع</button><div class="row" style="margin-bottom:8px"><button class="btn primary" id="runCode">تشغيل</button><button class="btn" id="downloadCode">تنزيل HTML</button></div><div class="codeGrid"><textarea class="codeEditor" id="codeEditor"><!doctype html>
<html><body style="font-family:system-ui;padding:30px"><h1>Hello NovaAI ✦</h1></body></html></textarea><iframe class="preview" id="preview" sandbox="allow-scripts"></iframe></div></div>
<div id="utilityPane" class="pane"><button class="back">→ رجوع</button><div class="field"><label>حاسبة</label><input class="input" id="calcInput" placeholder="مثال: (25*8)+12"><button class="btn" id="calcBtn">احسب</button><div class="status" id="calcResult"></div></div><div class="field"><label>تنسيق JSON</label><textarea class="area" id="jsonInput"></textarea><button class="btn" id="jsonBtn">تنسيق</button></div><div class="field"><label>عداد النص</label><textarea class="area" id="countInput"></textarea><div class="status" id="countResult">0 كلمة • 0 حرف</div></div></div>
</div></div>

<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="sheetHead"><h2>الإعدادات</h2><button class="close" id="closeSettings">×</button></div><div class="field"><label>عنوان خادم NovaAI API</label><input class="input" id="apiBaseInput" placeholder="https://your-backend.example.com"><div class="status" id="apiStatus"></div></div><div class="row"><button class="btn primary" id="saveSettings">حفظ</button><button class="btn" id="clearLocal">مسح البيانات المحلية</button></div></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const STORE='nova_ui_v3';
let state={messages:[],history:[],files:[],mode:'general',apiBase:''};
try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}
const modeNames={general:'عام',study:'دراسة',coding:'برمجة',research:'بحث وتحليل',writing:'كتابة'};
const isPages=location.hostname.endsWith('github.io');
function save(){localStorage.setItem(STORE,JSON.stringify({...state,files:state.files.map(f=>({name:f.name,type:f.type,text:f.text||'',dataUrl:f.dataUrl||''}))}))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function format(s){return esc(s).replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/\n/g,'<br>')}
function titleFromMessages(msgs){const first=msgs.find(m=>m.role==='user');return first?first.content.slice(0,34):'محادثة جديدة'}
function archiveCurrent(){if(!state.messages.length)return;state.history.unshift({id:Date.now(),title:titleFromMessages(state.messages),messages:state.messages});state.history=state.history.slice(0,20)}
function welcome(){return `<div class="welcome"><div class="heroGem">✦</div><h1>كيف أقدر أساعدك؟</h1><p>اسأل، ارفع ملف، حلّل صورة أو اكتب كود — كل الأدوات موجودة بدون زحمة.</p><div class="suggestions"><button data-q="اشرح لي الموضوع ده ببساطة خطوة بخطوة">اشرح موضوعًا ببساطة</button><button data-q="ساعدني أبدأ مشروع برمجة مرتب من الصفر">ابدأ مشروع برمجة</button><button data-q="راجع الملف الذي سأرفعه واستخرج أهم النقاط">حلّل ملفًا</button><button data-q="ساعدني أقارن بين الاختيارات دي وأوصل لأفضل قرار">قارن اختيارات</button></div></div>`}
function render(){const el=$('#messages');if(!state.messages.length){el.innerHTML=welcome();$$('[data-q]').forEach(b=>b.onclick=()=>{$('#prompt').value=b.dataset.q;grow();$('#prompt').focus()});return}el.innerHTML=state.messages.map(m=>`<div class="msg ${m.role==='assistant'?'ai':'user'}"><div class="avatar">${m.role==='assistant'?'✦':'أ'}</div><div><div class="bubble">${format(m.content)}</div>${m.model?`<div class="meta">${esc(m.model)}</div>`:''}</div></div>`).join('');el.scrollTop=el.scrollHeight}
function renderHistory(){const h=$('#history');h.innerHTML=state.history.length?state.history.map(x=>`<button data-id="${x.id}">${esc(x.title)}</button>`).join(''):'<div class="status" style="padding:7px">لا توجد محادثات محفوظة</div>';$$('#history button').forEach(b=>b.onclick=()=>{archiveCurrent();const x=state.history.find(v=>String(v.id)===b.dataset.id);if(x){state.messages=JSON.parse(JSON.stringify(x.messages));state.history=state.history.filter(v=>v.id!==x.id);save();render();renderHistory();closeSide()}})}
function renderFiles(){const f=$('#fileList');f.innerHTML=state.files.length?state.files.map((x,i)=>`<div class="fileItem"><span>${esc(x.name)}</span><button class="btn" data-rm="${i}">حذف</button></div>`).join(''):'<div class="status">لا توجد ملفات</div>';$('#chips').innerHTML=state.files.map(x=>`<span class="chip">${esc(x.name)}</span>`).join('');$$('[data-rm]').forEach(b=>b.onclick=()=>{state.files.splice(+b.dataset.rm,1);save();renderFiles()})}
function setMode(m){state.mode=m;$('#modePill').textContent=modeNames[m]||m;$$('#modelMenu button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('#modelMenu').classList.remove('open');save()}
function grow(){const p=$('#prompt');p.style.height='auto';p.style.height=Math.min(p.scrollHeight,135)+'px'}
function api(path){const base=(state.apiBase||'').replace(/\/$/,'');return base?base+path:path}
function addAssistant(text,model=''){state.messages.push({role:'assistant',content:text,model});save();render()}
async function send(){const p=$('#prompt'),text=p.value.trim();if(!text)return;state.messages.push({role:'user',content:text});p.value='';grow();save();render();$('#sendBtn').disabled=true;
 if(isPages&&!state.apiBase){addAssistant('المحادثة الذكية محتاجة خادم API متصل. الأدوات المحلية شغالة عادي، ومن الإعدادات تقدر تربط عنوان الخادم لما يكون جاهز.');$('#sendBtn').disabled=false;return}
 try{const attachments=state.files.map(f=>({name:f.name,type:f.type,text:f.text||'',dataUrl:f.dataUrl||''}));const history=state.messages.slice(-24,-1);const r=await fetch(api('/api/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:state.mode,history,attachments})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);addAssistant(d.reply||'لم يصل رد.',d.model||'')}catch(e){addAssistant('تعذر الاتصال بخادم الذكاء الاصطناعي. راجع عنوان API في الإعدادات.') }finally{$('#sendBtn').disabled=false}}
$('#prompt').addEventListener('input',grow);$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#sendBtn').onclick=send;
$('#newChat').onclick=()=>{archiveCurrent();state.messages=[];state.files=[];save();render();renderFiles();renderHistory();closeSide()};$('#clearBtn').onclick=()=>{state.messages=[];save();render()};
$('#exportBtn').onclick=()=>{const text=state.messages.map(m=>`${m.role==='user'?'User':'NovaAI'}: ${m.content}`).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='nova-chat.txt';a.click();URL.revokeObjectURL(a.href)};
$('#modelBtn').onclick=e=>{e.stopPropagation();$('#modelMenu').classList.toggle('open')};$('#modePill').onclick=()=>$('#modelMenu').classList.toggle('open');$$('#modelMenu button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.addEventListener('click',e=>{if(!e.target.closest('#modelMenu')&&!e.target.closest('#modelBtn')&&!e.target.closest('#modePill'))$('#modelMenu').classList.remove('open')});
function openSide(){$('#side').classList.add('open');$('#shade').classList.add('open')}function closeSide(){$('#side').classList.remove('open');$('#shade').classList.remove('open')}$('#menuBtn').onclick=openSide;$('#shade').onclick=closeSide;
function openOverlay(id){$(id).classList.add('open')}function closeOverlay(id){$(id).classList.remove('open')}$('#plusBtn').onclick=()=>{showPane('toolHome');openOverlay('#toolsOverlay')};$('#closeTools').onclick=()=>closeOverlay('#toolsOverlay');$('#openSettings').onclick=()=>{syncApiStatus();openOverlay('#settingsOverlay');closeSide()};$('#closeSettings').onclick=()=>closeOverlay('#settingsOverlay');
function showPane(id){$$('#toolsOverlay .pane').forEach(p=>p.classList.remove('active'));$('#'+id).classList.add('active');$('#sheetTitle').textContent=id==='toolHome'?'إضافة إلى المحادثة':({filesPane:'الملفات والصور',imagePane:'الصور',codePane:'Code Studio',utilityPane:'أدوات سريعة'}[id]||'الأدوات')}
$$('.toolTile').forEach(b=>b.onclick=()=>showPane(b.dataset.pane));$$('.back').forEach(b=>b.onclick=()=>showPane('toolHome'));
async function readFile(file){const out={name:file.name,type:file.type,text:'',dataUrl:''};if(file.type.startsWith('image/')){out.dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});return out}if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){if(!window.pdfjsLib)throw new Error('PDF reader not loaded');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise;let text='';for(let i=1;i<=Math.min(pdf.numPages,40);i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent();text+='\n'+tc.items.map(x=>x.str).join(' ')}out.text=text.slice(0,70000);return out}out.text=(await file.text()).slice(0,70000);return out}
async function addFiles(list){for(const file of [...list].slice(0,6)){try{state.files.push(await readFile(file))}catch(e){}}save();renderFiles()}
$('#dropZone').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>addFiles(e.target.files);$('#dropZone').ondragover=e=>e.preventDefault();$('#dropZone').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
let imgObj=null;const cv=$('#canvas'),ctx=cv.getContext('2d');function drawImage(){ctx.clearRect(0,0,cv.width,cv.height);if(!imgObj){ctx.fillStyle='#777';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('افتح صورة للبدء',cv.width/2,cv.height/2);return}const b=$('#brightness').value,c=$('#contrast').value,s=$('#saturate').value,bl=$('#blur').value;ctx.filter=`brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px)`;const sc=Math.min(cv.width/imgObj.width,cv.height/imgObj.height);const w=imgObj.width*sc,h=imgObj.height*sc;ctx.drawImage(imgObj,(cv.width-w)/2,(cv.height-h)/2,w,h);ctx.filter='none'}
$('#openImage').onclick=()=>$('#imageInput').click();$('#imageInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{imgObj=im;drawImage();URL.revokeObjectURL(u)};im.src=u};['brightness','contrast','saturate','blur'].forEach(id=>$('#'+id).oninput=()=>{$('#'+({brightness:'bVal',contrast:'cVal',saturate:'sVal',blur:'blVal'}[id])).textContent=$('#'+id).value;drawImage()});$('#resetImage').onclick=()=>{[['brightness',100],['contrast',100],['saturate',100],['blur',0]].forEach(([id,v])=>{$('#'+id).value=v});$('#bVal').textContent=100;$('#cVal').textContent=100;$('#sVal').textContent=100;$('#blVal').textContent=0;drawImage()};$('#saveImage').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='nova-image.png';a.click()};drawImage();
$('#generateImage').onclick=async()=>{const text=$('#imagePrompt').value.trim(),st=$('#imageStatus');if(!text)return;if(isPages&&!state.apiBase){st.className='status err';st.textContent='توليد AI يحتاج خادم API متصل.';return}st.className='status';st.textContent='جاري التوليد…';try{const r=await fetch(api('/api/image'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,model:'flux',width:1024,height:1024})});if(!r.ok)throw new Error();const blob=await r.blob(),u=URL.createObjectURL(blob),im=$('#generatedImage');im.src=u;im.style.display='block';st.className='status ok';st.textContent='تم التوليد'}catch(e){st.className='status err';st.textContent='تعذر الاتصال بخادم الصور.'}};
$('#runCode').onclick=()=>$('#preview').srcdoc=$('#codeEditor').value;$('#downloadCode').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#codeEditor').value],{type:'text/html'}));a.download='nova-project.html';a.click();URL.revokeObjectURL(a.href)};$('#runCode').click();
$('#calcBtn').onclick=()=>{try{const s=$('#calcInput').value;if(!/^[0-9+\-*/().%\s]+$/.test(s))throw 0;$('#calcResult').textContent=String(Function('return ('+s+')')())}catch(e){$('#calcResult').textContent='صيغة غير صحيحة'}};$('#jsonBtn').onclick=()=>{try{$('#jsonInput').value=JSON.stringify(JSON.parse($('#jsonInput').value),null,2)}catch(e){alert('JSON غير صحيح')}};$('#countInput').oninput=e=>{const t=e.target.value.trim();$('#countResult').textContent=`${t?t.split(/\s+/).length:0} كلمة • ${e.target.value.length} حرف`};
$('#voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('الإملاء الصوتي غير مدعوم في هذا المتصفح.');return}const r=new SR();r.lang='ar-EG';r.interimResults=false;r.onresult=e=>{$('#prompt').value+=( $('#prompt').value?' ':'')+e.results[0][0].transcript;grow()};r.start()};
function syncApiStatus(){const inp=$('#apiBaseInput'),st=$('#apiStatus');inp.value=state.apiBase||'';if(state.apiBase){st.className='status ok';st.textContent='خادم AI مضاف.'}else if(isPages){st.className='status';st.textContent='GitHub Pages يشغّل الواجهة والأدوات المحلية فقط؛ أضف رابط خادم API لتفعيل المحادثة وتوليد AI.'}else{st.className='status';st.textContent='سيتم استخدام /api في نفس النطاق.'}}
$('#saveSettings').onclick=()=>{state.apiBase=$('#apiBaseInput').value.trim().replace(/\/$/,'');save();syncApiStatus()};$('#clearLocal').onclick=()=>{localStorage.removeItem(STORE);location.reload()};
render();renderHistory();renderFiles();setMode(state.mode||'general');syncApiStatus();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=3').catch(()=>{});
