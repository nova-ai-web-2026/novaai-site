<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>NovaAI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#0b0c10;--panel:#111319;--panel2:#171a22;--line:#252936;--text:#f7f7f8;--muted:#9399a8;--accent:#8b5cf6;--accent2:#d946ef;--ok:#34d399;--bad:#fb7185}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}button,textarea{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:230px minmax(0,1fr);overflow:hidden}.side{background:#0e1015;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}.brand{display:flex;gap:10px;align-items:center;padding:4px}.logo{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.new{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 12px;text-align:right;cursor:pointer}.new:hover{background:#1d2029}.sideInfo{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:11px;line-height:1.6}.main{min-width:0;display:grid;grid-template-rows:58px 1fr;position:relative}.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #171923;background:#0b0c10e8;backdrop-filter:blur(12px);z-index:5}.model{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#13151c;border-radius:12px;padding:8px 11px}.model b{font-size:13px}.model small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.messages{overflow:auto;padding:30px 16px 155px}.column{max-width:820px;margin:auto}.welcome{min-height:52vh;display:grid;place-content:center;text-align:center;padding:30px}.big{width:52px;height:52px;border-radius:17px;margin:0 auto 15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:24px;box-shadow:0 18px 50px #8b5cf633}.welcome h1{font-size:26px;margin:0 0 8px}.welcome p{font-size:13px;color:var(--muted);margin:0}.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;margin-bottom:24px}.avatar{width:30px;height:30px;border:1px solid var(--line);background:#171a22;border-radius:10px;display:grid;place-items:center;font-size:12px}.bubble{font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{display:inline-block;max-width:min(680px,93%);background:#171a22;border:1px solid var(--line);padding:10px 12px;border-radius:14px}.meta{font-size:10px;color:#777d8a;margin-top:6px}.typing{display:flex;align-items:center;gap:8px;color:#8f95a4;font-size:12px;margin:0 43px 18px}.dots{display:flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:#747b8a;animation:p 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}.composerWrap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 20px;background:linear-gradient(180deg,transparent,#0b0c10 35%)}.composer{max-width:820px;margin:auto;border:1px solid #303544;background:#151821;border-radius:18px;padding:8px;box-shadow:0 18px 50px #0007}.row{display:flex;align-items:flex-end;gap:7px}.prompt{flex:1;resize:none;outline:0;border:0;background:transparent;color:var(--text);padding:11px 8px;min-height:43px;max-height:150px;line-height:1.45}.prompt::placeholder{color:#727988}.send{width:40px;height:40px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;cursor:pointer;font-weight:900}.send:disabled{opacity:.45}.auth{border:1px solid var(--line);background:transparent;color:#b8becc;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:11px}.auth:hover{background:#171a22}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#1d2029;border:1px solid #343949;border-radius:11px;padding:9px 12px;font-size:12px;box-shadow:0 12px 40px #0009}.menuBtn{display:none;border:1px solid var(--line);background:transparent;color:white;border-radius:10px;width:36px;height:36px}.shade{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;right:0;top:0;bottom:0;width:min(280px,86vw);z-index:40;transform:translateX(105%);transition:.2s}.side.open{transform:translateX(0)}.shade{position:fixed;inset:0;background:#0008;z-index:35}.shade.open{display:block}.menuBtn{display:block}.top{padding:0 10px}.messages{padding-left:12px;padding-right:12px}.composerWrap{padding:12px 10px 14px}.welcome h1{font-size:23px}.status span{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="brand"><div class="logo">✦</div><div><b>NovaAI</b><small>Final strict build</small></div></div><button class="new" id="newChat">＋ محادثة جديدة</button><div class="sideInfo">النموذج الأساسي: Claude Opus 5<br>البديل فقط عند فشل Opus: Qwen3.8 Max<br>لا يوجد Automatic ولا Claude 4.5 في هذه النسخة.</div></aside>
<div class="shade" id="shade"></div>
<main class="main"><header class="top"><div style="display:flex;gap:8px;align-items:center"><button class="menuBtn" id="menuBtn">☰</button><div class="model"><div><b id="modelName">Claude Opus 5</b><small id="modelId">anthropic/claude-opus-5</small></div></div></div><div style="display:flex;gap:8px;align-items:center"><button class="auth" id="authBtn">تسجيل الدخول</button><div class="status"><i class="dot" id="dot"></i><span id="statusText">جاهز</span></div></div></header><section class="messages" id="messages"><div class="column" id="column"></div></section><div class="composerWrap"><div class="composer"><div class="row"><textarea id="prompt" class="prompt" rows="1" placeholder="اكتب رسالتك…"></textarea><button id="send" class="send" aria-label="إرسال">↑</button></div></div></div></main>
</div>
<script>
(()=>{'use strict';
const OPUS='anthropic/claude-opus-5';
const QWEN='qwen/qwen3.8-max';
const $=s=>document.querySelector(s);
let messages=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),3000)}
function status(t,k='warn'){const d=$('#dot');d.className='dot'+(k==='ok'?' ok':k==='bad'?' bad':'');$('#statusText').textContent=t}
function setModel(label,id){$('#modelName').textContent=label;$('#modelId').textContent=id}
function render(){const c=$('#column');if(!messages.length){c.innerHTML='<div class="welcome"><div class="big">✦</div><h1>كيف أقدر أساعدك؟</h1><p>Claude Opus 5 بشكل صريح، مع Qwen3.8 Max كبديل عند الفشل فقط.</p></div>';return}c.innerHTML=messages.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}"><div class="avatar">${m.role==='user'?'أ':'✦'}</div><div><div class="bubble">${esc(m.content)}</div>${m.model?`<div class="meta">${esc(m.model)}</div>`:''}</div></div>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight}
function typing(t){let x=$('#typing');if(!x){x=document.createElement('div');x.id='typing';x.className='typing';x.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span></span>';$('#column').appendChild(x)}x.querySelector('span:last-child').textContent=t;$('#messages').scrollTop=$('#messages').scrollHeight}
function stopTyping(){$('#typing')?.remove()}
function normalize(r){const raw=r?.message?.content??r?.content??r;if(typeof raw==='string')return raw;if(Array.isArray(raw))return raw.map(x=>typeof x==='string'?x:(x?.text||x?.content||'')).join('');if(raw&&typeof raw==='object'&&typeof raw.text==='string')return raw.text;return String(raw||'')}
function authIfNeeded(){if(!window.puter?.auth)throw new Error('Puter.js لم يتم تحميله');if(puter.auth.isSignedIn?.())return null;status('تسجيل الدخول…');return puter.auth.signIn({attempt_temp_user_creation:true})}
function convo(text){const hist=messages.slice(-18,-1).map(m=>({role:m.role,content:m.content}));return [{role:'system',content:'You are NovaAI, a precise and capable assistant. Reply naturally in the user language. Be accurate and practical.'},...hist,{role:'user',content:text}]}
async function call(model,conversation){return puter.ai.chat(conversation,{model})}
async function send(){const p=$('#prompt'),b=$('#send'),text=p.value.trim();if(!text||b.disabled)return;let ap;try{ap=authIfNeeded()}catch(e){toast(String(e.message||e));return}messages.push({role:'user',content:text});p.value='';grow();render();b.disabled=true;typing(ap?'أكمل تسجيل الدخول…':'تشغيل Claude Opus 5…');try{if(ap)await ap;status('متصل','ok');const c=convo(text);let r,usedLabel,usedId;try{typing('تشغيل Claude Opus 5…');r=await call(OPUS,c);usedLabel='Claude Opus 5';usedId=OPUS}catch(opusErr){typing('Opus 5 لم يعمل، تشغيل Qwen3.8 Max…');r=await call(QWEN,c);usedLabel='Qwen3.8 Max';usedId=QWEN}const reply=normalize(r).trim();if(!reply)throw new Error('وصل رد فارغ');stopTyping();setModel(usedLabel,usedId);status('متصل · '+usedLabel,'ok');messages.push({role:'assistant',content:reply,model:usedLabel+' · '+usedId});render()}catch(e){stopTyping();status('تعذر الاتصال','bad');messages.push({role:'assistant',content:'تعذر تشغيل الذكاء الاصطناعي: '+String(e?.msg||e?.message||e),model:'System'});render()}finally{b.disabled=false;p.focus()}}
function grow(){const p=$('#prompt');p.style.height='auto';p.style.height=Math.min(p.scrollHeight,150)+'px'}
$('#send').onclick=send;$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#prompt').addEventListener('input',grow);$('#newChat').onclick=()=>{messages=[];setModel('Claude Opus 5',OPUS);status('جاهز');render()};$('#authBtn').onclick=async()=>{try{if(!puter.auth.isSignedIn?.())await puter.auth.signIn({attempt_temp_user_creation:true});$('#authBtn').textContent='متصل';status('متصل','ok');toast('تم تسجيل الدخول')}catch(e){toast(String(e?.msg||e?.message||e))}};$('#menuBtn').onclick=()=>{$('#side').classList.add('open');$('#shade').classList.add('open')};$('#shade').onclick=()=>{$('#side').classList.remove('open');$('#shade').classList.remove('open')};render();
})();
</script>
</body></html>
