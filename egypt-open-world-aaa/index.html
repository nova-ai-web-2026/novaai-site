<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#171512" />
  <title>شوارع النور — نموذج أولي</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="boot" class="overlay">
    <div class="panel hero">
      <div class="eyebrow">نموذج لعب أصلي — Vertical Slice</div>
      <h1>شوارع <span>النور</span></h1>
      <p>ابدأ يومك في حي «عزبة النور»، انزل هات الفطار، واتعامل مع شارع حي بيتغيّر مع الوقت والناس والمرور.</p>
      <div class="menu-actions">
        <button id="newGame" class="primary">لعبة جديدة</button>
        <button id="continueGame">كمل من آخر حفظ</button>
        <button id="howTo">التحكم</button>
      </div>
      <div id="bootStatus" class="muted"></div>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="topbar">
      <div class="stats glass">
        <div><small>الفلوس</small><strong id="money">٣٠٠ ج</strong></div>
        <div><small>الصحة</small><strong id="health">١٠٠٪</strong></div>
        <div><small>الطاقة</small><strong id="stamina">١٠٠٪</strong></div>
        <div><small>الشرطة</small><strong id="heat">هادية</strong></div>
      </div>
      <div class="clock glass"><strong id="time">٠٧:٤٥</strong><small id="day">اليوم ١</small></div>
    </div>

    <section class="mission glass">
      <small>المهمة الحالية</small>
      <h2 id="missionTitle">هات الفطار</h2>
      <p id="objective">اخرج من الشقة</p>
      <div id="objectiveProgress" class="progress"></div>
    </section>

    <div id="prompt" class="prompt glass"></div>
    <div id="toast" class="toast glass"></div>
    <div id="dialogue" class="dialogue glass" hidden>
      <strong id="speaker"></strong>
      <p id="dialogueText"></p>
    </div>

    <div class="controls glass">
      <span>WASD حركة</span><span>Shift جري</span><span>E تفاعل</span><span>R إعادة</span>
      <button id="saveBtn">حفظ</button>
    </div>
  </div>

  <div id="modal" class="overlay" hidden>
    <div class="panel">
      <h2 id="modalTitle">التحكم</h2>
      <div id="modalBody"></div>
      <button id="closeModal" class="primary">تمام</button>
    </div>
  </div>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
