<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c10"><title>NovaAI</title><script src="https://js.puter.com/v2/"></script><style>:root{--bg:#0b0c10;--p:#111319;--p2:#171a22;--line:#272b37;--t:#f7f7f8;--m:#9298a7;--a:#8b5cf6;--b:#d946ef;--ok:#34d399;--bad:#fb7185}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,textarea{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:220px 1fr;overflow:hidden}.side{border-left:1px solid var(--line);background:#0e1015;padding:14px;display:flex;flex-direction:column;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:900}.brand b{font-size:17px}.brand small{display:block;font-size:10px;color:var(--m)}.new{border:1px solid var(--line);background:var(--p2);color:var(--t);border-radius:11px;padding:10px 12px;text-align:right;cursor:pointer}.main{min-width:0;display:grid;grid-template-rows:58px 1fr;position:relative}.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #171923}.model{border:1px solid var(--line);background:#13151c;border-radius:12px;padding:8px 11px}.model b{font-size:13px}.model small{display:block;color:var(--m);font-size:10px;margin-top:1px}.status{font-size:11px;color:var(--m);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.auth{border:1px solid var(--line);background:transparent;color:#c0c5d1;border-radius:10px;padding:8px 10px;font-size:11px;cursor:pointer}.messages{overflow:auto;padding:30px 16px 155px}.col{max-width:820px;margin:auto}.welcome{min-height:52vh;display:grid;place-content:center;text-align:center}.welcome .big{width:52px;height:52px;border-radius:17px;margin:0 auto 15px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:24px}.welcome h1{font-size:26px;margin:0 0 8px}.welcome p{font-size:13px;color:var(--m);margin:0}.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;margin-bottom:24px}.avatar{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--p2);display:grid;place-items:center;font-size:12px}.bubble{font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{display:inline-block;max-width:min(680px,93%);background:var(--p2);border:1px solid var(--line);padding:10px 12px;border-radius:14px}.meta{font-size:10px;color:#777d8a;margin-top:6px}.typing{display:flex;align-items:center;gap:8px;color:#8f95a4;font-size:12px;margin:0 43px 18px}.dots{display:flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:#747b8a;animation:p 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}.composerWrap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 20px;background:linear-gradient(180deg,transparent,#0b0c10 35%)}.composer{max-width:820px;margin:auto;border:1px solid #303544;background:#151821;border-radius:18px;padding:8px}.row{display:flex;align-items:flex-end;gap:7px}.prompt{flex:1;resize:none;outline:0;border:0;background:transparent;color:var(--t);padding:11px 8px;min-height:43px;max-height:150px;line-height:1.45}.send{width:40px;height:40px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;cursor:pointer;font-weight:900}.send:disabled{opacity:.45}.menu{display:none}.shade{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;right:0;top:0;bottom:0;width:min(280px,86vw);z-index:40;transform:translateX(105%);transition:.2s}.side.open{transform:translateX(0)}.shade{position:fixed;inset:0;background:#0008;z-index:35}.shade.open{display:block}.menu{display:block;border:1px solid var(--line);background:transparent;color:white;border-radius:10px;width:36px;height:36px}.top{padding:0 10px}.messages{padding-left:12px;padding-right:12px}.composerWrap{padding:12px 10px 14px}.status span{display:none}}</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">✦</div><div><b>NovaAI</b><small>Strict model build</small></div></div><button class="new" id="newChat">＋ محادثة جديدة</button></aside><div class="shade" id="shade"></div><main class="main"><header class="top"><div style="display:flex;gap:8px;align-items:center"><button class="menu" id="menu">☰</button><div class="model"><b id="modelName">Claude Opus 5</b><small id="modelId">anthropic/claude-opus-5</small></div></div><div style="display:flex;align-items:center;gap:8px"><button class="auth" id="auth">تسجيل الدخول</button><div class="status"><i class="dot" id="dot"></i><span id="st">جاهز</span></div></div></header><section class="messages" id="messages"><div class="col" id="col"></div></section><div class="composerWrap"><div class="composer"><div class="row"><textarea class="prompt" id="prompt" rows="1" placeholder="اكتب رسالتك…"></textarea><button class="send" id="send">↑</button></div></div></div></main></div><script>(()=>{'use strict';const OPUS='anthropic/claude-opus-5',QWEN='qwen/qwen3.8-max',$=s=>document.querySelector(s);let msgs=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(t,k=''){let d=$('#dot');d.className='dot'+(k==='ok'?' ok':k==='bad'?' bad':'');$('#st').textContent=t}function setModel(n,id){$('#modelName').textContent=n;$('#modelId').textContent=id}function render(){let c=$('#col');if(!msgs.length){c.innerHTML='<div class="welcome"><div class="big">✦</div><h1>كيف أقدر أساعدك؟</h1><p>Claude Opus 5 هو النموذج الأساسي، وQwen3.8 Max بديل عند تعذر تشغيله.</p></div>';return}c.innerHTML=msgs.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}"><div class="avatar">${m.role==='user'?'أ':'✦'}</div><div><div class="bubble">${esc(m.content)}</div>${m.model?`<div class="meta">${esc(m.model)}</div>`:''}</div></div>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight}function typing(t){let x=$('#typing');if(!x){x=document.createElement('div');x.id='typing';x.className='typing';x.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span></span>';$('#col').appendChild(x)}x.querySelector('span:last-child').textContent=t}function stop(){$('#typing')?.remove()}function norm(r){let x=r?.message?.content??r?.content??r;if(typeof x==='string')return x;if(Array.isArray(x))return x.map(v=>typeof v==='string'?v:(v?.text||v?.content||'')).join('');return x?.text||String(x||'')}function authNeeded(){if(!window.puter?.auth)throw new Error('Puter.js لم يتم تحميله');if(puter.auth.isSignedIn?.())return null;status('تسجيل الدخول…');return puter.auth.signIn({attempt_temp_user_creation:true})}function conv(text){let h=msgs.slice(-18,-1).map(m=>({role:m.role,content:m.content}));return [{role:'system',content:'You are NovaAI, a precise and capable assistant. Reply naturally in the user language. Be accurate and practical.'},...h,{role:'user',content:text}]}async function run(model,c){return puter.ai.chat(c,{model})}async function send(){let p=$('#prompt'),b=$('#send'),text=p.value.trim();if(!text||b.disabled)return;let ap;try{ap=authNeeded()}catch(e){status('تعذر الاتصال','bad');return}msgs.push({role:'user',content:text});p.value='';grow();render();b.disabled=true;typing(ap?'أكمل تسجيل الدخول…':'تشغيل Claude Opus 5…');try{if(ap)await ap;let c=conv(text),r,n,id;try{typing('تشغيل Claude Opus 5…');r=await run(OPUS,c);n='Claude Opus 5';id=OPUS}catch(e){typing('تشغيل Qwen3.8 Max…');r=await run(QWEN,c);n='Qwen3.8 Max';id=QWEN}let reply=norm(r).trim();if(!reply)throw new Error('وصل رد فارغ');stop();setModel(n,id);status('متصل · '+n,'ok');msgs.push({role:'assistant',content:reply,model:n+' · '+id});render()}catch(e){stop();status('تعذر الاتصال','bad');msgs.push({role:'assistant',content:'تعذر تشغيل الذكاء الاصطناعي: '+String(e?.msg||e?.message||e),model:'System'});render()}finally{b.disabled=false;p.focus()}}function grow(){let p=$('#prompt');p.style.height='auto';p.style.height=Math.min(p.scrollHeight,150)+'px'}$('#send').onclick=send;$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#prompt').addEventListener('input',grow);$('#newChat').onclick=()=>{msgs=[];setModel('Claude Opus 5',OPUS);status('جاهز');render()};$('#auth').onclick=async()=>{try{if(!puter.auth.isSignedIn?.())await puter.auth.signIn({attempt_temp_user_creation:true});$('#auth').textContent='متصل';status('متصل','ok')}catch(e){status('تعذر الاتصال','bad')}};$('#menu').onclick=()=>{$('#side').classList.add('open');$('#shade').classList.add('open')};$('#shade').onclick=()=>{$('#side').classList.remove('open');$('#shade').classList.remove('open')};render()})();</script></body></html>
