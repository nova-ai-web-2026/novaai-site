<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<style>
html,body{height:100%;margin:0;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.logo{font-size:44px;font-weight:800}.msg{margin-top:18px;color:#9999b5;line-height:1.8}.err{max-width:760px;color:#ff8bad;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري تشغيل NOVA AI…</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 const base='../nova-ai-original-clean/';
 const direct=['raw-1.js','raw-2.js','raw-3.js','raw-4.js','raw-5.js'];
 const encoded=['raw-6b.js','raw-7b.js','raw-8b.js'];
 const stamp='js-literal-parser-32';
 const fail=(msg)=>{status.className='msg err';status.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+msg;};
 async function loadText(name){
   const r=await fetch(base+name+'?v='+stamp,{cache:'no-store'});
   if(!r.ok) throw new Error(name+' لم يُحمّل: HTTP '+r.status);
   const t=await r.text();
   if(!t.trim()) throw new Error(name+' فارغ');
   return t;
 }
 function extractPush(source,target,name){
   const marker='window.'+target+'.push(';
   const start=source.indexOf(marker),end=source.lastIndexOf(');');
   if(start<0||end<0||end<=start) throw new Error(name+' تنسيقه غير صحيح');
   const arg=source.slice(start+marker.length,end).trim();
   try{
     const value=Function('"use strict";return ('+arg+');')();
     if(typeof value!=='string') throw new Error('المحتوى ليس نصًا');
     return value;
   }catch(e){
     throw new Error(name+' تعذر قراءة محتواه كـ JavaScript string: '+e.message);
   }
 }
 function decode64(input){
   const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
   const map=new Int16Array(128);map.fill(-1);for(let i=0;i<alphabet.length;i++)map[alphabet.charCodeAt(i)]=i;
   const clean=String(input||'').replace(/[^A-Za-z0-9+/]/g,'');const out=new Uint8Array(Math.ceil(clean.length*3/4));let oi=0;
   for(let i=0;i<clean.length;i+=4){const a=map[clean.charCodeAt(i)],b=i+1<clean.length?map[clean.charCodeAt(i+1)]:0,c=i+2<clean.length?map[clean.charCodeAt(i+2)]:0,d=i+3<clean.length?map[clean.charCodeAt(i+3)]:0;if(a<0||b<0||c<0||d<0)throw new Error('Base64 غير صالح');const n=(a<<18)|(b<<12)|(c<<6)|d;out[oi++]=(n>>16)&255;if(i+2<clean.length)out[oi++]=(n>>8)&255;if(i+3<clean.length)out[oi++]=n&255;}
   return new TextDecoder('utf-8').decode(out.subarray(0,oi));
 }
 try{
   const chunks=[];status.textContent='جاري قراءة أجزاء NOVA AI… 0/8';
   for(let i=0;i<direct.length;i++){const src=await loadText(direct[i]);chunks.push(extractPush(src,'__NOVA_HTML',direct[i]));status.textContent='جاري قراءة أجزاء NOVA AI… '+(i+1)+'/8';}
   for(let i=0;i<encoded.length;i++){const src=await loadText(encoded[i]);const b64=extractPush(src,'__NOVA_JS64',encoded[i]);const decoded=decode64(b64);chunks.push(extractPush(decoded,'__NOVA_HTML',encoded[i]+' decoded'));status.textContent='جاري قراءة أجزاء NOVA AI… '+(direct.length+i+1)+'/8';}
   if(chunks.length!==8)throw new Error('عدد الأجزاء النهائي '+chunks.length+'/8');
   let html=chunks.join('');if(!html.includes('initApp()'))throw new Error('ملف التطبيق النهائي غير مكتمل');
   html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>NOVA AI</title>').replaceAll('NovaAI','NOVA AI');document.open();document.write(html);document.close();
 }catch(e){fail(e&&e.message?e.message:String(e));}
})();
</script>
</body>
</html>
