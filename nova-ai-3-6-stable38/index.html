<script>(async()=>{const s=document.getElementById('s');const fail=m=>{s.className='msg err';s.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+m;};try{if(window.__NOVA_ERR)throw new Error('تعذر تحميل '+window.__NOVA_ERR);if(window.__NOVA_HTML.length!==8)throw new Error('الأجزاء '+window.__NOVA_HTML.length+'/8');const html=window.__NOVA_HTML.join('');const bytes=new TextEncoder().encode(html);if(bytes.length!==75084)throw new Error('حجم النسخة '+bytes.length+' بدل 75084');const dig=await crypto.subtle.digest('SHA-256',bytes);const sha=[...new Uint8Array(dig)].map(b=>b.toString(16).padStart(2,'0')).join('');const expected='e4838d69bbe875828540648f1e8539c86e1b503586884f726dd607f4af1c0207';if(sha!==expected)throw new Error('بصمة النسخة لا تطابق الأصل: '+sha);s.textContent='تم التحقق من النسخة الأصلية ✅';setTimeout(()=>{document.open();document.write(html);document.close();},80);}catch(e){fail(e&&e.message?e.message:String(e));}})();</script></body></html>
