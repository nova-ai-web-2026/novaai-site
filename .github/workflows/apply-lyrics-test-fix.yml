name: Apply NovaBeat Lyrics Test Fix
on:
  push:
    paths:
      - 'music-ai/patch-lyrics-tests.py'
      - '.github/workflows/apply-lyrics-test-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 music-ai/patch-lyrics-tests.py
      - run: node --check music-ai/e2e.spec.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-ai/e2e.spec.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix lyrics fallback regression tests'
          git push
