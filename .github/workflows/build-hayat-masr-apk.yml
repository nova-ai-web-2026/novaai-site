name: Build Hayat Masr APK

on:
  push:
    branches:
      - android-apk-v11-24
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-hayat-masr-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk Hayat-Masr-v11.30.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hayat-Masr-v11.30.0-APK
          path: Hayat-Masr-v11.30.0.apk
          if-no-files-found: error
