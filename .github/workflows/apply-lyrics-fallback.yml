name: Apply NovaBeat Lyrics Fallback
on:
  push:
    paths:
      - 'music-ai/patch-lyrics-fallback.py'
      - '.github/workflows/apply-lyrics-fallback.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 music-ai/patch-lyrics-fallback.py
      - name: Syntax checks
        run: |
          node --check music-ai/models-v2.js
          node --check music-ai/ultra-vocals.js
      - name: Verify fallback wiring
        run: |
          grep -q 'lyricsfix1' music-ai/index.html
          grep -q 'Instrumental بدل الصمت' music-ai/ultra-vocals.js
          grep -q 'autoPlay=audio.play' music-ai/models-v2.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-ai/models-v2.js music-ai/ultra-vocals.js music-ai/index.html music-ai/e2e.spec.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Ultra lyrics no-sound fallback'
          git push
