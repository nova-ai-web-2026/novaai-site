name: Verify Egyptian Life actors and camera
on:
  workflow_call:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - 'scripts/test-egypt-life-actors.mjs'
      - '.github/workflows/test-egypt-life-v11-16-start-scene.yml'
permissions:
  contents: read
jobs:
  start-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0
      - run: python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/actors-server.log 2>&1 &
      - run: node scripts/test-egypt-life-actors.mjs
