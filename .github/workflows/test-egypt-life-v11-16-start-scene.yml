name: Test Egyptian Life Simulator V11.16 Start Scene

on:
  workflow_call:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v11-16-start-scene.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate V11.16 files
        run: |
          test -s egypt-life-sim-v2/game-v11-12-ui.js
          test -s egypt-life-sim-v2/v11-16.html
          node --check egypt-life-sim-v2/game-v11-12-ui.js
          grep -Fq "hardeningVersion:'11.16'" egypt-life-sim-v2/game-v11-12-ui.js
          grep -Fq "dedicatedPreviewCamera:true" egypt-life-sim-v2/game-v11-12-ui.js
          grep -Fq "game-v11-12-ui.js?v=11.16" egypt-life-sim-v2/v11-16.html
          grep -Fq "game-v11-15-real-sfx.js?v=11.15" egypt-life-sim-v2/v11-16.html
          grep -Fq "game-v11-12-ui.js?v=11.16" egypt-life-sim-v2/v11-15.html
      - name: Install Chromium and PNG tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/v1116-server.log 2>&1 &
          sleep 2
      - name: Verify visible moving start scene
        run: |
          cat > v1116-start.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
          await page.goto('http://127.0.0.1:4173/v11-16.html?ci=start-scene',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.__V1116_START_SCENE?.hardeningVersion==='11.16'&&window.__V1116_START_SCENE?.previewActive===true,{timeout:60000});
          await page.waitForTimeout(900);

          const before=await page.evaluate(()=>({
            state:window.__V1116_START_SCENE,
            menu:getComputedStyle(document.getElementById('menu')).display,
            menuBg:getComputedStyle(document.getElementById('menu')).backgroundImage,
            activeCamera:window.BABYLON?.Engine?.LastCreatedEngine?.scenes?.[0]?.activeCamera?.name||null,
            sfxScript:!!document.querySelector('script[data-egypt-v1115-sfx]'),
            errorVisible:getComputedStyle(document.getElementById('errorBox')).display!=='none'
          }));
          if(before.menu==='none'||!before.state.canvasVisible||before.state.sceneMeshes<50)throw new Error('Preview scene not visibly armed '+JSON.stringify(before));
          if(before.activeCamera!=='v1116PreviewCamera')throw new Error('Dedicated preview camera not active '+JSON.stringify(before));
          if(!before.sfxScript)throw new Error('V11.15 sampled SFX missing from V11.16 entry');
          if(before.errorVisible)throw new Error('Error box visible before start');

          await page.locator('#game').screenshot({path:'v1116-canvas-a.png'});
          const p1=before.state.previewCamera;
          await page.waitForTimeout(850);
          const p2=await page.evaluate(()=>window.__V1116_START_SCENE?.previewCamera);
          await page.locator('#game').screenshot({path:'v1116-canvas-b.png'});
          const cameraTravel=Math.hypot((p2?.x||0)-(p1?.x||0),(p2?.y||0)-(p1?.y||0),(p2?.z||0)-(p1?.z||0));
          if(cameraTravel<.03)throw new Error('Preview camera is not moving '+JSON.stringify({p1,p2,cameraTravel}));

          const a=PNG.sync.read(fs.readFileSync('v1116-canvas-a.png'));
          const b=PNG.sync.read(fs.readFileSync('v1116-canvas-b.png'));
          let sum=0,sum2=0,diff=0,count=0,nonDark=0;
          for(let i=0;i<a.data.length;i+=4){
            const lum=(a.data[i]+a.data[i+1]+a.data[i+2])/3;
            sum+=lum;sum2+=lum*lum;count++;if(lum>28)nonDark++;
            diff+=Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2]);
          }
          const mean=sum/count,variance=sum2/count-mean*mean,nonDarkRatio=nonDark/count,meanRgbDiff=diff/(count*3);
          if(mean<25||variance<180||nonDarkRatio<.28)throw new Error('Canvas is visually blank/dark '+JSON.stringify({mean,variance,nonDarkRatio,meanRgbDiff}));
          if(meanRgbDiff<.12)throw new Error('Canvas preview is visually static '+JSON.stringify({mean,variance,nonDarkRatio,meanRgbDiff,cameraTravel}));

          await page.tap('#newGameBtn');
          await page.waitForFunction(()=>getComputedStyle(document.getElementById('menu')).display==='none'&&document.body.classList.contains('game-started'),{timeout:60000});
          await page.waitForTimeout(500);
          const after=await page.evaluate(()=>({
            preview:window.__V1116_START_SCENE?.previewActive,
            activeCamera:window.BABYLON?.Engine?.LastCreatedEngine?.scenes?.[0]?.activeCamera?.name||null,
            errorVisible:getComputedStyle(document.getElementById('errorBox')).display!=='none',
            errorText:document.getElementById('errorBox')?.textContent||''
          }));
          if(after.preview||after.activeCamera==='v1116PreviewCamera')throw new Error('Preview camera leaked into gameplay '+JSON.stringify(after));
          if(after.errorVisible)throw new Error('Runtime error after start: '+after.errorText);
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('V11.16 visible start scene passed',{mean,variance,nonDarkRatio,meanRgbDiff,cameraTravel,before,after});
          await browser.close();
          EOF
          node v1116-start.mjs
      - name: Upload V11.16 start screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1116-start-scene-screenshots
          path: |
            v1116-canvas-a.png
            v1116-canvas-b.png
          if-no-files-found: ignore
