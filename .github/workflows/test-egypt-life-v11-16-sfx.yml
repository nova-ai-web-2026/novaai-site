name: Test Egyptian Life Simulator V11.16 Local SFX

on:
  workflow_call:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - 'scripts/test-egypt-life-sfx*.mjs'
      - '.github/workflows/test-egypt-life-v11-16-sfx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1116-local-sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate V11.16 direct SFX files
        run: |
          test -s egypt-life-sim-v2/game-v11-15-real-sfx.js
          for f in step_pavement step_asphalt interact buy_coin door reward; do test -s "egypt-life-sim-v2/audio/v11-8/$f.wav"; done
          node --check egypt-life-sim-v2/game-v11-15-real-sfx.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          node scripts/test-egypt-life-sfx-assets.mjs
          grep -Fq "VERSION='11.16'" egypt-life-sim-v2/game-v11-15-real-sfx.js
          grep -Fq "primary:'html-audio-same-origin'" egypt-life-sim-v2/game-v11-15-real-sfx.js
          grep -Fq "webAudioBypassedForSfx:true" egypt-life-sim-v2/game-v11-15-real-sfx.js
          grep -Fq "game-v11-15-real-sfx.js?v=11.16" egypt-life-sim-v2/game-v11-audiofix.js
          ! grep -Fq "cdn.jsdelivr.net" egypt-life-sim-v2/game-v11-15-real-sfx.js
          ! grep -Fq "raw.githubusercontent.com" egypt-life-sim-v2/game-v11-15-real-sfx.js
      - name: Prepare runner Chrome
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable
      - name: Start game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/v1116-server.log 2>&1 &
          sleep 2
      - name: Verify each SFX media element actually advances
        run: |
          cat > v1116-sfx-smoke.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const executablePath=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':'/usr/bin/google-chrome-stable';
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[],remoteSfx=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push('console: '+m.text());});
          page.on('request',r=>{const u=r.url();if(u.includes('cdn.jsdelivr.net/gh/ETdoFresh')||u.includes('raw.githubusercontent.com/ETdoFresh'))remoteSfx.push(u);});
          page.on('response',r=>{if(r.status()===404&&r.url().includes('/audio/v11-8/'))errors.push('404 local SFX: '+r.url());});

          await page.goto('http://127.0.0.1:4173/?ci=v1116-direct-media',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__V1116_SFX?.version==='11.16'&&!!window.__V1116_SFX_API,{timeout:55000});
          await page.tap('#newGameBtn');
          await page.waitForFunction(()=>document.body.classList.contains('game-started'),{timeout:15000});
          await page.waitForFunction(()=>window.__V1116_SFX_API.state().localReady===true,{timeout:12000});
          await page.waitForTimeout(250);

          const initial=await page.evaluate(()=>window.__V1116_SFX_API.state());
          if(initial.localLoaded<7||initial.localFailed!==0)throw new Error('Local SFX files incomplete '+JSON.stringify(initial));
          if(initial.primary!=='html-audio-same-origin'||initial.webAudioBypassedForSfx!==true)throw new Error('V11.16 is not direct media '+JSON.stringify(initial));
          if(initial.media.voices<21)throw new Error('SFX voice pool missing '+JSON.stringify(initial.media));

          async function pulse(name,waitMs=280){
            const before=await page.evaluate(()=>window.__V1116_SFX_API.state().playResolved);
            await page.evaluate(n=>window.__V1116_SFX_API.probe(n),name);
            await page.waitForTimeout(waitMs);
            const state=await page.evaluate(()=>window.__V1116_SFX_API.state());
            return {name,before,after:state.playResolved,media:state.media,lastPlayed:state.lastPlayed,rejected:state.playRejected};
          }

          const results={};
          for(const name of ['interact','buy','door','step','asphalt','reward']){
            results[name]=await pulse(name,name==='door'?380:300);
            const r=results[name];
            if(r.after<=r.before)throw new Error('HTMLAudio play() did not resolve for '+name+' '+JSON.stringify(r));
            if(r.media.lastDuration<=.04||r.media.lastTime<=.01)throw new Error('Media did not advance for '+name+' '+JSON.stringify(r));
            if(r.lastPlayed?.transport!=='html-audio-same-origin')throw new Error('Wrong SFX transport for '+name+' '+JSON.stringify(r.lastPlayed));
            if(r.rejected!==0)throw new Error('SFX play rejection for '+name+' '+JSON.stringify(r));
          }
          const finalState=await page.evaluate(()=>window.__V1116_SFX_API.state());
          if(remoteSfx.length)throw new Error('V11.16 unexpectedly requested remote SFX '+JSON.stringify(remoteSfx));
          if(await page.isVisible('#errorBox'))throw new Error('Runtime errorBox: '+await page.textContent('#errorBox'));
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('V11.16 direct same-origin SFX passed',{initial,results,finalState});
          await browser.close();
          EOF
          node v1116-sfx-smoke.mjs

      - name: Verify gameplay events and audible output on mobile and desktop
        run: node scripts/test-egypt-life-sfx.mjs
      - name: Upload gameplay sound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1116-gameplay-sfx
          path: |
            sfx-verification.json
            sfx-mobile.png
            sfx-desktop.png
          if-no-files-found: ignore
