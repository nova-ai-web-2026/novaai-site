name: Test Egyptian Life Simulator V2

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check egypt-life-sim-v2/game.js
      - name: Validate two-file site structure
        run: |
          test -s egypt-life-sim-v2/index.html
          test -s egypt-life-sim-v2/game.js
          grep -q '<script src="game.js"></script>' egypt-life-sim-v2/index.html
          grep -q 'حياة مصر' egypt-life-sim-v2/index.html
          grep -q 'CULTURE' egypt-life-sim-v2/game.js
