name: Test Egyptian Life Simulator V4

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v3.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and control bindings
        run: |
          node --check egypt-life-sim-v2/game.js
          grep -q "keys.has('KeyW')" egypt-life-sim-v2/game.js
          grep -q "keys.has('KeyD')" egypt-life-sim-v2/game.js
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 > /tmp/egypt-life-server.log 2>&1 &
          sleep 2
      - name: Run real browser test
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:720}});
          const failures=[];
          page.on('pageerror', e => failures.push('pageerror: '+e.message));
          page.on('console', m => { if(m.type()==='error') failures.push('console: '+m.text()); });
          await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
          await page.waitForSelector('#menu', {state:'visible'});
          if(!(await page.textContent('.logo'))?.includes('حياة')) throw new Error('Menu title missing');
          if(!(await page.isVisible('#soundToggle'))) throw new Error('Sound toggle missing');
          await page.click('#newGameBtn');
          await page.waitForFunction(() => getComputedStyle(document.querySelector('#menu')).display === 'none');
          await page.waitForTimeout(350);
          if(await page.isVisible('#errorBox')) throw new Error('Runtime error box: '+await page.textContent('#errorBox'));
          const box = await page.locator('#game').boundingBox();
          if(!box || box.width < 1000 || box.height < 600) throw new Error('Canvas is not full-screen');
          if(failures.length) throw new Error('Runtime errors before controls:\n'+failures.join('\n'));

          await page.evaluate(() => {
            window.__testKeyCodes=[];
            window.addEventListener('keydown', e => window.__testKeyCodes.push(e.code));
          });
          await page.keyboard.press('KeyW');
          await page.keyboard.press('KeyD');
          const codes=await page.evaluate(()=>window.__testKeyCodes.slice());
          if(!codes.includes('KeyW') || !codes.includes('KeyD')) throw new Error('Keyboard codes missing: '+JSON.stringify(codes));

          const initial = await page.evaluate(() => { window.__egyptDebug.resetPose(); return window.__egyptDebug.getCamera(); });
          if(Math.abs(initial.y-1.72)>.03) throw new Error('Bad player eye height '+initial.y);
          if(initial.offsetY >= 0) throw new Error('Collider offset must be below eye level');

          const afterForward = await page.evaluate(() => {
            const cam=BABYLON.Engine.LastCreatedEngine.scenes[0].activeCamera;
            cam.moveWithCollisions(new BABYLON.Vector3(0,0,1));
            return window.__egyptDebug.getCamera();
          });
          if(afterForward.z <= initial.z + .5) throw new Error(`Forward collision bridge failed: ${initial.z} -> ${afterForward.z}`);

          await page.evaluate(() => window.__egyptDebug.resetPose());
          const afterRight = await page.evaluate(() => {
            const cam=BABYLON.Engine.LastCreatedEngine.scenes[0].activeCamera;
            cam.moveWithCollisions(new BABYLON.Vector3(1,0,0));
            return window.__egyptDebug.getCamera();
          });
          if(afterRight.x <= initial.x + .5) throw new Error(`Right collision bridge failed: ${initial.x} -> ${afterRight.x}`);

          const look = await page.evaluate(() => { window.__egyptDebug.resetPose(); window.__egyptDebug.applyLook(100,80); return window.__egyptDebug.getCamera(); });
          if(look.yaw <= 0 || look.pitch <= 0) throw new Error(`Look controls inverted: yaw=${look.yaw}, pitch=${look.pitch}`);

          const detail = await page.evaluate(() => {
            const scene = BABYLON.Engine.LastCreatedEngine?.scenes?.[0];
            const names = scene?.meshes?.map(m=>m.name) || [];
            return {
              windows:names.filter(n=>n==='windowRecess').length,
              balconies:names.filter(n=>n==='balconySlab').length,
              awnings:names.filter(n=>n==='awning').length,
              cables:names.filter(n=>n==='cable').length,
              vehicles:names.filter(n=>n==='vehCollider').length,
              audio:window.__egyptDebug.audioState()
            };
          });
          if(detail.windows < 20 || detail.balconies < 5 || detail.awnings < 8 || detail.cables < 2 || detail.vehicles < 10) throw new Error('City detail generation too sparse: '+JSON.stringify(detail));
          if(detail.audio.state === 'none') throw new Error('Audio engine did not initialize');
          if(failures.length) throw new Error(failures.join('\n'));
          console.log('V4 browser test passed', {initial, afterForward, afterRight, look, detail, codes});
          await browser.close();
          EOF
          node smoke.mjs
