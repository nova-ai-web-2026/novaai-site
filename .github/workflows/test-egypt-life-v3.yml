name: Test Egyptian Life Simulator V6

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v3.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check V6 JavaScript and assets
        run: |
          node --check egypt-life-sim-v2/game.js
          node --check egypt-life-sim-v2/game-v6.js
          grep -q "articulated-natural-gait" egypt-life-sim-v2/game-v6.js
          grep -q "live-3d-cinematic" egypt-life-sim-v2/game-v6.js
          grep -q 'game-v6.js' egypt-life-sim-v2/index.html
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 > /tmp/egypt-life-server.log 2>&1 &
          sleep 2
      - name: Run V6 browser and animation test
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1366,height:768}});
          const failures=[];
          page.on('pageerror',e=>failures.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')failures.push('console: '+m.text());});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForSelector('#menu',{state:'visible'});
          await page.waitForFunction(()=>window.__V6_PATCH?.version===6);
          const patch=await page.evaluate(()=>window.__V6_PATCH);
          if(patch.pedestrians!=='articulated-natural-gait')throw new Error('V6 gait patch missing '+JSON.stringify(patch));
          if(patch.menu!=='live-3d-cinematic')throw new Error('V6 menu patch missing '+JSON.stringify(patch));
          if((await page.locator('#menu .logo').textContent())?.includes('حياة')!==true)throw new Error('Menu logo missing');
          if(await page.locator('#menu .building').count())throw new Error('Old fake CSS buildings still present');
          const menuBox=await page.locator('#menuContent').boundingBox();
          if(!menuBox||menuBox.width<300||menuBox.x<650)throw new Error('Menu panel not positioned as intended '+JSON.stringify(menuBox));
          const hudBefore=await page.evaluate(()=>getComputedStyle(document.querySelector('#hud')).visibility);
          if(hudBefore!=='hidden')throw new Error('HUD should be hidden behind start menu: '+hudBefore);
          await page.screenshot({path:'menu-v6.png',fullPage:true});

          await page.click('#newGameBtn');
          await page.waitForFunction(()=>getComputedStyle(document.querySelector('#menu')).display==='none');
          await page.waitForTimeout(450);
          const hudAfter=await page.evaluate(()=>getComputedStyle(document.querySelector('#hud')).visibility);
          if(hudAfter!=='visible')throw new Error('HUD did not return after entering game: '+hudAfter);
          if(await page.isVisible('#errorBox'))throw new Error('Runtime error: '+await page.textContent('#errorBox'));
          if(failures.length)throw new Error(failures.join('\n'));

          const npc=await page.evaluate(()=>window.__egyptDebug.npcState());
          if(npc.people!==28)throw new Error('Unexpected people count '+JSON.stringify(npc));
          if(npc.joints<224)throw new Error('Articulated joints missing '+JSON.stringify(npc));

          const sample=async()=>page.evaluate(()=>{
            const scene=BABYLON.Engine.LastCreatedEngine.scenes[0];
            const knee=scene.transformNodes.find(n=>n.name==='kneeL');
            const shoulder=scene.transformNodes.find(n=>n.name==='shoulderL');
            const root=scene.transformNodes.find(n=>n.name==='personRoot');
            return {knee:knee?.rotation.x,shoulder:shoulder?.rotation.x,x:root?.position.x,z:root?.position.z};
          });
          const a=await sample();await page.waitForTimeout(320);const b=await sample();await page.waitForTimeout(320);const c=await sample();
          const kneeSpread=Math.max(a.knee,b.knee,c.knee)-Math.min(a.knee,b.knee,c.knee);
          const shoulderSpread=Math.max(a.shoulder,b.shoulder,c.shoulder)-Math.min(a.shoulder,b.shoulder,c.shoulder);
          if(kneeSpread<.025)throw new Error('Knee is not animating '+JSON.stringify({a,b,c,kneeSpread}));
          if(shoulderSpread<.025)throw new Error('Shoulder is not animating '+JSON.stringify({a,b,c,shoulderSpread}));
          if(Math.max(a.z,b.z,c.z)-Math.min(a.z,b.z,c.z)>.08)throw new Error('NPC lane drift returned '+JSON.stringify({a,b,c}));

          await page.evaluate(()=>{
            const scene=BABYLON.Engine.LastCreatedEngine.scenes[0],cam=scene.activeCamera,root=scene.transformNodes.find(n=>n.name==='personRoot');
            if(root){cam.position.set(root.position.x+3.2,1.75,root.position.z+3.2);const dx=root.position.x-cam.position.x,dz=root.position.z-cam.position.z;cam.rotation.set(.02,Math.atan2(dx,dz),0);cam.fov=.7;}
          });
          await page.waitForTimeout(150);
          await page.screenshot({path:'npc-v6.png',fullPage:true});

          const audio=await page.evaluate(()=>window.__egyptDebug.audioState());
          if(audio.state==='none')throw new Error('Audio did not initialize');
          console.log('V6 browser test passed',{patch,npc,a,b,c,kneeSpread,shoulderSpread,audio,hudBefore,hudAfter});
          await browser.close();
          EOF
          node smoke.mjs
      - name: Upload V6 visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egypt-life-v6-visuals
          path: |
            menu-v6.png
            npc-v6.png
          if-no-files-found: ignore
