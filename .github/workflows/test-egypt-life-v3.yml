name: Test Egyptian Life Simulator V8

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v3.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check V8 JavaScript and assets
        run: |
          node --check egypt-life-sim-v2/game.js
          node --check egypt-life-sim-v2/game-v6.js
          node --check egypt-life-sim-v2/game-v7.js
          grep -q "distance-synced-footplant" egypt-life-sim-v2/game-v7.js
          grep -q "researched-cairo-street-layers" egypt-life-sim-v2/game-v7.js
          grep -q 'game-v7.js' egypt-life-sim-v2/index.html
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 > /tmp/egypt-life-server.log 2>&1 &
          sleep 2
      - name: Run V8 browser, gait, foot-slide and detail test
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1366,height:768}});
          const failures=[];
          page.on('pageerror',e=>failures.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')failures.push('console: '+m.text());});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForSelector('#menu',{state:'visible'});
          await page.waitForFunction(()=>window.__V8_PATCH?.version===8);
          const patch=await page.evaluate(()=>window.__V8_PATCH);
          if(patch.pedestrians!=='distance-synced-footplant')throw new Error('V8 gait patch missing '+JSON.stringify(patch));
          if(patch.egyptDetails!=='researched-cairo-street-layers')throw new Error('V8 Cairo detail pack missing '+JSON.stringify(patch));
          if(!(patch.gaitCycleMeters>1.25&&patch.gaitCycleMeters<1.6))throw new Error('Stride cycle is still shuffle-like '+JSON.stringify(patch.gaitCycleMeters));
          if((await page.locator('.kicker').textContent())?.includes('V8')!==true)throw new Error('V8 menu label missing');
          const hudBefore=await page.evaluate(()=>getComputedStyle(document.querySelector('#hud')).visibility);
          if(hudBefore!=='hidden')throw new Error('HUD should stay hidden on menu '+hudBefore);
          await page.screenshot({path:'menu-v8.png',fullPage:true});

          await page.click('#newGameBtn');
          await page.waitForFunction(()=>getComputedStyle(document.querySelector('#menu')).display==='none');
          await page.waitForTimeout(700);
          if(await page.isVisible('#errorBox'))throw new Error('Runtime error: '+await page.textContent('#errorBox'));
          if(failures.length)throw new Error(failures.join('\n'));

          const npc=await page.evaluate(()=>window.__egyptDebug.npcState());
          if(npc.people!==28||npc.joints<224)throw new Error('NPC rig regression '+JSON.stringify(npc));
          const visual=await page.evaluate(()=>window.__egyptDebug.v8VisualState());
          if(visual.details.meshCount<240)throw new Error('Too few V8 Cairo details '+JSON.stringify(visual));
          if(visual.details.signs<16)throw new Error('Local storefront signs missing '+JSON.stringify(visual));
          if(visual.details.awnings<16)throw new Error('Store awnings missing '+JSON.stringify(visual));
          if(visual.details.routeBoards!==3)throw new Error('Microbus route boards missing '+JSON.stringify(visual));
          if(visual.details.bulbs<28)throw new Error('Street/store bulbs missing '+JSON.stringify(visual));
          if(visual.details.cats!==6)throw new Error('Street cats missing '+JSON.stringify(visual));
          if(visual.details.marketCrates<8)throw new Error('Produce market detail missing '+JSON.stringify(visual));
          if(visual.details.manholes!==6)throw new Error('Road micro-detail missing '+JSON.stringify(visual));
          if(visual.details.shopNames.length!==16)throw new Error('Shop identity set incomplete '+JSON.stringify(visual.details.shopNames));
          if(visual.decorativeCollisions!==0)throw new Error('V8 decorative props must never block the player '+JSON.stringify(visual));
          if(!(visual.fogDensity>0&&visual.fogDensity<.004))throw new Error('Atmospheric haze out of safe range '+JSON.stringify(visual.fogDensity));

          const sample=async()=>page.evaluate(()=>{
            const scene=BABYLON.Engine.LastCreatedEngine.scenes[0];
            const root=scene.transformNodes.find(n=>n.name==='personRoot');
            const visual=scene.transformNodes.find(n=>n.name==='personVisual'&&n.parent===root);
            const hip=scene.transformNodes.find(n=>n.name==='hipL'&&n.parent===visual);
            const knee=scene.transformNodes.find(n=>n.name==='kneeL'&&n.parent===hip);
            const shoulder=scene.transformNodes.find(n=>n.name==='shoulderL'&&n.parent===visual);
            const torso=scene.meshes.find(n=>n.name==='torso'&&n.parent===visual);
            const footL=scene.meshes.find(n=>n.name==='footL'&&n.parent===knee);
            const hipR=scene.transformNodes.find(n=>n.name==='hipR'&&n.parent===visual);
            const kneeR=scene.transformNodes.find(n=>n.name==='kneeR'&&n.parent===hipR);
            const footR=scene.meshes.find(n=>n.name==='footR'&&n.parent===kneeR);
            const lp=footL?.getAbsolutePosition(),rp=footR?.getAbsolutePosition();
            return {x:root?.position.x,z:root?.position.z,hip:hip?.rotation.x,knee:knee?.rotation.x,shoulder:shoulder?.rotation.x,bob:visual?.position.y,lean:torso?.rotation.x,lx:lp?.x,lz:lp?.z,rx:rp?.x,rz:rp?.z};
          });
          const samples=[];
          for(let i=0;i<14;i++){samples.push(await sample());await page.waitForTimeout(130);}
          if(samples.some(s=>![s.x,s.z,s.hip,s.knee,s.shoulder,s.lx,s.lz,s.rx,s.rz].every(Number.isFinite)))throw new Error('Gait sample missing joint or foot world data '+JSON.stringify(samples));
          const spread=k=>Math.max(...samples.map(s=>s[k]))-Math.min(...samples.map(s=>s[k]));
          const travel=Math.hypot(samples.at(-1).x-samples[0].x,samples.at(-1).z-samples[0].z);
          const hipSpread=spread('hip'),kneeSpread=spread('knee'),shoulderSpread=spread('shoulder');
          const maxBob=Math.max(...samples.map(s=>Math.abs(s.bob||0))),maxLean=Math.max(...samples.map(s=>Math.abs(s.lean||0)));
          if(hipSpread<.16||hipSpread>.65)throw new Error('Hip stride range unnatural '+JSON.stringify({hipSpread,samples}));
          if(kneeSpread<.08||kneeSpread>.38)throw new Error('Knee motion range unnatural '+JSON.stringify({kneeSpread,samples}));
          if(shoulderSpread<.06||shoulderSpread>.34)throw new Error('Arm swing range unnatural '+JSON.stringify({shoulderSpread,samples}));
          if(maxBob>.011)throw new Error('Body bob too heavy '+JSON.stringify({maxBob,samples}));
          if(maxLean>.012)throw new Error('Torso lean too heavy '+JSON.stringify({maxLean,samples}));
          if(travel<.35)throw new Error('Pedestrian translation too hesitant '+JSON.stringify({travel,samples}));
          const laneSpread=Math.min(spread('x'),spread('z'));
          if(laneSpread>.12)throw new Error('NPC lane drift returned '+JSON.stringify({laneSpread,samples}));

          const ratios=[];
          for(let i=1;i<samples.length;i++){
            const a=samples[i-1],b=samples[i];
            const rootMove=Math.hypot(b.x-a.x,b.z-a.z);
            if(rootMove<.005)continue;
            const lMove=Math.hypot(b.lx-a.lx,b.lz-a.lz),rMove=Math.hypot(b.rx-a.rx,b.rz-a.rz);
            ratios.push(Math.min(lMove,rMove)/rootMove);
          }
          const plantedFraction=ratios.filter(r=>r<.82).length/Math.max(1,ratios.length);
          if(plantedFraction<.2)throw new Error('Feet still slide with the body '+JSON.stringify({ratios,plantedFraction,samples}));

          const audio=await page.evaluate(()=>window.__egyptDebug.audioState());
          if(audio.state==='none')throw new Error('Audio did not initialize');
          console.log('V8 browser test passed',{patch,npc,visual,hipSpread,kneeSpread,shoulderSpread,maxBob,maxLean,travel,ratios,plantedFraction,audio});
          await page.screenshot({path:'street-v8.png',fullPage:true});
          await browser.close();
          EOF
          node smoke.mjs
      - name: Upload V8 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egypt-life-v8-visuals
          path: |
            menu-v8.png
            street-v8.png
          if-no-files-found: ignore
