name: NOVA OMNI live browser
on:
  push:
    paths:
      - 'nova-omni/index.html'
      - 'nova-omni/local.html'
      - 'nova-omni/local-ai-worker.js'
      - 'nova-omni/local-math.js'
      - 'nova-omni/tests/local-memory.test.js'
      - 'nova-omni/tests/browser.spec.js'
      - '.github/workflows/nova-omni-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: nova-omni
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Wait for updated main and Local AI pages
        env:
          NOVA_SITE_URL: https://nova-ai-web-2026.github.io/novaai-site/nova-omni/
        run: |
          set -eu
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$NOVA_SITE_URL?check=$GITHUB_SHA-$i" -o /tmp/nova-main.html &&
               curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${NOVA_SITE_URL}local.html?check=$GITHUB_SHA-$i" -o /tmp/nova-local.html &&
               grep -Fq 'name="nova-version" content="1.6.0"' /tmp/nova-main.html &&
               grep -Fq 'name="nova-local-version" content="1.3.0"' /tmp/nova-local.html; then
              echo 'Both main workspace and Local AI pages are published'
              exit 0
            fi
            sleep 5
          done
          echo 'Updated Local AI page could not be verified'
          exit 1
      - name: Run against public GitHub Pages website
        env:
          NOVA_SITE_URL: https://nova-ai-web-2026.github.io/novaai-site/nova-omni/
        run: npx playwright test tests/browser.spec.js --reporter=line --workers=1 --timeout=25000
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-omni-playwright-report
          path: nova-omni/test-results/
          retention-days: 7
