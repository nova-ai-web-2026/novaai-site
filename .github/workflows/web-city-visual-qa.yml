name: Web City visual QA
on:
  push:
    paths:
      - 'spider-man-web-city/**'
      - '.github/workflows/web-city-visual-qa.yml'
permissions:
  contents: write
concurrency:
  group: web-city-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          mkdir -p /tmp/web-city-qa qa-output/vendor qa-output/source
          npm install --prefix /tmp/web-city-qa playwright@1.57.0 three@0.180.0 --no-audit --no-fund
          cp /tmp/web-city-qa/node_modules/three/build/three.module.js qa-output/vendor/
          cp /tmp/web-city-qa/node_modules/three/build/three.core.js qa-output/vendor/
          cp /tmp/web-city-qa/node_modules/three/LICENSE qa-output/vendor/THREE-LICENSE.txt
          cp spider-man-web-city/*.js spider-man-web-city/index.html spider-man-web-city/style.css qa-output/source/
      - name: Test rendered gameplay in Chromium
        run: |
          cat > /tmp/web-city-qa/check.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const path=require('node:path');
          const http=require('node:http');
          const root=process.cwd(),errors=[];
          const report={commit:process.env.GITHUB_SHA,errors};
          const server=http.createServer((req,res)=>{
            const url=new URL(req.url,'http://localhost');
            let file=url.pathname==='/'?'spider-man-web-city/index.html':url.pathname.slice(1);
            if(file==='favicon.ico'){res.writeHead(204);return res.end();}
            if(file.startsWith('__vendor/'))file='qa-output/vendor/'+file.slice(9);
            if(!file.includes('.')||file.endsWith('/'))file+='index.html';
            const target=path.resolve(root,file);
            if(!target.startsWith(root+path.sep)||!fs.existsSync(target)){res.writeHead(404);return res.end('Not found');}
            let body=fs.readFileSync(target);
            if(file.endsWith('.js')){
              let code=body.toString().replaceAll('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js','/__vendor/three.module.js');
              if(file==='spider-man-web-city/game.js')code+='\nwindow.__worldQA={THREE,scene,camera,renderer,player,playerMesh,webLine,city,keys,config:state,stepPlayer:updatePlayer,stepAnimation:animateScene,get swingBlend(){return swingBlend},get state(){return {position:player.pos.toArray(),velocity:player.vel.toArray(),speed:player.vel.length(),grounded:player.grounded,swing:!!swingAnchor,zip:!!zipTarget,web,health,mission:missionIndex,beacons:beacons.length,enemies:enemies.filter(e=>e.alive).length,won,version:scene.userData.worldVersion,audioState:audioCtx?.state||null,muted:sfxMuted,windBody:windBodyGain?.gain?.value||0,windAir:windAirGain?.gain?.value||0,sfxStats:{...sfxStats}}},activateNearestBeacon(){if(!beacons.length)return false;let best=beacons[0],bestD=best.position.distanceToSquared(player.pos);for(const b of beacons){const d=b.position.distanceToSquared(player.pos);if(d<bestD){best=b;bestD=d;}}player.pos.copy(best.position);player.vel.set(0,0,0);updateMission(.016,clock?.elapsedTime||0);return true;}};';
              body=Buffer.from(code);
            }
            res.setHeader('Content-Type',file.endsWith('.js')?'text/javascript':file.endsWith('.css')?'text/css':file.endsWith('.html')?'text/html':'application/octet-stream');
            res.end(body);
          });
          let browser,page;
          function logErrors(p){p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text());});}
          (async()=>{
            await new Promise(r=>server.listen(8765,'127.0.0.1',r));
            const executablePath=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(f=>fs.existsSync(f));
            browser=await chromium.launch({executablePath,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl']});
            page=await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1});logErrors(page);
            await page.addInitScript(()=>{let seed=92713;Math.random=()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296;};});
            await page.goto('http://127.0.0.1:8765/spider-man-web-city/',{waitUntil:'networkidle',timeout:45000});
            await page.waitForFunction(()=>window.__worldQA,{timeout:45000});
            await page.click('#startBtn');
            await page.waitForFunction(()=>window.__worldQA.player.grounded,{timeout:60000});
            report.before=await page.evaluate(()=>window.__worldQA.state);
            report.missionUI=await page.evaluate(()=>({
              text:document.getElementById('mission').textContent,
              trackerVisible:getComputedStyle(document.getElementById('objectiveTracker')).display!=='none',
              distance:document.getElementById('objectiveDistance').textContent
            }));
            report.worldAudit=await page.evaluate(()=>{
              const q=window.__worldQA,seen=new Set(),styles=new Set(),failures=[];
              let invalidDimensions=0,duplicateCenters=0,overlapPairs=0,blockedExitBuildings=0,outOfTerrain=0;
              const buildings=q.city;

              for(let i=0;i<buildings.length;i++){
                const b=buildings[i];
                const key=b.x.toFixed(3)+':'+b.z.toFixed(3);
                if(seen.has(key)){duplicateCenters++;failures.push({type:'duplicate-center',i,key});}else seen.add(key);
                const finite=[b.x,b.z,b.w,b.d,b.h].every(Number.isFinite);
                if(!finite||b.w<=0||b.d<=0||b.h<=3){
                  invalidDimensions++;
                  failures.push({type:'invalid-dimensions',i,x:b.x,z:b.z,w:b.w,d:b.d,h:b.h});
                }
                if(Number.isInteger(b.style))styles.add(b.style);
                if(Math.abs(b.x)+b.w/2>490||Math.abs(b.z)+b.d/2>490){
                  outOfTerrain++;
                  failures.push({type:'outside-terrain',i,x:b.x,z:b.z,w:b.w,d:b.d});
                }

                // The two main avenues at x=16 and z=16 must stay clear through every continuation ring.
                const hx=b.w/2+.55,hz=b.d/2+.55;
                const alongNorthSouth=Math.abs(b.x-16)<hx+4.5&&Math.abs(b.z)>205;
                const alongEastWest=Math.abs(b.z-16)<hz+4.5&&Math.abs(b.x)>205;
                if(alongNorthSouth||alongEastWest){
                  blockedExitBuildings++;
                  failures.push({type:'blocked-exit',i,x:b.x,z:b.z,w:b.w,d:b.d});
                }
              }

              // Pairwise AABB audit: every playable building gets checked against every other building.
              for(let i=0;i<buildings.length;i++){
                const a=buildings[i];
                for(let j=i+1;j<buildings.length;j++){
                  const b=buildings[j];
                  const overlapX=Math.abs(a.x-b.x)<(a.w+b.w)/2-.08;
                  const overlapZ=Math.abs(a.z-b.z)<(a.d+b.d)/2-.08;
                  if(overlapX&&overlapZ){
                    overlapPairs++;
                    if(failures.length<40)failures.push({type:'overlap',a:i,b:j,ax:a.x,az:a.z,bx:b.x,bz:b.z});
                  }
                }
              }

              const stats=q.scene.userData.worldStats||{};
              return {
                worldVersion:q.scene.userData.worldVersion,
                count:buildings.length,
                invalidDimensions,
                duplicateCenters,
                overlapPairs,
                blockedExitBuildings,
                outOfTerrain,
                styleCount:styles.size,
                edgeBuildings:buildings.filter(b=>b.edge).length,
                heroEdgeBuildings:buildings.filter(b=>b.hero).length,
                farHeroBuildings:buildings.filter(b=>b.farHero).length,
                outerBuildings:buildings.filter(b=>b.outer).length,
                farBuildings:buildings.filter(b=>b.far).length,
                failures,
                stats
              };
            });
            report.worldAuditPassed=
              report.worldAudit.invalidDimensions===0&&
              report.worldAudit.duplicateCenters===0&&
              report.worldAudit.overlapPairs===0&&
              report.worldAudit.blockedExitBuildings===0&&
              report.worldAudit.outOfTerrain===0&&
              report.worldAudit.count>=340&&
              report.worldAudit.styleCount>=6&&
              report.worldAudit.edgeBuildings>=170&&
              report.worldAudit.heroEdgeBuildings===4&&
              report.worldAudit.farHeroBuildings===4&&
              report.worldAudit.outerBuildings>=52&&
              report.worldAudit.farBuildings>=60&&
              report.worldAudit.stats?.buildingAudit?.invalidBuildings===0&&
              report.worldAudit.stats?.buildingAudit?.duplicateCenters===0&&
              report.worldAudit.stats?.farHeroBuildings===4&&
              report.worldAudit.stats?.playableOuterBuildings>=52&&
              report.worldAudit.stats?.playableFarBuildings>=60;
            await page.screenshot({path:'qa-output/spawn.png'});
            await page.keyboard.down('KeyD');
            await page.waitForFunction(()=>window.__worldQA.player.pos.x>1.3,{timeout:30000});
            await page.keyboard.up('KeyD');
            report.moved=await page.evaluate(()=>window.__worldQA.state);
            report.sprintLogic=await page.evaluate(()=>{
              const q=window.__worldQA;
              const simulate=(sprint)=>{
                q.player.pos.set(0,1.25,0);
                q.player.vel.set(0,0,0);
                q.player.grounded=true;
                q.keys.KeyD=true;
                q.keys.ShiftLeft=sprint;
                for(let i=0;i<45;i++)q.stepPlayer(1/60);
                const result=q.state;
                q.keys.KeyD=false;
                q.keys.ShiftLeft=false;
                return result;
              };
              const normal=simulate(false);
              const sprint=simulate(true);
              q.player.pos.set(0,1.25,0);
              q.player.vel.set(0,0,0);
              q.player.grounded=true;
              return {normal,sprint,baseSpeed:q.config.baseSpeed,sprintSpeed:q.config.sprintSpeed};
            });
            report.sprinted=report.sprintLogic.sprint;
            report.edgeTraversal=await page.evaluate(()=>{
              const q=window.__worldQA;
              const clearKeys=()=>{for(const k of ['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight'])q.keys[k]=false;};
              const run=(axis,sign)=>{
                clearKeys();
                q.player.vel.set(0,0,0);
                q.player.grounded=true;
                q.player.pos.set(axis==='x'?sign*230:16,q.config.groundY,axis==='z'?sign*230:16);
                const key=axis==='x'?(sign>0?'KeyD':'KeyA'):(sign>0?'KeyS':'KeyW');
                q.keys[key]=true;q.keys.ShiftLeft=true;
                let min=Infinity,max=-Infinity;
                for(let i=0;i<600;i++){
                  q.stepPlayer(1/60);
                  const v=axis==='x'?q.player.pos.x:q.player.pos.z;
                  min=Math.min(min,v);max=Math.max(max,v);
                }
                clearKeys();
                const final=axis==='x'?q.player.pos.x:q.player.pos.z;
                return {final,min,max,furthest:sign>0?max:-min};
              };
              const result={
                east:run('x',1),
                west:run('x',-1),
                south:run('z',1),
                north:run('z',-1),
                worldHalf:q.config.worldHalf,
                outerColliders:q.city.filter(b=>b.outer).length,
                farColliders:q.city.filter(b=>b.far).length
              };
              q.player.pos.set(0,q.config.groundY,0);q.player.vel.set(0,0,0);q.player.grounded=true;
              clearKeys();
              return result;
            });
            await page.keyboard.press('Space');
            await page.waitForFunction(()=>window.__worldQA.player.pos.y>1.8,{timeout:30000});
            report.jumped=await page.evaluate(()=>window.__worldQA.state);
            await page.keyboard.down('KeyQ');
            await page.waitForFunction(()=>window.__worldQA.state.swing,{timeout:30000});
            await page.waitForFunction(()=>window.__worldQA.player.pos.y>5,{timeout:30000});
            report.swung=await page.evaluate(()=>window.__worldQA.state);
            report.webVisual=await page.evaluate(()=>{
              const q=window.__worldQA,a=q.webLine.geometry.attributes.position.array,n=q.webLine.geometry.attributes.position.count,m=Math.floor(n/2)*3;
              const lx=(a[0]+a[(n-1)*3])/2,ly=(a[1]+a[(n-1)*3+1])/2,lz=(a[2]+a[(n-1)*3+2])/2;
              return {visible:q.webLine.visible,points:n,curvature:Math.hypot(a[m]-lx,a[m+1]-ly,a[m+2]-lz)};
            });
            await page.screenshot({path:'qa-output/swing.png'});
            report.swingRig=await page.evaluate(()=>{
              const q=window.__worldQA;
              const arms=q.playerMesh.children.filter(p=>p.userData.kind==='arm').sort((a,b)=>a.userData.side-b.userData.side);
              const legs=q.playerMesh.children.filter(p=>p.userData.kind==='leg').sort((a,b)=>a.userData.side-b.userData.side);
              q.playerMesh.updateMatrixWorld(true);
              const finiteNode=n=>[n.position.x,n.position.y,n.position.z,n.rotation.x,n.rotation.y,n.rotation.z,n.scale.x,n.scale.y,n.scale.z].every(Number.isFinite);
              const first=[q.webLine.geometry.attributes.position.array[0],q.webLine.geometry.attributes.position.array[1],q.webLine.geometry.attributes.position.array[2]];
              const handDistances=arms.map(a=>{
                const h=a.userData.hand;
                const p=h.getWorldPosition(new q.THREE.Vector3());
                return Math.hypot(first[0]-p.x,first[1]-p.y,first[2]-p.z);
              });
              const expectedYaw=Math.atan2(-q.player.facing.x,-q.player.facing.z);
              const yawDelta=Math.atan2(Math.sin(q.playerMesh.rotation.y-expectedYaw),Math.cos(q.playerMesh.rotation.y-expectedYaw));
              return {
                armCount:arms.length,
                legCount:legs.length,
                elbows:arms.filter(a=>a.userData.elbow).length,
                knees:legs.filter(l=>l.userData.knee).length,
                hands:arms.filter(a=>a.userData.hand).length,
                activeArmRaised:Math.max(...arms.map(a=>a.rotation.x)),
                elbowsBack:arms.every(a=>a.userData.elbow.rotation.x<.10),
                kneesBack:legs.every(l=>l.userData.knee.rotation.x<.10),
                bodyPitch:q.playerMesh.rotation.x,
                bodyRoll:q.playerMesh.rotation.z,
                yawDelta,
                webToNearestHand:Math.min(...handDistances),
                swingBlend:q.swingBlend,
                allFinite:q.playerMesh.children.every(finiteNode),
                visualOffset:q.playerMesh.userData.visualOffset,
                webPoints:q.webLine.geometry.attributes.position.count
              };
            });
            await page.keyboard.up('KeyQ');await page.waitForTimeout(220);
            report.released=await page.evaluate(()=>window.__worldQA.state);
            report.runRig=await page.evaluate(()=>{
              const q=window.__worldQA;
              const arms=q.playerMesh.children.filter(p=>p.userData.kind==='arm').sort((a,b)=>a.userData.side-b.userData.side);
              const legs=q.playerMesh.children.filter(p=>p.userData.kind==='leg').sort((a,b)=>a.userData.side-b.userData.side);
              q.player.pos.set(0,q.config.groundY,0);
              q.player.vel.set(9,0,-4);
              q.player.grounded=true;
              q.player.facing.set(.65,0,-.76).normalize();
              for(let i=0;i<28;i++)q.stepAnimation(1/60,5+i/60);
              const a0=arms.map(a=>a.rotation.x),l0=legs.map(l=>l.rotation.x),k0=legs.map(l=>l.userData.knee.rotation.x);
              const e0=arms.map(a=>a.userData.elbow.rotation.x);
              for(let i=0;i<14;i++)q.stepAnimation(1/60,5.7+i/60);
              const a1=arms.map(a=>a.rotation.x),l1=legs.map(l=>l.rotation.x);
              q.playerMesh.updateMatrixWorld(true);
              const footYs=legs.map(l=>{
                const foot=l.userData.knee.children.find(n=>n.geometry?.type==='BoxGeometry');
                const p=foot.getWorldPosition(new q.THREE.Vector3());
                return p.y;
              });
              const expectedYaw=Math.atan2(-q.player.facing.x,-q.player.facing.z);
              const yawDelta=Math.atan2(Math.sin(q.playerMesh.rotation.y-expectedYaw),Math.cos(q.playerMesh.rotation.y-expectedYaw));
              const targetWrapYaw=-Math.PI+.03;
              q.playerMesh.rotation.y=Math.PI-.03;
              q.player.facing.set(-Math.sin(targetWrapYaw),0,-Math.cos(targetWrapYaw)).normalize();
              q.player.vel.set(0,0,0);q.player.grounded=true;
              q.stepAnimation(1/60,6.2);
              const yawWrapDelta=Math.atan2(Math.sin(q.playerMesh.rotation.y-targetWrapYaw),Math.cos(q.playerMesh.rotation.y-targetWrapYaw));
              return {
                armOpposition:a0[0]*a0[1]<0,
                legOpposition:l0[0]*l0[1]<0,
                kneesBack:k0.every(v=>v<.02),
                elbowsBent:e0.every(v=>v<.02),
                animationChanges:a0.some((v,i)=>Math.abs(v-a1[i])>.01)&&l0.some((v,i)=>Math.abs(v-l1[i])>.01),
                facingLength:q.player.facing.length(),
                yawDelta,
                yawWrapDelta,
                footYDelta:Math.abs(footYs[0]-footYs[1]),
                footYMean:(footYs[0]+footYs[1])/2,
                bodyPitch:q.playerMesh.rotation.x,
                bodyRoll:q.playerMesh.rotation.z,
                fov:q.camera.fov,
                cameraDistance:q.camera.position.distanceTo(q.player.pos)
              };
            });
            report.poseRig=await page.evaluate(()=>{
              const q=window.__worldQA;
              const arms=q.playerMesh.children.filter(p=>p.userData.kind==='arm');
              const legs=q.playerMesh.children.filter(p=>p.userData.kind==='leg');
              const finite=()=>q.playerMesh.children.every(n=>[
                n.position.x,n.position.y,n.position.z,
                n.rotation.x,n.rotation.y,n.rotation.z,
                n.scale.x,n.scale.y,n.scale.z
              ].every(Number.isFinite));

              q.player.pos.set(0,q.config.groundY,0);
              q.player.vel.set(0,0,0);q.player.grounded=true;q.player.facing.set(0,0,-1);
              for(let i=0;i<60;i++)q.stepAnimation(1/60,7+i/60);
              const idleArmMax=Math.max(...arms.map(a=>Math.abs(a.rotation.x)));
              const idleLegMax=Math.max(...legs.map(l=>Math.abs(l.rotation.x)));
              const idlePitch=q.playerMesh.rotation.x;

              q.player.grounded=false;q.player.vel.set(3,10,-6);
              for(let i=0;i<24;i++)q.stepAnimation(1/60,8+i/60);
              const jumpPitch=q.playerMesh.rotation.x;
              const jumpKnees=legs.map(l=>l.userData.knee.rotation.x);

              q.player.vel.set(3,-12,-6);
              for(let i=0;i<24;i++)q.stepAnimation(1/60,8.5+i/60);
              const fallPitch=q.playerMesh.rotation.x;
              const fallKnees=legs.map(l=>l.userData.knee.rotation.x);

              q.player.pos.set(0,q.config.groundY,0);
              q.player.vel.set(0,0,0);q.player.grounded=true;
              q.playerMesh.rotation.y=0;
              q.player.facing.set(0,0,1);
              for(let i=0;i<45;i++)q.stepAnimation(1/60,9+i/60);
              const targetYaw=Math.PI;
              const yaw180Delta=Math.atan2(
                Math.sin(q.playerMesh.rotation.y-targetYaw),
                Math.cos(q.playerMesh.rotation.y-targetYaw)
              );

              return {
                idleArmMax,idleLegMax,idlePitch,
                jumpPitch,fallPitch,
                jumpKneesBack:jumpKnees.every(v=>v<.08),
                fallKneesBack:fallKnees.every(v=>v<.08),
                jumpFallPoseDifferent:Math.abs(jumpPitch-fallPitch)>.08,
                yaw180Delta,
                finite:finite()
              };
            });
            await page.keyboard.press('KeyF');await page.waitForTimeout(120);
            report.audio=await page.evaluate(()=>window.__worldQA.state);
            await page.keyboard.press('KeyM');await page.waitForTimeout(80);
            report.audioMuted=await page.evaluate(()=>window.__worldQA.state);
            await page.keyboard.press('KeyM');

            await page.evaluate(()=>{const q=window.__worldQA;q.player.pos.set(0,3,0);q.player.vel.set(0,0,0);});
            await page.waitForTimeout(250);
            await page.keyboard.press('KeyE');await page.waitForTimeout(220);
            report.zipTest=await page.evaluate(()=>window.__worldQA.state);
            await page.waitForTimeout(520);
            await page.keyboard.press('KeyR');await page.waitForTimeout(220);
            report.heavyAttack=await page.evaluate(()=>window.__worldQA.state);

            report.characterAnimationChecks={
              topology:report.swingRig.armCount===2&&report.swingRig.legCount===2,
              elbowRig:report.swingRig.elbows===2,
              kneeRig:report.swingRig.knees===2,
              handRig:report.swingRig.hands===2,
              swingArmRaised:report.swingRig.activeArmRaised>.15,
              swingElbowsNatural:report.swingRig.elbowsBack,
              swingKneesBackward:report.swingRig.kneesBack,
              swingPitchBounded:Math.abs(report.swingRig.bodyPitch)<.38,
              swingRollBounded:Math.abs(report.swingRig.bodyRoll)<.28,
              swingFacingAligned:Math.abs(report.swingRig.yawDelta)<.75,
              webStartsNearHand:report.swingRig.webToNearestHand<1.25,
              swingBlendActive:report.swingRig.swingBlend>.12&&report.swingRig.swingBlend<=1.01,
              transformsFinite:report.swingRig.allFinite,
              visualOffsetSane:report.swingRig.visualOffset>.5&&report.swingRig.visualOffset<1.8,
              webHasCurvePoints:report.swingRig.webPoints>=9,
              runArmOpposition:report.runRig.armOpposition,
              runLegOpposition:report.runRig.legOpposition,
              runKneesBackward:report.runRig.kneesBack,
              runElbowsBent:report.runRig.elbowsBent,
              runAnimationChanges:report.runRig.animationChanges,
              facingNormalized:Math.abs(report.runRig.facingLength-1)<.02,
              runFacingAligned:Math.abs(report.runRig.yawDelta)<.75,
              yawWrapUsesShortestPath:Math.abs(report.runRig.yawWrapDelta)<.35,
              feetSymmetric:report.runRig.footYDelta<.22,
              feetNearGround:report.runRig.footYMean>-1&&report.runRig.footYMean<1.5,
              runPitchBounded:Math.abs(report.runRig.bodyPitch)<.25,
              runRollBounded:Math.abs(report.runRig.bodyRoll)<.25,
              cameraFovSane:report.runRig.fov>=60&&report.runRig.fov<=90,
              cameraDistanceSane:report.runRig.cameraDistance>4&&report.runRig.cameraDistance<25,
              idleArmsRelaxed:report.poseRig.idleArmMax<.22,
              idleLegsRelaxed:report.poseRig.idleLegMax<.22,
              idlePitchStable:Math.abs(report.poseRig.idlePitch)<.10,
              jumpKneesNatural:report.poseRig.jumpKneesBack,
              fallKneesNatural:report.poseRig.fallKneesBack,
              jumpFallPoseDistinct:report.poseRig.jumpFallPoseDifferent,
              yaw180FacingAligned:Math.abs(report.poseRig.yaw180Delta)<.12,
              poseTransformsFinite:report.poseRig.finite
            };
            report.characterAnimationPassed=Object.values(report.characterAnimationChecks).every(Boolean);

            const soakStart=Date.now();
            let soakCycles=0;
            while(Date.now()-soakStart<300000){
              const shift=soakCycles%3===0;
              if(shift)await page.keyboard.down('ShiftLeft');
              await page.keyboard.down(soakCycles%2===0?'KeyW':'KeyD');
              await page.waitForTimeout(420);
              await page.keyboard.up(soakCycles%2===0?'KeyW':'KeyD');
              if(shift)await page.keyboard.up('ShiftLeft');

              if(soakCycles%2===0)await page.keyboard.press('Space');
              if(soakCycles%3===0){
                await page.keyboard.down('KeyQ');
                await page.waitForTimeout(650);
                await page.keyboard.up('KeyQ');
              }
              if(soakCycles%4===0)await page.keyboard.press('KeyE');
              await page.keyboard.press(soakCycles%2===0?'KeyF':'KeyR');
              await page.waitForTimeout(360);
              soakCycles++;
            }
            report.soak=await page.evaluate((cycles)=>({cycles,state:window.__worldQA.state,calls:window.__worldQA.renderer.info.render.calls,triangles:window.__worldQA.renderer.info.render.triangles}),soakCycles);
            report.soak.durationMs=Date.now()-soakStart;

            await page.evaluate(()=>{window.__worldQA.renderer.setAnimationLoop(null);document.exitPointerLock?.();document.getElementById('toast').classList.remove('show');});
            for(const [name,p,l] of [
              ['aerial',[84,76,133],[0,26,-35]],
              ['street',[16,5.8,29],[16,12,-80]],
              ['street-end',[16,7,142],[16,24,242]],
              ['skyline',[132,148,161],[0,30,-35]],
              ['far-north',[16,11,-302],[0,38,-352]],
              ['far-south',[16,11,302],[0,42,352]],
              ['far-west',[-302,11,16],[-352,45,0]],
              ['far-east',[302,11,16],[352,48,0]]
            ]){
              await page.evaluate(([p,l])=>{const q=window.__worldQA;q.camera.position.fromArray(p);q.camera.lookAt(...l);q.renderer.render(q.scene,q.camera);},[p,l]);
              await page.screenshot({path:`qa-output/${name}.png`});
              report[name]=await page.evaluate(()=>({calls:window.__worldQA.renderer.info.render.calls,triangles:window.__worldQA.renderer.info.render.triangles}));
            }
            report.movementPassed=report.moved.position[0]-report.before.position[0]>.2;
            report.sprintPassed=report.sprintLogic.sprint.speed>report.sprintLogic.normal.speed+3&&report.sprintLogic.sprintSpeed>report.sprintLogic.baseSpeed;
            report.edgeTraversalPassed=
              report.edgeTraversal.worldHalf>=360&&
              report.edgeTraversal.outerColliders>=52&&
              report.edgeTraversal.farColliders>=60&&
              ['east','west','south','north'].every(k=>report.edgeTraversal[k].furthest>330);
            report.jumpPassed=report.jumped.position[1]>report.moved.position[1];report.swingPassed=report.swung.swing;
            report.webVisualPassed=report.webVisual.visible&&report.webVisual.points>=9&&report.webVisual.curvature>.002;
            report.releasePassed=report.released.swing===false&&report.released.sfxStats.release>0&&report.released.speed>2;
            report.windPassed=report.swung.windBody>.001&&report.swung.windAir>=0;
            report.audioPassed=report.audio.audioState==='running'&&report.audio.sfxStats.start>0&&report.audio.sfxStats.jump>0&&report.audio.sfxStats.web>0&&report.audio.sfxStats.attack>0&&report.audioMuted.muted===true;
            report.zipPassed=(report.zipTest.sfxStats.zip||0)>0;
            report.heavyAttackPassed=(report.soak.state.sfxStats.heavySwing||0)>0;
            report.soakPassed=report.soak.durationMs>=300000&&report.soak.calls>0&&report.soak.state.health>0;
            report.missionUIPassed=report.before.mission===0&&report.before.beacons===3&&report.missionUI.trackerVisible&&report.missionUI.text.includes('MISSION 1/4');

            for(let i=0;i<3;i++){
              await page.evaluate(()=>window.__worldQA.activateNearestBeacon());
              await page.waitForTimeout(130);
            }
            await page.waitForFunction(()=>window.__worldQA.state.mission===1,{timeout:10000});
            report.missionAdvanced=await page.evaluate(()=>window.__worldQA.state);
            report.missionProgressionPassed=report.missionAdvanced.mission===1&&report.missionAdvanced.enemies===6;
            await page.close();
            const mobile=await browser.newPage({viewport:{width:412,height:915},deviceScaleFactor:1,isMobile:true,hasTouch:true});logErrors(mobile);
            await mobile.goto('http://127.0.0.1:8765/spider-man-web-city/',{waitUntil:'networkidle',timeout:45000});
            await mobile.waitForFunction(()=>window.__worldQA,{timeout:45000});await mobile.tap('#startBtn');
            await mobile.waitForFunction(()=>window.__worldQA.player.grounded,{timeout:45000});
            await mobile.setViewportSize({width:915,height:412});
            await mobile.screenshot({path:'qa-output/mobile-landscape.png'});
            report.mobile=await mobile.evaluate(()=>({state:window.__worldQA.state,controlsVisible:getComputedStyle(document.getElementById('mobile')).display!=='none',canvasWidth:document.querySelector('#game canvas').width}));
            await mobile.close();
            fs.writeFileSync('qa-output/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
            await browser.close();server.close();
            if(errors.length||!report.worldAuditPassed||!report.movementPassed||!report.sprintPassed||!report.edgeTraversalPassed||!report.jumpPassed||!report.swingPassed||!report.webVisualPassed||!report.releasePassed||!report.windPassed||!report.audioPassed||!report.zipPassed||!report.heavyAttackPassed||!report.characterAnimationPassed||!report.soakPassed||!report.missionUIPassed||!report.missionProgressionPassed||!report.mobile.controlsVisible)process.exitCode=1;
          })().catch(async e=>{report.failure=e.stack||String(e);fs.writeFileSync('qa-output/report.json',JSON.stringify(report,null,2));console.error(e);try{if(page&&!page.isClosed())await page.screenshot({path:'qa-output/error.png'});if(browser)await browser.close();}catch(_){}server.close();process.exitCode=1;});
          JS
          node /tmp/web-city-qa/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-city-visual-qa
          path: qa-output
          retention-days: 3
      - name: Persist latest QA report
        if: always()
        run: |
          test -f qa-output/report.json || exit 0
          mkdir -p qa
          cp qa-output/report.json qa/web-city-latest-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/web-city-latest-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Web City 5-minute QA report [skip ci]"
          git push
