name: Test Nova Studio

on:
  push:
    branches: [main]
    paths:
      - 'nova-studio-v3/**'
      - 'nova-studio-v4/**'
      - 'nova-studio-v5/**'
      - 'scripts/test-nova-studio-v3.mjs'
      - 'scripts/test-nova-studio-v4.mjs'
      - 'scripts/test-nova-studio-v5.mjs'
      - 'scripts/test-nova-studio-full.mjs'
      - '.github/workflows/test-nova-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Run Nova Studio v3 integration test
        run: node scripts/test-nova-studio-v3.mjs
      - name: Run Nova Studio v4 balance and quality test
        run: node scripts/test-nova-studio-v4.mjs
      - name: Run Nova Studio v5 local extender test
        run: node scripts/test-nova-studio-v5.mjs
      - name: Run full Nova Studio regression suite
        run: node scripts/test-nova-studio-full.mjs
