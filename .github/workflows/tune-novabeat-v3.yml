name: Tune NovaBeat natural sound and duration

on:
  push:
    paths:
      - '.github/workflows/tune-novabeat-v3.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply small natural-sound and duration changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('music-ai/index.html')
          s = index.read_text()
          changes = [
            ('<div class="label">المدة</div>\n          <div class="rangeRow"><input id="duration" type="range" min="12" max="36" step="4" value="24"><output id="durationOut">24 ثانية</output></div>',
             '<div class="label">مدة التراك — من 15 ثانية إلى دقيقتين</div>\n          <div class="rangeRow"><input id="duration" type="range" min="15" max="120" step="15" value="60"><output id="durationOut">60 ثانية</output></div>')
          ]
          for old,new in changes:
              if old not in s:
                  raise SystemExit('index pattern not found')
              s = s.replace(old,new,1)
          index.write_text(s)

          p = Path('music-ai/models-v2.js')
          s = p.read_text()
          repl = [
            ("const STYLE={trap:{bpm:92,bass:'sawtooth',lead:'square',kick:[0,2.5],snare:[1,3]}",
             "const STYLE={trap:{bpm:92,bass:'sine',lead:'triangle',kick:[0,2.5],snare:[1,3]}"),
            ("studio:{name:'Nova Studio 2',short:'Studio 2',rate:44100,channels:2,layers:7,human:.009,reverb:.085,delay:true,quality:'Studio stereo'},ultra:{name:'Nova Ultra 3',short:'Ultra 3',rate:48000,channels:2,layers:11,human:.015,reverb:.14,delay:true,quality:'Premium stereo + mastering'}",
             "studio:{name:'Nova Studio 2',short:'Studio 2',rate:44100,channels:2,layers:7,human:.006,reverb:.07,delay:true,quality:'Studio stereo'},ultra:{name:'Nova Ultra 3',short:'Ultra 3',rate:48000,channels:2,layers:11,human:.010,reverb:.105,delay:true,quality:'Premium stereo + mastering'}"),
            ("f.frequency.setValueAtTime(Math.min(6500,freq*8),t);f.Q.value=1.2;",
             "f.frequency.setValueAtTime(Math.min(4800,freq*6.5),t);f.Q.value=.8;"),
            ("cg.gain.setValueAtTime(amp*.11,t);", "cg.gain.setValueAtTime(amp*.06,t);"),
            ("f.frequency.value=1750;f.Q.value=.72;", "f.frequency.value=1550;f.Q.value=.62;"),
            ("bg.gain.setValueAtTime(amp*.24,t);", "bg.gain.setValueAtTime(amp*.15,t);"),
            ("d.delayTime.value=key==='ultra'?.265:.19;fb.gain.value=key==='ultra'?.18:.11;dg.gain.value=key==='ultra'?.11:.07;",
             "d.delayTime.value=key==='ultra'?.23:.17;fb.gain.value=key==='ultra'?.10:.07;dg.gain.value=key==='ultra'?.045:.035;"),
            ("if(opts.model==='ultra'&&i%4===2)pluck(ctx,bus,Math.max(0,t+ht+.01),len*.9,midi(note+7),.022,-pan*.7,'sine')",
             "if(opts.model==='ultra'&&i%8===6)pluck(ctx,bus,Math.max(0,t+ht+.01),len*.8,midi(note+7),.009,-pan*.5,'sine')"),
          ]
          for old,new in repl:
              if old not in s:
                  raise SystemExit('models pattern not found: '+old[:60])
              s = s.replace(old,new,1)

          riser = "if(opts.model==='ultra'){[.42,.72].forEach(fr=>{const t=opts.duration*fr;if(t<1)return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(110,t-1);o.frequency.exponentialRampToValueAtTime(880,t);f.type='lowpass';f.frequency.setValueAtTime(600,t-1);f.frequency.exponentialRampToValueAtTime(6500,t);g.gain.setValueAtTime(.0001,t-1);g.gain.exponentialRampToValueAtTime(.028,t-.15);g.gain.exponentialRampToValueAtTime(.0001,t);o.connect(f);f.connect(g);g.connect(bus);o.start(t-1);o.stop(t+.02)})}\n"
          if riser not in s:
              raise SystemExit('riser block not found')
          s = s.replace(riser, '', 1)

          old = "const buffer=await ctx.startRendering();normalizeBuffer(buffer,opts.model==='ultra'?.93:.89);return buffer}\nfunction normalizeBuffer(buffer,target)"
          new = "const buffer=await ctx.startRendering();smoothEdges(buffer);normalizeBuffer(buffer,opts.model==='ultra'?.91:.88);return buffer}\nfunction smoothEdges(buffer){const sr=buffer.sampleRate,n=buffer.length,fi=Math.min(Math.floor(sr*.25),Math.floor(n*.08)),fo=Math.min(Math.floor(sr*1.15),Math.floor(n*.16));for(let c=0;c<buffer.numberOfChannels;c++){const d=buffer.getChannelData(c);for(let i=0;i<fi;i++)d[i]*=i/Math.max(1,fi);for(let i=0;i<fo;i++){const j=n-1-i;d[j]*=i/Math.max(1,fo)}}}\nfunction normalizeBuffer(buffer,target)"
          if old not in s:
              raise SystemExit('render/normalize pattern not found')
          s = s.replace(old,new,1)
          p.write_text(s)

          t = Path('music-ai/e2e.spec.js')
          ts = t.read_text()
          marker = "test('mobile layout loads and model controls remain usable'"
          extra = """test('duration control supports up to two minutes', async ({ page }) => {\n  await page.goto('http://127.0.0.1:4173/music-ai/');\n  const duration = page.locator('#duration');\n  await expect(duration).toHaveAttribute('min', '15');\n  await expect(duration).toHaveAttribute('max', '120');\n  await duration.evaluate(el => { el.value = '60'; el.dispatchEvent(new Event('input', { bubbles: true })); });\n  await expect(page.locator('#durationOut')).toContainText('60');\n});\n\n"""
          if "duration control supports up to two minutes" not in ts:
              if marker not in ts:
                  raise SystemExit('e2e marker not found')
              ts = ts.replace(marker, extra+marker, 1)
              t.write_text(ts)
          PY
      - name: Sanity check
        run: |
          grep -q 'max="120"' music-ai/index.html
          grep -q 'smoothEdges(buffer)' music-ai/models-v2.js
          ! grep -q "\[.42,.72\]" music-ai/models-v2.js
          grep -q 'duration control supports up to two minutes' music-ai/e2e.spec.js
      - name: Commit tuning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-ai/index.html music-ai/models-v2.js music-ai/e2e.spec.js
          git commit -m 'Make NovaBeat longer and more natural' || exit 0
          git push
