name: NOVA OMNI real browser local AI
on:
  push:
    paths:
      - '.github/workflows/nova-omni-local-real-browser.yml'
      - 'nova-omni/tests/local-browser-real.spec.js'
      - 'nova-omni/local-ai-worker.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: nova-omni
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Ensure balanced page has deployed
        run: |
          for i in $(seq 1 24); do
            if curl -fsSL "https://nova-ai-web-2026.github.io/novaai-site/nova-omni/local.html?version=$i" -o /tmp/nova-local-real.html &&
               grep -Fq 'name="nova-local-version" content="2.5.0"' /tmp/nova-local-real.html; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Real Qwen3 model in Chromium
        run: npx playwright test tests/local-browser-real.spec.js --reporter=line --workers=1 --timeout=320000
