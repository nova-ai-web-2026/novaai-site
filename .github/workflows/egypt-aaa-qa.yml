name: Egypt AAA Vertical Slice QA

on:
  push:
    paths:
      - 'egypt-open-world-aaa/**'
      - 'scripts/test-egypt-open-world-published.mjs'
      - '.github/workflows/egypt-aaa-qa.yml'
  pull_request:
    paths:
      - 'egypt-open-world-aaa/**'
      - 'scripts/test-egypt-open-world-published.mjs'
      - '.github/workflows/egypt-aaa-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check egypt-open-world-aaa/src/bootstrap.js
          node --check egypt-open-world-aaa/src/data.js
          node --check egypt-open-world-aaa/src/systems.js
          node --check egypt-open-world-aaa/src/world.js
          node --check egypt-open-world-aaa/src/game.js
          node --check scripts/test-egypt-open-world-published.mjs
      - name: Required Arabic UI and first-build checks
        run: |
          grep -q 'dir="rtl"' egypt-open-world-aaa/index.html
          grep -q 'هات الفطار' egypt-open-world-aaa/index.html
          grep -q 'id="joy"' egypt-open-world-aaa/index.html
          grep -q 'id="act"' egypt-open-world-aaa/index.html
          grep -q 'fatalError' egypt-open-world-aaa/index.html
          grep -q './vendor/babylon.js' egypt-open-world-aaa/src/bootstrap.js
          ! grep -q '__BUILD_SHA__' egypt-open-world-aaa/index.html
          ! grep -q '__BUILD_SHA__' egypt-open-world-aaa/src/bootstrap.js
          grep -q 'mobile-recovery-3' egypt-open-world-aaa/index.html
          grep -q 'mobile-recovery-3' egypt-open-world-aaa/src/bootstrap.js
          grep -q '__SHWARE3_READY' egypt-open-world-aaa/src/game.js
          grep -q "doorSide='south'" egypt-open-world-aaa/src/world.js
          grep -q 'المهمة خلصت' egypt-open-world-aaa/src/data.js
          grep -q 'خلي بالك يا ابني' egypt-open-world-aaa/src/data.js
          grep -q 'for(let i=0;i<12;i++)' egypt-open-world-aaa/src/world.js
          grep -q "kind:'driveable'" egypt-open-world-aaa/src/world.js
          grep -q 'SaveSystem' egypt-open-world-aaa/src/systems.js
          grep -q 'PoliceSystem' egypt-open-world-aaa/src/systems.js
          grep -q 'setDoorOpen' egypt-open-world-aaa/src/game.js

  persist-vendor:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qa
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.vendor.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: vendor
        name: Ensure Babylon exists in repository
        shell: bash
        run: |
          set -euo pipefail
          FILE=egypt-open-world-aaa/vendor/babylon.js
          if [ -s "$FILE" ] && [ "$(wc -c < "$FILE")" -gt 1000000 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Babylon vendor already persisted in repository."
            exit 0
          fi
          mkdir -p "$(dirname "$FILE")"
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            https://cdn.babylonjs.com/babylon.js -o "$FILE"
          test "$(wc -c < "$FILE")" -gt 1000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "build: persist Babylon engine for Egyptian open world"
          git push origin HEAD:main
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Vendor committed; the follow-up main run will deploy and verify it."

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.persist-vendor.outputs.ready == 'true'
    needs: [qa, persist-vendor]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistent local engine
        run: |
          test -s egypt-open-world-aaa/vendor/babylon.js
          test "$(wc -c < egypt-open-world-aaa/vendor/babylon.js)" -gt 1000000
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  published-browser:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GAME_TEST_URL: ${{ needs.deploy.outputs.page_url }}egypt-open-world-aaa/
      GAME_EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser verification
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify published desktop and Android gameplay without external engine CDNs
        run: node scripts/test-egypt-open-world-published.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egypt-open-world-published-browser
          path: |
            egypt-open-world-desktop.png
            egypt-open-world-mobile.png
            egypt-open-world-browser-report.json
          if-no-files-found: ignore
