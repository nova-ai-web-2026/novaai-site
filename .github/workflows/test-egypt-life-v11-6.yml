name: Test Egyptian Life Simulator V11.7 Early Start

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v11-6.yml'

permissions:
  contents: read

jobs:
  v117-early-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate V11.7 files
        run: |
          test -s egypt-life-sim-v2/game-v11-6-runtime.js
          node --check egypt-life-sim-v2/game-v11-6-runtime.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          node --check egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v11-6-runtime.js?v=11.7' egypt-life-sim-v2/index.html
          grep -Fq 'data-egypt-v116-runtime="true"' egypt-life-sim-v2/index.html
          grep -Fq 'game-v8-layout.js?v=11.7' egypt-life-sim-v2/index.html
          grep -Fq 'game-v11-audiofix.js?v=11.7' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'early-shared-native-audiocontext' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'queuedStartSupported:true' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'armedBeforeCore:true' egypt-life-sim-v2/game-v11-6-runtime.js
          if grep -Fq "classList.add('game-started')" egypt-life-sim-v2/index.html; then echo 'premature HTML start flag still present'; exit 1; fi
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/v117-server.log 2>&1 &
          sleep 2
      - name: Verify first tap while core is delayed
        run: |
          cat > v117-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
          const delayed=['game-v6.js','game-v9.js','game-v9-gaitfix.js','game-v9-character-polish.js','game-v10.js','game-v11.js','game-v11-1.js'];
          for(const file of delayed)await page.route('**/'+file+'*',async route=>{await new Promise(r=>setTimeout(r,650));await route.continue();});
          await page.goto('http://127.0.0.1:4173/?ci=v117-early',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.__V117_AUDIO?.version==='11.7'&&window.__V117_AUDIO?.armedBeforeCore===true,{timeout:10000});
          await page.screenshot({path:'01-menu-early.png',fullPage:true});

          // The real failure case: first tap happens before the game/patch chain is ready.
          await page.tap('#newGameBtn');
          await page.waitForFunction(()=>window.__V117_CONTEXT?.state==='running'&&window.__V117_AUDIO?.started===true,{timeout:7000});
          await page.waitForTimeout(300);
          const early=await page.evaluate(()=>{
            const a=window.__V117_ANALYSER,n=a?.fftSize||0,data=n?new Uint8Array(n):null;let sum=0,peak=0;
            if(a&&data){a.getByteTimeDomainData(data);for(const v of data){const x=(v-128)/128;sum+=x*x;peak=Math.max(peak,Math.abs(x));}}
            return {ready:window.__V117_READY,ctx:window.__V117_CONTEXT?.state||null,rms:n?Math.sqrt(sum/n):null,peak,menu:getComputedStyle(document.getElementById('menu')).display,gameStarted:document.body.classList.contains('game-started'),status:document.getElementById('menuStatus')?.textContent||'',kicker:document.querySelector('.kicker')?.textContent,foot:document.querySelector('.menuFoot')?.textContent};
          });
          if(early.ready!==false)throw new Error('Delayed test missed the pre-ready state '+JSON.stringify(early));
          if(early.menu==='none'||early.gameStarted)throw new Error('First tap entered half-loaded game '+JSON.stringify(early));
          if(early.ctx!=='running'||early.rms===null||early.rms<.0025||early.peak<.006)throw new Error('First tap did not produce real audio '+JSON.stringify(early));
          if(early.kicker!=='HAYAT MASR • V11.7'||!early.foot?.includes('V11.7'))throw new Error('Startup text flickered '+JSON.stringify(early));
          await page.screenshot({path:'02-menu-queued.png',fullPage:true});

          // No second user tap: queued first tap must start automatically once the world is ready.
          await page.waitForFunction(()=>window.__V117_READY===true&&getComputedStyle(document.getElementById('menu')).display==='none',{timeout:55000});
          await page.waitForTimeout(2500);
          await page.screenshot({path:'03-game-started.png',fullPage:true});
          const after=await page.evaluate(()=>{
            const a=window.__V117_ANALYSER,n=a?.fftSize||0,data=n?new Uint8Array(n):null;let sum=0,peak=0;
            if(a&&data){a.getByteTimeDomainData(data);for(const v of data){const x=(v-128)/128;sum+=x*x;peak=Math.max(peak,Math.abs(x));}}
            const box=document.getElementById('errorBox');
            return {ready:window.__V117_READY,ctx:window.__V117_CONTEXT?.state||null,rms:n?Math.sqrt(sum/n):null,peak,menu:getComputedStyle(document.getElementById('menu')).display,hud:getComputedStyle(document.getElementById('hud')).visibility,gameStarted:document.body.classList.contains('game-started'),errorVisible:box?getComputedStyle(box).display!=='none':false,errorText:box?.textContent||'',state:window.__egyptDebug?.v117AudioState?.()};
          });
          const diag={early,after,errors};fs.writeFileSync('v117-diagnostic.json',JSON.stringify(diag,null,2));console.log('V11.7 early-start result',diag);
          if(!after.ready||after.menu!=='none'||after.hud==='hidden'||!after.gameStarted)throw new Error('Queued transition failed '+JSON.stringify(after));
          if(after.errorVisible)throw new Error('Runtime error after queued start: '+after.errorText);
          if(after.ctx!=='running'||after.rms===null||after.rms<.0025||after.peak<.006)throw new Error('Audio disappeared after start '+JSON.stringify(after));
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          EOF
          node v117-smoke.mjs
      - name: Upload V11.7 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-early-start-diagnostic
          path: |
            01-menu-early.png
            02-menu-queued.png
            03-game-started.png
            v117-diagnostic.json
          if-no-files-found: warn
