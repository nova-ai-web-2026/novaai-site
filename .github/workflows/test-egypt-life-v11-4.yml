name: Test Egyptian Life Simulator V11.6 Early Start + Audio

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v11-4.yml'

permissions:
  contents: read

jobs:
  v116-early-start-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate V11.6 startup/audio files
        run: |
          node --check egypt-life-sim-v2/game-v8-layout.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq "early-native-audiocontext" egypt-life-sim-v2/game-v8-layout.js
          grep -Fq "audioArmedBeforePatches:true" egypt-life-sim-v2/game-v8-layout.js
          grep -Fq "game-v11-audiofix.js?v=11.6" egypt-life-sim-v2/game-v8-layout.js
          grep -Fq "delegatedToV116:true" egypt-life-sim-v2/game-v11-audiofix.js
          if grep -Fq "game-v11-4-audio.js" egypt-life-sim-v2/game-v11-audiofix.js; then echo 'late V11.5 loader still present'; exit 1; fi
          if grep -Fq "game-v11-2-audio.js" egypt-life-sim-v2/game-v11-audiofix.js; then echo 'late V11.2 loader still present'; exit 1; fi
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/v116-server.log 2>&1 &
          sleep 2
      - name: Verify real early-tap flow
        run: |
          cat > v116-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
          const delayPatterns=['game-v9.js','game-v9-gaitfix.js','game-v9-character-polish.js','game-v10.js','game-v11.js','game-v11-1.js'];
          for(const file of delayPatterns)await page.route('**/'+file+'*',async route=>{await new Promise(r=>setTimeout(r,500));await route.continue();});
          await page.goto('http://127.0.0.1:4173/?ci=v116-early',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.__V116_AUDIO?.version==='11.6'&&window.__V116_AUDIO?.armed===true,{timeout:12000});
          await page.screenshot({path:'menu-early.png',fullPage:true});

          // Tap Start immediately while later patches are intentionally still loading.
          await page.click('#newGameBtn');
          await page.waitForFunction(()=>window.__V116_CONTEXT?.state==='running'&&window.__V116_AUDIO?.started===true,{timeout:7000});
          await page.waitForTimeout(250);
          const blocked=await page.evaluate(()=>({ready:window.__V116_READY,menu:getComputedStyle(document.getElementById('menu')).display,bodyClass:document.body.className,status:document.getElementById('menuStatus')?.textContent||'',ctx:window.__V116_CONTEXT?.state||null}));
          if(blocked.ready!==false)throw new Error('Test did not hit the early-start gate '+JSON.stringify(blocked));
          if(blocked.menu==='none')throw new Error('Early tap entered the game before patches were ready '+JSON.stringify(blocked));
          if(blocked.ctx!=='running')throw new Error('Audio did not unlock on the first early tap '+JSON.stringify(blocked));
          await page.screenshot({path:'menu-blocked-while-loading.png',fullPage:true});

          await page.waitForFunction(()=>window.__V116_READY===true&&window.__V116_STARTUP?.ready===true,{timeout:50000});
          const noLateAudio=await page.evaluate(()=>({v112:!!document.querySelector('script[data-egypt-v112-audio]'),v115:!!document.querySelector('script[data-egypt-v114-audio]'),kicker:document.querySelector('.kicker')?.textContent,foot:document.querySelector('.menuFoot')?.textContent}));
          if(noLateAudio.v112||noLateAudio.v115)throw new Error('Late audio scripts were still injected '+JSON.stringify(noLateAudio));
          await page.screenshot({path:'menu-ready.png',fullPage:true});

          // Second tap starts only after the world is stable.
          await page.click('#newGameBtn');
          await page.waitForFunction(()=>getComputedStyle(document.getElementById('menu')).display==='none',{timeout:8000});
          await page.waitForTimeout(2400);
          await page.screenshot({path:'game-after-start.png',fullPage:true});
          const after=await page.evaluate(()=>{
            const a=window.__V116_ANALYSER,n=a?.fftSize||0,data=n?new Uint8Array(n):null;let rms=null,peak=null;
            if(a&&data){a.getByteTimeDomainData(data);let sum=0,p=0;for(const v of data){const x=(v-128)/128;sum+=x*x;p=Math.max(p,Math.abs(x));}rms=Math.sqrt(sum/n);peak=p;}
            const box=document.getElementById('errorBox');return {ctx:window.__V116_CONTEXT?.state||null,rms,peak,audio:window.__V116_AUDIO||null,ready:window.__V116_READY,errorVisible:box?getComputedStyle(box).display!=='none':false,errorText:box?.textContent||'',hud:getComputedStyle(document.getElementById('hud')).visibility,bodyClass:document.body.className};
          });
          const diag={blocked,noLateAudio,after,errors};fs.writeFileSync('v116-diagnostic.json',JSON.stringify(diag,null,2));console.log('V11.6 early-start diagnostic',diag);
          if(after.errorVisible)throw new Error('Runtime error after stable start: '+after.errorText);
          if(after.ctx!=='running'||after.rms===null||after.rms<.002||after.peak<.005)throw new Error('No measurable V11.6 audio after game start '+JSON.stringify(after));
          if(after.hud==='hidden'||after.bodyClass.includes('v116-menu-open'))throw new Error('Startup guard did not release '+JSON.stringify(after));
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          EOF
          node v116-smoke.mjs
      - name: Upload V11.6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v116-early-start-diagnostic
          path: |
            menu-early.png
            menu-blocked-while-loading.png
            menu-ready.png
            game-after-start.png
            v116-diagnostic.json
          if-no-files-found: warn
