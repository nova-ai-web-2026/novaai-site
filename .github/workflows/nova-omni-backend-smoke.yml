name: NOVA OMNI production protection
on:
  push:
    paths:
      - '.github/workflows/nova-omni-backend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify anonymous access is restricted
        shell: bash
        run: |
          set -euo pipefail
          url='https://nova-omni-ai-2026.vercel.app/api/omni?action=health'
          code=$(curl --silent --show-error --max-time 15 -o /tmp/nova-response -w '%{http_code}' "$url")
          echo "Anonymous HTTP: $code"
          case "$code" in
            301|302|303|307|308|401|403)
              echo "Production authentication is enforced"
              exit 0;;
            *)
              echo "Unexpected public response or backend failure"
              exit 1;;
          esac
