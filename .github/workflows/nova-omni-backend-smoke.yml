name: NOVA OMNI backend smoke
on:
  push:
    paths:
      - '.github/workflows/nova-omni-backend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Vercel health endpoint
        shell: bash
        env:
          ROOT: https://nova-omni-ai-2026.vercel.app
        run: |
          set -euo pipefail
          for i in $(seq 1 8); do
            echo "Health check attempt $i"
            http=$(curl -L -sS --max-time 12 -o /tmp/nova-health -w '%{http_code}' "$ROOT/api/omni?action=health" || true)
            echo "HTTP status: $http"
            if [ "$http" = "200" ]; then
              if python3 -c "import json;d=json.load(open('/tmp/nova-health'));print('app:',d.get('app'),'AI credentials:',d.get('ai'),'access:',d.get('secured'));assert d.get('app')=='NOVA OMNI' and d.get('ok')==True"; then
                echo "Backend health OK"
                exit 0
              fi
            fi
            head -c 150 /tmp/nova-health 2>/dev/null | tr '\n' ' ' || true
            echo ""
            sleep 3
          done
          echo "Backend unhealthy or deployment protection is blocking access"
          exit 1
