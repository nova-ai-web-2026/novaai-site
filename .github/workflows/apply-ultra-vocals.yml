name: Apply NovaBeat Ultra Vocals
on:
  push:
    paths:
      - 'music-ai/patch-ultra-vocals.py'
      - '.github/workflows/apply-ultra-vocals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Ultra vocals patch
        run: python3 music-ai/patch-ultra-vocals.py
      - name: Syntax checks
        run: |
          node --check music-ai/models-v2.js
          node --check music-ai/ultra-vocals.js
          node --check api/ultra-vocals.js
      - name: Verify wiring
        run: |
          grep -q 'ultra-vocals.js' music-ai/index.html
          grep -q 'nbvLyrics' music-ai/ultra-vocals.js
          grep -q "music_v2_5" api/ultra-vocals.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-ai/models-v2.js music-ai/index.html music-ai/e2e.spec.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add lyrics and Ultra-only neural vocals wiring'
          git push
