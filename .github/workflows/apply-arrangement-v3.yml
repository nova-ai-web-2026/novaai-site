name: Apply NovaBeat arrangement v3

on:
  push:
    paths:
      - 'music-ai/apply-arrangement-v3.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 music-ai/apply-arrangement-v3.py
      - name: Syntax check
        run: node --check music-ai/models-v2.js
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-ai/models-v2.js music-ai/e2e.spec.js
          git commit -m 'Rebuild NovaBeat musical arrangements' || exit 0
          git push
