name: Apply NovaBeat model identity v4

on:
  push:
    paths:
      - '.github/workflows/apply-model-identity-v4.yml'
      - 'music-ai/apply-model-identity-v4.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply model identity patch
        run: python3 music-ai/apply-model-identity-v4.py
      - name: Syntax check
        run: node --check music-ai/models-v2.js
      - name: Sanity check identities
        run: |
          grep -q 'MODEL_PROFILE' music-ai/models-v2.js
          grep -q 'Essential mono arrangement' music-ai/models-v2.js
          grep -q 'Layered wide arrangement' music-ai/models-v2.js
          grep -q 'same brief renders three materially different model outputs' music-ai/e2e.spec.js
      - name: Commit model identity changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-ai/models-v2.js music-ai/e2e.spec.js
          git commit -m 'Make NovaBeat models audibly distinct' || exit 0
          git push
