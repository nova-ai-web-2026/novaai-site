name: Review story meaning and shop interactions
on:
  workflow_call:
    inputs:
      game_url:
        type: string
        default: ''
  pull_request:
    paths:
      - 'scripts/review-game.mjs'
      - '.github/workflows/test-scene-story-audit.yml'
permissions:
  contents: read
jobs:
  story-shops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mobile: [false, true]
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0
      - if: inputs.game_url == ''
        run: python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/story-audit.log 2>&1 &
      - run: node scripts/review-game.mjs
        env:
          GAME_TEST_URL: ${{ inputs.game_url }}
          GAME_TEST_MOBILE: ${{ matrix.mobile }}
