name: Test Egyptian Life Simulator V11.10 Natural SFX

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v11-8.yml'
  workflow_dispatch:

jobs:
  v1110-natural-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate natural Foley engine
        run: |
          node --check egypt-life-sim-v2/game-v11-6-runtime.js
          node --check egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq "VERSION='11.10'" egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'pre-rendered-natural-noise-foley' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'proceduralPerEvent:false' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'tonalSynthesis:false' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'noRepeatViolations' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq "banks.step_pavement=[101,102,103,104]" egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq "banks.step_asphalt=[201,202,203,204]" egypt-life-sim-v2/game-v11-8-sfx.js
          if grep -Fq 'Math.sin(' egypt-life-sim-v2/game-v11-8-sfx.js; then echo 'Tonal oscillator synthesis still present'; exit 1; fi
          if grep -Fq '.wav?v=' egypt-life-sim-v2/game-v11-8-sfx.js; then echo 'Old one-shot WAV references still present'; exit 1; fi

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/v1110-server.log 2>&1 &
          sleep 2

      - name: Verify mobile SFX output, dynamics and variants
        run: |
          cat > v1110-sfx-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
          await page.goto('http://127.0.0.1:4173/?ci=v1110-natural-sfx',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__V1110_AUDIO?.version==='11.10'&&window.__V1110_SFX?.version==='11.10',{timeout:50000});
          await page.waitForFunction(()=>window.__V1110_READY===true,{timeout:50000});
          await page.tap('#newGameBtn');
          await page.waitForFunction(()=>window.__V1110_CONTEXT?.state==='running'&&window.__V1110_SFX?.bankReady===true&&window.__V1110_SFX_API,{timeout:15000});

          async function measure(name,wait=300){
            return await page.evaluate(async ({name,wait})=>{
              const a=window.__V1110_SFX_ANALYSER;if(!a)throw new Error('SFX analyser missing');
              const before=window.__V1110_SFX.playResolved;
              const ok=window.__V1110_SFX_API.play(name);if(!ok)throw new Error('play failed '+name);
              let maxRms=0,maxPeak=0;const end=performance.now()+wait;
              while(performance.now()<end){
                const data=new Uint8Array(a.fftSize);a.getByteTimeDomainData(data);let sum=0,peak=0;
                for(const v of data){const x=(v-128)/128;sum+=x*x;peak=Math.max(peak,Math.abs(x));}
                maxRms=Math.max(maxRms,Math.sqrt(sum/data.length));maxPeak=Math.max(maxPeak,peak);
                await new Promise(r=>setTimeout(r,10));
              }
              return {name,maxRms,maxPeak,before,after:window.__V1110_SFX.playResolved,last:window.__V1110_SFX.lastPlayed};
            },{name,wait});
          }

          const results=[];
          for(const name of ['interact','buy','door','step','asphalt']){
            const r=await measure(name);results.push(r);
            if(r.after<=r.before)throw new Error('SFX did not resolve '+JSON.stringify(r));
            if(r.maxRms<.003||r.maxPeak<.012)throw new Error('Weak '+name+' '+JSON.stringify(r));
            if(r.maxPeak>.96)throw new Error('Clipping-risk '+name+' '+JSON.stringify(r));
            await page.waitForTimeout(160);
          }

          const stepVariants=[];
          for(let i=0;i<5;i++){const r=await measure('step',260);stepVariants.push(r.last?.variant);await page.waitForTimeout(140);}
          for(let i=1;i<stepVariants.length;i++)if(stepVariants[i]===stepVariants[i-1])throw new Error('Repeated adjacent footstep '+JSON.stringify(stepVariants));

          const state=await page.evaluate(()=>({
            sfx:window.__V1110_SFX,
            metrics:window.__V1110_SFX_API.metrics(),
            audio:window.__egyptDebug?.v1110AudioState?.(),
            errorVisible:getComputedStyle(document.getElementById('errorBox')).display!=='none',
            errorText:document.getElementById('errorBox')?.textContent||''
          }));
          if(state.sfx.sampleCount!==21)throw new Error('Expected 21 SFX variants '+JSON.stringify(state.sfx));
          if(state.sfx.noRepeatViolations!==0)throw new Error('No-repeat violation '+JSON.stringify(state.sfx));
          if(state.sfx.playRejected!==0)throw new Error('Rejected SFX '+JSON.stringify(state.sfx));
          if(state.sfx.tonalSynthesis!==false||state.sfx.proceduralPerEvent!==false)throw new Error('Wrong engine mode '+JSON.stringify(state.sfx));
          for(const [group,list] of Object.entries(state.metrics))for(const m of list){
            if(m.peak>=.55||m.peak<=.30)throw new Error('Bad peak '+group+' '+JSON.stringify(m));
            if(m.rms<=.012||m.rms>=.16)throw new Error('Bad RMS '+group+' '+JSON.stringify(m));
            if(m.crestDb<8||m.crestDb>27)throw new Error('Bad crest '+group+' '+JSON.stringify(m));
          }
          if(state.errorVisible)throw new Error('Runtime errorBox '+state.errorText);
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('V11.10 natural SFX passed',{results,stepVariants,state});
          await browser.close();
          EOF
          node v1110-sfx-smoke.mjs
