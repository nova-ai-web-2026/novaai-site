name: Test Egyptian Life Simulator V11.9 SFX Quality

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v11-8.yml'
  workflow_dispatch:

jobs:
  v119-sfx-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V11.9 quality SFX files
        run: |
          test -s egypt-life-sim-v2/game-v11-8-sfx.js
          node --check egypt-life-sim-v2/game-v11-8-sfx.js
          node --check egypt-life-sim-v2/game-v11-6-runtime.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          node --check egypt-life-sim-v2/game-v8-layout.js
          grep -Fq "game-v11-6-runtime.js?v=11.9" egypt-life-sim-v2/index.html
          grep -Fq "game-v11-8-sfx.js?v=11.9" egypt-life-sim-v2/index.html
          grep -Fq "game-v8-layout.js?v=11.9" egypt-life-sim-v2/index.html
          grep -Fq "game-v11-audiofix.js?v=11.9" egypt-life-sim-v2/game-v8-layout.js
          grep -Fq "quality-foley-buffer-bank" egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq "legacyGameSfx:false" egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq "webAudioOnly:true" egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq "proceduralBeeps:false" egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq "gameMasterMuted:true" egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq "proceduralGameplayFoley:false" egypt-life-sim-v2/game-v11-6-runtime.js
          if grep -Fq '.wav?v=' egypt-life-sim-v2/game-v11-8-sfx.js; then echo 'Old one-shot WAV SFX still referenced'; exit 1; fi
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/v119-server.log 2>&1 &
          sleep 2
      - name: Verify mobile V11.9 SFX bank and legacy mute
        run: |
          cat > v119-quality.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
          await page.goto('http://127.0.0.1:4173/?ci=v119-quality',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__V119_READY===true&&window.__V119_SFX?.version==='11.9'&&!!window.__V119_SFX_API,{timeout:55000});
          await page.tap('#newGameBtn');
          await page.waitForFunction(()=>document.body.classList.contains('game-started')&&window.__V119_CONTEXT?.state==='running',{timeout:12000});
          await page.evaluate(()=>window.__V119_SFX_API.unlock());
          await page.waitForFunction(()=>window.__V119_SFX_API.state().bankReady===true&&window.__V119_SFX_API.state().qualityBus===true,{timeout:5000});

          const runtime=await page.evaluate(()=>window.__V119_AUDIO_STATE());
          if(!runtime?.gameMasterConnected)throw new Error('Legacy gameplay master was not captured '+JSON.stringify(runtime));
          if(Math.abs(runtime.gameMasterValue||0)>.002)throw new Error('Legacy gameplay SFX not muted '+JSON.stringify(runtime));
          if(runtime.proceduralGameplayFoley!==false)throw new Error('Old procedural gameplay Foley still enabled '+JSON.stringify(runtime));

          const metrics=await page.evaluate(()=>window.__V119_SFX_API.bankMetrics());
          for(const key of ['step_pavement','step_asphalt'])if((metrics[key]?.length||0)<3)throw new Error('Not enough footstep variation '+key+' '+JSON.stringify(metrics[key]));
          for(const key of ['interact','buy','door','reward','deny'])if((metrics[key]?.length||0)<2)throw new Error('Not enough SFX variation '+key+' '+JSON.stringify(metrics[key]));
          for(const [key,list] of Object.entries(metrics))for(const m of list)if(m.rms<.015||m.peak<.12||m.duration<.07)throw new Error('Weak generated Foley '+key+' '+JSON.stringify(m));

          const differences=await page.evaluate(()=>{
            const api=window.__V119_SFX_API;
            const banks=['step_pavement','step_asphalt','interact','buy','door','reward','deny'];
            const out={};
            // bankMetrics confirms counts; trigger repeated plays to confirm the no-immediate-repeat selector rotates variants.
            for(const key of banks){
              const names={step_pavement:'step',step_asphalt:'asphalt',interact:'interact',buy:'buy',door:'door',reward:'reward',deny:'deny'};
              api.play(names[key]);const a=api.state().lastPlayed?.variant;
              api.play(names[key]);const b=api.state().lastPlayed?.variant;
              out[key]={a,b};
            }
            return out;
          });
          for(const [key,v] of Object.entries(differences))if(v.a===v.b)throw new Error('Immediate SFX repeat '+key+' '+JSON.stringify(v));

          const before=await page.evaluate(()=>window.__V119_SFX_API.state().playResolved);
          for(const name of ['interact','buy','door','reward','deny','step','asphalt'])await page.evaluate(n=>window.__V119_SFX_API.play(n),name);
          await page.waitForFunction(before=>window.__V119_SFX_API.state().playResolved>=before+7,before,{timeout:6000});
          const finalState=await page.evaluate(()=>window.__V119_SFX_API.state());
          if(finalState.playRejected!==0||finalState.webAudioOnly!==true||finalState.htmlFallback!==false||finalState.proceduralBeeps!==false)throw new Error('V11.9 SFX engine unhealthy '+JSON.stringify(finalState));
          if(await page.isVisible('#errorBox'))throw new Error('Runtime errorBox: '+await page.textContent('#errorBox'));
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('V11.9 quality SFX passed',{runtime,metrics,differences,finalState});
          await browser.close();
          EOF
          node v119-quality.mjs
