name: Test Egyptian Life Simulator V11.10 Actual SFX

on:
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/test-egypt-life-v11-8.yml'
  workflow_dispatch:

jobs:
  v1110-actual-sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate V11.10 actual SFX files
        run: |
          test -s egypt-life-sim-v2/game-v11-10-actual-sfx.js
          test -s egypt-life-sim-v2/AUDIO-CREDITS.md
          node --check egypt-life-sim-v2/game-v11-10-actual-sfx.js
          node --check egypt-life-sim-v2/game-v11-8-sfx.js
          node --check egypt-life-sim-v2/game-v11-6-runtime.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq "game-v11-6-runtime.js?v=11.10" egypt-life-sim-v2/index.html
          grep -Fq "game-v11-8-sfx.js?v=11.10" egypt-life-sim-v2/index.html
          grep -Fq "game-v11-10-actual-sfx.js?v=11.10" egypt-life-sim-v2/index.html
          grep -Fq "game-v8-layout.js?v=11.10" egypt-life-sim-v2/index.html
          grep -Fq "actual-cc0-sampled-sfx" egypt-life-sim-v2/game-v11-10-actual-sfx.js
          grep -Fq "remoteSamplePrimary:true" egypt-life-sim-v2/game-v11-10-actual-sfx.js
          grep -Fq "proceduralFallback:true" egypt-life-sim-v2/game-v11-10-actual-sfx.js
          grep -Fq "45df48c4d45f8716216b1a9e22df0b69cd9f5932" egypt-life-sim-v2/game-v11-10-actual-sfx.js
          grep -Fq "release:'11.10'" egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq "CC0 1.0" egypt-life-sim-v2/AUDIO-CREDITS.md
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 4173 --directory egypt-life-sim-v2 >/tmp/v1110-server.log 2>&1 &
          sleep 2
      - name: Verify actual samples on mobile WebAudio
        run: |
          cat > v1110-actual.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
          await page.goto('http://127.0.0.1:4173/?ci=v1110-actual',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__V119_READY===true&&window.__V1110_SFX?.version==='11.10'&&!!window.__V1110_SFX_API,{timeout:55000});
          await page.tap('#newGameBtn');
          await page.waitForFunction(()=>document.body.classList.contains('game-started')&&window.__V119_CONTEXT?.state==='running',{timeout:12000});
          await page.evaluate(()=>window.__V1110_SFX_API.unlock());
          await page.waitForFunction(()=>{
            const s=window.__V1110_SFX_API?.state?.();
            return s?.bankReady===true&&s.sampleLoaded+s.sampleFailed===s.sampleTotal;
          },{timeout:25000});

          const loaded=await page.evaluate(()=>window.__V1110_SFX_API.state());
          if(loaded.sampleTotal!==17||loaded.sampleLoaded!==17||loaded.sampleFailed!==0)throw new Error('Actual sample preload incomplete '+JSON.stringify(loaded));
          if(loaded.actualSamples!==true||loaded.remoteSamplePrimary!==true||loaded.proceduralFallback!==true)throw new Error('Wrong V11.10 engine '+JSON.stringify(loaded));
          if(loaded.proceduralBusMuted!==true)throw new Error('Procedural V11.9 bus not muted '+JSON.stringify(loaded));

          const metrics=await page.evaluate(()=>window.__V1110_SFX_API.bufferMetrics());
          const expected={step_pavement:4,step_asphalt:4,interact:2,buy:2,door:2,reward:2,deny:1};
          for(const [key,count] of Object.entries(expected)){
            if((metrics[key]?.length||0)!==count)throw new Error('Wrong actual sample count '+key+' '+JSON.stringify(metrics[key]));
            for(const m of metrics[key])if(m.duration<=0||m.rms<.001||m.peak<.005)throw new Error('Silent/invalid actual sample '+key+' '+JSON.stringify(m));
          }

          async function verifyPlay(name){
            await page.evaluate(n=>window.__V1110_SFX_API.play(n),name);
            await page.waitForTimeout(35);
            const out=await page.evaluate(()=>{
              const a=window.__V1110_SFX_ANALYSER,n=a?.fftSize||0,d=n?new Uint8Array(n):null;let sum=0,peak=0;
              if(a&&d){a.getByteTimeDomainData(d);for(const v of d){const x=(v-128)/128;sum+=x*x;peak=Math.max(peak,Math.abs(x));}}
              return {rms:n?Math.sqrt(sum/n):0,peak,last:window.__V1110_SFX_API.state().lastPlayed};
            });
            if(out.last?.transport!=='actual-sample')throw new Error('Fallback used for '+name+' '+JSON.stringify(out));
            if(out.rms<.0008||out.peak<.003)throw new Error('No measurable actual SFX waveform '+name+' '+JSON.stringify(out));
            return out;
          }

          const plays={};
          for(const name of ['interact','buy','door','reward','deny','step','asphalt'])plays[name]=await verifyPlay(name);
          const finalState=await page.evaluate(()=>window.__V1110_SFX_API.state());
          if(finalState.playRejected!==0||finalState.playResolved<7)throw new Error('Actual SFX playback unhealthy '+JSON.stringify(finalState));
          if(await page.isVisible('#errorBox'))throw new Error('Runtime errorBox: '+await page.textContent('#errorBox'));
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('V11.10 actual SFX passed',{loaded,metrics,plays,finalState});
          await browser.close();
          EOF
          node v1110-actual.mjs
