name: Deploy Egyptian Life Simulator

on:
  push:
    branches: [main]
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/deploy-egypt-life-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate game files
        run: |
          test -s egypt-life-sim-v2/index.html
          test -s egypt-life-sim-v2/game.js
          test -s egypt-life-sim-v2/game-v6.js
          test -s egypt-life-sim-v2/game-v7.js
          test -s egypt-life-sim-v2/game-v8-layout.js
          node --check egypt-life-sim-v2/game.js
          node --check egypt-life-sim-v2/game-v6.js
          node --check egypt-life-sim-v2/game-v7.js
          node --check egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v7.js?v=8' egypt-life-sim-v2/index.html
          grep -Fq 'game-v8-layout.js?v=8' egypt-life-sim-v2/index.html
          grep -Fq 'distance-synced-footplant' egypt-life-sim-v2/game-v7.js
          grep -Fq 'researched-cairo-street-layers' egypt-life-sim-v2/game-v7.js
          grep -Fq 'HAYAT MASR • V8' egypt-life-sim-v2/game-v7.js
          grep -Fq 'facadeAnchored' egypt-life-sim-v2/game-v8-layout.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
