name: Deploy Egyptian Life Simulator

on:
  push:
    branches: [main]
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/deploy-egypt-life-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate V11.8.1 SFX release files
        run: |
          test -s egypt-life-sim-v2/index.html
          test -s egypt-life-sim-v2/game-v7.js
          test -s egypt-life-sim-v2/game-v8-layout.js
          test -s egypt-life-sim-v2/game-v9.js
          test -s egypt-life-sim-v2/game-v9-gaitfix.js
          test -s egypt-life-sim-v2/game-v9-character-polish.js
          test -s egypt-life-sim-v2/game-v9-facades.js
          test -s egypt-life-sim-v2/game-v10.js
          test -s egypt-life-sim-v2/game-v11.js
          test -s egypt-life-sim-v2/game-v11-1.js
          test -s egypt-life-sim-v2/game-v11-audiofix.js
          test -s egypt-life-sim-v2/game-v11-6-runtime.js
          test -s egypt-life-sim-v2/game-v11-8-sfx.js
          for f in step_pavement.wav step_asphalt.wav interact.wav buy_coin.wav door.wav reward.wav; do test -s "egypt-life-sim-v2/audio/v11-8/$f"; done
          node --check egypt-life-sim-v2/game-v7.js
          node --check egypt-life-sim-v2/game-v8-layout.js
          node --check egypt-life-sim-v2/game-v9.js
          node --check egypt-life-sim-v2/game-v9-gaitfix.js
          node --check egypt-life-sim-v2/game-v9-character-polish.js
          node --check egypt-life-sim-v2/game-v9-facades.js
          node --check egypt-life-sim-v2/game-v10.js
          node --check egypt-life-sim-v2/game-v11.js
          node --check egypt-life-sim-v2/game-v11-1.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          node --check egypt-life-sim-v2/game-v11-6-runtime.js
          node --check egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'game-v11-6-runtime.js?v=11.8.1' egypt-life-sim-v2/index.html
          grep -Fq 'game-v11-8-sfx.js?v=11.8.1' egypt-life-sim-v2/index.html
          grep -Fq 'game-v8-layout.js?v=11.8.1' egypt-life-sim-v2/index.html
          grep -Fq 'game-v11-audiofix.js?v=11.8.1' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v11-6-runtime.js?v=11.8.1' egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq 'game-v11-8-sfx.js?v=11.8.1' egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq 'step_pavement.wav?v=11.8.1' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'body:not(.game-started) #hud' egypt-life-sim-v2/index.html
          grep -Fq 'webaudio-sampled-sfx-with-html-fallback' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'webAudioPrimary:true' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'shared-native-audiocontext-plus-sampled-sfx' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'gameMasterPreserved:true' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'legacyExtraBusesMuted:true' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'gameplayMasterPreserved:true' egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq 'webAudioSamplePrimary:true' egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq 'hornEvents:false' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'oscillatorTones:false' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'legacyHum:false' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'legacyHorns:false' egypt-life-sim-v2/game-v11-8-sfx.js
          if grep -Fq "classList.add('game-started')" egypt-life-sim-v2/index.html; then echo 'premature HTML start flag present'; exit 1; fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
