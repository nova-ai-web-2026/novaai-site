name: Verify and deploy Egyptian Life

on:
  push:
    branches: [main]
    paths:
      - 'egypt-life-sim-v2/**'
      - 'scripts/*egypt-life*'
      - '.github/workflows/*egypt-life*'
  pull_request:
    paths:
      - 'egypt-life-sim-v2/**'
      - 'scripts/*egypt-life*'
      - '.github/workflows/*egypt-life*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egypt-life-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  street:
    uses: ./.github/workflows/test-egypt-life-street.yml
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release assets and active entry points
        run: bash scripts/validate-egypt-life-release.sh

  sound:
    uses: ./.github/workflows/test-egypt-life-v11-16-sfx.yml
  start:
    uses: ./.github/workflows/test-egypt-life-v11-16-start-scene.yml
  gameplay:
    uses: ./.github/workflows/test-egypt-life-v11-17-scene.yml
  mobile:
    uses: ./.github/workflows/test-egypt-life-v11-13.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [validate-release, sound, start, gameplay, mobile, street]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp exact source and asset hashes
        run: node scripts/stamp-egypt-life-release.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  published-game:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAME_TEST_URL: ${{ needs.deploy.outputs.page_url }}egypt-life-sim-v2/
      GAME_EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify published version and every asset hash
        run: node scripts/test-egypt-life-published.mjs
      - name: Prepare browser
        run: npm install --no-save playwright-core@1.55.0
      - name: Play the published release on mobile and desktop
        run: node scripts/test-egypt-life-sfx.mjs
      - name: Upload published gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-egypt-life-verification
          path: |
            sfx-verification.json
            sfx-mobile.png
            sfx-desktop.png
          if-no-files-found: ignore
