name: Deploy Egyptian Life Simulator

on:
  push:
    branches: [main]
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/deploy-egypt-life-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate V11.10 natural SFX release files
        run: |
          test -s egypt-life-sim-v2/index.html
          test -s egypt-life-sim-v2/game-v7.js
          test -s egypt-life-sim-v2/game-v8-layout.js
          test -s egypt-life-sim-v2/game-v9.js
          test -s egypt-life-sim-v2/game-v9-gaitfix.js
          test -s egypt-life-sim-v2/game-v9-character-polish.js
          test -s egypt-life-sim-v2/game-v9-facades.js
          test -s egypt-life-sim-v2/game-v10.js
          test -s egypt-life-sim-v2/game-v11.js
          test -s egypt-life-sim-v2/game-v11-1.js
          test -s egypt-life-sim-v2/game-v11-audiofix.js
          test -s egypt-life-sim-v2/game-v11-6-runtime.js
          test -s egypt-life-sim-v2/game-v11-8-sfx.js
          node --check egypt-life-sim-v2/game-v7.js
          node --check egypt-life-sim-v2/game-v8-layout.js
          node --check egypt-life-sim-v2/game-v9.js
          node --check egypt-life-sim-v2/game-v9-gaitfix.js
          node --check egypt-life-sim-v2/game-v9-character-polish.js
          node --check egypt-life-sim-v2/game-v9-facades.js
          node --check egypt-life-sim-v2/game-v10.js
          node --check egypt-life-sim-v2/game-v11.js
          node --check egypt-life-sim-v2/game-v11-1.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          node --check egypt-life-sim-v2/game-v11-6-runtime.js
          node --check egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'game-v11-6-runtime.js?v=11.10' egypt-life-sim-v2/index.html
          grep -Fq 'game-v11-8-sfx.js?v=11.10' egypt-life-sim-v2/index.html
          grep -Fq 'game-v8-layout.js?v=11.10' egypt-life-sim-v2/index.html
          grep -Fq 'game-v11-audiofix.js?v=11.10' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq "release:'11.10'" egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq "VERSION='11.10'" egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq "VERSION='11.10'" egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'pre-rendered-natural-noise-foley' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'proceduralPerEvent:false' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'tonalSynthesis:false' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'noRepeatViolations' egypt-life-sim-v2/game-v11-8-sfx.js
          grep -Fq 'gameMasterMuted:true' egypt-life-sim-v2/game-v11-6-runtime.js
          grep -Fq 'proceduralGameplayFoley:false' egypt-life-sim-v2/game-v11-6-runtime.js
          if grep -Fq 'Math.sin(' egypt-life-sim-v2/game-v11-8-sfx.js; then echo 'Tonal oscillator SFX code still present'; exit 1; fi
          if grep -Fq '.wav?v=' egypt-life-sim-v2/game-v11-8-sfx.js; then echo 'Old one-shot WAV SFX still referenced'; exit 1; fi
          if grep -Fq 'foley-bank.pcm.gz' egypt-life-sim-v2/game-v11-8-sfx.js; then echo 'Broken binary-bank dependency still present'; exit 1; fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
