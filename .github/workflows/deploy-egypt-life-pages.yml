name: Deploy Egyptian Life Simulator

on:
  push:
    branches: [main]
    paths:
      - 'egypt-life-sim-v2/**'
      - '.github/workflows/deploy-egypt-life-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate game files
        run: |
          test -s egypt-life-sim-v2/index.html
          test -s egypt-life-sim-v2/game.js
          test -s egypt-life-sim-v2/game-v6.js
          test -s egypt-life-sim-v2/game-v7.js
          test -s egypt-life-sim-v2/game-v8-layout.js
          test -s egypt-life-sim-v2/game-v9.js
          test -s egypt-life-sim-v2/game-v9-gaitfix.js
          test -s egypt-life-sim-v2/game-v9-character-polish.js
          test -s egypt-life-sim-v2/game-v9-facades.js
          test -s egypt-life-sim-v2/game-v10.js
          test -s egypt-life-sim-v2/game-v11.js
          test -s egypt-life-sim-v2/game-v11-1.js
          test -s egypt-life-sim-v2/game-v11-audiofix.js
          node --check egypt-life-sim-v2/game.js
          node --check egypt-life-sim-v2/game-v6.js
          node --check egypt-life-sim-v2/game-v7.js
          node --check egypt-life-sim-v2/game-v8-layout.js
          node --check egypt-life-sim-v2/game-v9.js
          node --check egypt-life-sim-v2/game-v9-gaitfix.js
          node --check egypt-life-sim-v2/game-v9-character-polish.js
          node --check egypt-life-sim-v2/game-v9-facades.js
          node --check egypt-life-sim-v2/game-v10.js
          node --check egypt-life-sim-v2/game-v11.js
          node --check egypt-life-sim-v2/game-v11-1.js
          node --check egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq 'game-v7.js?v=8' egypt-life-sim-v2/index.html
          grep -Fq 'game-v8-layout.js?v=8' egypt-life-sim-v2/index.html
          grep -Fq 'game-v9.js?v=9' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v9-gaitfix.js?v=9' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v9-character-polish.js?v=9' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v9-facades.js?v=9' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v10.js?v=10' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v11.js?v=11' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v11-1.js?v=11.1' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'game-v11-audiofix.js?v=11.1' egypt-life-sim-v2/game-v8-layout.js
          grep -Fq 'hip-knee-ankle-foot' egypt-life-sim-v2/game-v9.js
          grep -Fq 'naturalAnkleRange:true' egypt-life-sim-v2/game-v9-gaitfix.js
          grep -Fq 'capsule-human' egypt-life-sim-v2/game-v9-character-polish.js
          grep -Fq 'blankSidesFilled' egypt-life-sim-v2/game-v9-facades.js
          grep -Fq 'heel-strike-stance-toe-off-swing' egypt-life-sim-v2/game-v10.js
          grep -Fq 'roundedFootwear:true' egypt-life-sim-v2/game-v10.js
          grep -Fq 'rtl-shaped-signage' egypt-life-sim-v2/game-v11.js
          grep -Fq 'spatialZones:true' egypt-life-sim-v2/game-v11.js
          grep -Fq 'mirroredBackfacesFixed' egypt-life-sim-v2/game-v11-1.js
          grep -Fq 'layered-procedural-cairo-v2' egypt-life-sim-v2/game-v11-1.js
          grep -Fq 'legacyLocked:true' egypt-life-sim-v2/game-v11-audiofix.js
          grep -Fq 'v11BusLocked:true' egypt-life-sim-v2/game-v11-audiofix.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
