name: NOVA OMNI checks
on:
  push:
    paths:
      - 'nova-omni/**'
      - '.github/workflows/nova-omni-tests.yml'
  pull_request:
    paths:
      - 'nova-omni/**'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-omni
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Node tests
        run: node --test tests/*.test.js
