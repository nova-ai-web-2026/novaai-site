<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<style>
html,body{height:100%;margin:0;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.logo{font-size:46px;font-weight:800}.msg{margin-top:18px;color:#9999b5;line-height:1.9}.err{max-width:800px;color:#ff8bad;white-space:pre-wrap}.ver{margin-top:12px;color:#4b4b67;font-size:12px}
</style>
</head>
<body>
<div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري تشغيل NOVA AI…</div><div class="ver">build fixed32</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 const base='../nova-ai-original-clean/';
 const direct=['raw-1.js','raw-2.js','raw-3.js','raw-4.js','raw-5.js'];
 const encoded=['raw-6b.js','raw-7b.js','raw-8b.js'];
 const stamp=Date.now().toString(36);
 const fail=(msg)=>{status.className='msg err';status.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+msg;};
 const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));

 async function loadText(name){
   let last='';
   for(let attempt=1;attempt<=3;attempt++){
     try{
       status.textContent='تحميل '+name+' — محاولة '+attempt+'/3';
       const r=await fetch(base+name+'?v=fixed32-'+stamp+'-'+attempt,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
       if(!r.ok){last='HTTP '+r.status;throw new Error(last);}
       const t=await r.text();
       if(!t.trim()){last='الملف فارغ';throw new Error(last);}
       return t;
     }catch(e){
       last=e&&e.message?e.message:String(e);
       if(attempt<3) await sleep(350*attempt);
     }
   }
   throw new Error(name+' فشل بعد 3 محاولات: '+last);
 }

 function extractPush(source,target,name){
   const marker='window.'+target+'.push(';
   const start=source.indexOf(marker);
   const end=source.lastIndexOf(');');
   if(start<0||end<0||end<=start) throw new Error(name+' تنسيقه غير صحيح');
   const arg=source.slice(start+marker.length,end).trim();
   try{return JSON.parse(arg);}catch(e){throw new Error(name+' تعذر قراءة محتواه: '+e.message);}
 }

 function decode64(input){
   const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
   const map=new Int16Array(128);map.fill(-1);for(let i=0;i<alphabet.length;i++)map[alphabet.charCodeAt(i)]=i;
   const clean=String(input||'').replace(/[^A-Za-z0-9+/]/g,'');
   const out=new Uint8Array(Math.ceil(clean.length*3/4));let oi=0;
   for(let i=0;i<clean.length;i+=4){
     const a=map[clean.charCodeAt(i)],b=i+1<clean.length?map[clean.charCodeAt(i+1)]:0,c=i+2<clean.length?map[clean.charCodeAt(i+2)]:0,d=i+3<clean.length?map[clean.charCodeAt(i+3)]:0;
     if(a<0||b<0||c<0||d<0) throw new Error('Base64 غير صالح عند الموضع '+i);
     const n=(a<<18)|(b<<12)|(c<<6)|d;out[oi++]=(n>>16)&255;if(i+2<clean.length)out[oi++]=(n>>8)&255;if(i+3<clean.length)out[oi++]=n&255;
   }
   return new TextDecoder('utf-8').decode(out.subarray(0,oi));
 }

 try{
   const chunks=[];
   for(let i=0;i<direct.length;i++){
     const name=direct[i];
     const src=await loadText(name);
     const part=extractPush(src,'__NOVA_HTML',name);
     chunks.push(part);
     status.textContent='تم تحميل الأجزاء المباشرة '+(i+1)+'/5';
   }
   for(let i=0;i<encoded.length;i++){
     const name=encoded[i];
     const src=await loadText(name);
     const b64=extractPush(src,'__NOVA_JS64',name);
     const decoded=decode64(b64);
     const part=extractPush(decoded,'__NOVA_HTML',name+' decoded');
     chunks.push(part);
     status.textContent='تم تحميل إجمالي الأجزاء '+(direct.length+i+1)+'/8';
   }
   if(chunks.length!==8) throw new Error('عدد الأجزاء النهائي '+chunks.length+'/8');
   let html=chunks.join('');
   if(!html.includes('initApp()')) throw new Error('ملف التطبيق النهائي غير مكتمل');
   html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>NOVA AI</title>').replaceAll('NovaAI','NOVA AI');
   document.open();document.write(html);document.close();
 }catch(e){fail(e&&e.message?e.message:String(e));}
})();
</script>
</body>
</html>
