<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<style>
html,body{height:100%;margin:0;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.logo{font-size:44px;font-weight:800}.msg{margin-top:18px;color:#9999b5;line-height:1.8}.err{max-width:760px;color:#ff8bad;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري تشغيل NOVA AI…</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 const base='../nova-ai-original-clean/';
 const parts=['raw-1.js','raw-2.js','raw-3.js','raw-4.js','raw-5a.js','raw-5b.js','raw-5c.js','raw-5d.js'];
 const stamp='manual-escape-v36';
 const fail=(msg)=>{status.className='msg err';status.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+msg;};

 async function loadText(name){
   const r=await fetch(base+name+'?v='+stamp,{cache:'no-store'});
   if(!r.ok) throw new Error(name+' لم يُحمّل: HTTP '+r.status);
   const t=await r.text();
   if(!t.trim()) throw new Error(name+' فارغ');
   return t;
 }

 function decodeJsQuoted(arg,name){
   arg=arg.trim();
   const q=arg[0];
   if((q!=='"'&&q!=="'")||arg[arg.length-1]!==q) throw new Error(name+' ليس نص JavaScript مقتبسًا');
   let out='';
   for(let i=1;i<arg.length-1;i++){
     const ch=arg[i];
     if(ch!=='\\'){ out+=ch; continue; }
     if(i>=arg.length-2){ out+='\\'; continue; }
     const n=arg[++i];
     switch(n){
       case 'n': out+='\n'; break;
       case 'r': out+='\r'; break;
       case 't': out+='\t'; break;
       case 'b': out+='\b'; break;
       case 'f': out+='\f'; break;
       case 'v': out+='\v'; break;
       case '0': out+='\0'; break;
       case '\\': out+='\\'; break;
       case '"': out+='"'; break;
       case "'": out+="'"; break;
       case '/': out+='/'; break;
       case 'x': {
         const h=arg.slice(i+1,i+3);
         if(/^[0-9a-fA-F]{2}$/.test(h)){ out+=String.fromCharCode(parseInt(h,16)); i+=2; }
         else out+='x';
         break;
       }
       case 'u': {
         if(arg[i+1]==='{'){
           const close=arg.indexOf('}',i+2);
           if(close>i+2){
             const h=arg.slice(i+2,close);
             if(/^[0-9a-fA-F]+$/.test(h)){ out+=String.fromCodePoint(parseInt(h,16)); i=close; break; }
           }
           out+='u';
         }else{
           const h=arg.slice(i+1,i+5);
           if(/^[0-9a-fA-F]{4}$/.test(h)){ out+=String.fromCharCode(parseInt(h,16)); i+=4; }
           else out+='u';
         }
         break;
       }
       case '\n': break;
       case '\r': if(arg[i+1]==='\n') i++; break;
       default:
         // JavaScript legacy/identity escape: keep the escaped character itself.
         out+=n;
     }
   }
   return out;
 }

 function extractPush(source,name){
   const marker='window.__NOVA_HTML.push(';
   const start=source.indexOf(marker),end=source.lastIndexOf(');');
   if(start<0||end<0||end<=start) throw new Error(name+' تنسيقه غير صحيح');
   const arg=source.slice(start+marker.length,end).trim();
   return decodeJsQuoted(arg,name);
 }

 try{
   const chunks=[];
   status.textContent='جاري قراءة أجزاء NOVA AI… 0/8';
   for(let i=0;i<parts.length;i++){
     const src=await loadText(parts[i]);
     chunks.push(extractPush(src,parts[i]));
     status.textContent='جاري قراءة أجزاء NOVA AI… '+(i+1)+'/8';
   }
   let html=chunks.join('');
   if(!html.includes('<html')||!html.includes('initApp()')) throw new Error('ملف التطبيق النهائي غير مكتمل');
   html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>NOVA AI</title>').replaceAll('NovaAI','NOVA AI');
   document.open();document.write(html);document.close();
 }catch(e){fail(e&&e.message?e.message:String(e));}
})();
</script>
</body>
</html>
