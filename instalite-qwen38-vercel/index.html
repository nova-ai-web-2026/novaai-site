<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaLite Qwen 3.8</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;font-family:Arial,sans-serif;color:#111}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.head{padding:16px;border-bottom:1px solid #ddd;font-weight:800}.msgs{height:calc(100vh - 130px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.m{max-width:82%;padding:10px 13px;border-radius:18px;line-height:1.45}.me{align-self:flex-start;background:#0095f6;color:#fff}.them{align-self:flex-end;background:#efefef}.compose{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd}.compose textarea{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 13px;resize:none}.compose button{border:0;border-radius:20px;background:#0095f6;color:#fff;padding:0 18px;font-weight:700}.status{font-size:12px;padding:8px 12px;color:#666}.err{color:#b00020}</style></head><body><div class="app"><div class="head">Mariam</div><div class="status" id="status"></div><div class="msgs" id="msgs"></div><div class="compose"><textarea id="input" rows="1" placeholder="اكتب رسالة…"></textarea><button id="send">إرسال</button></div></div><script>const msgs=[],$=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){$('#msgs').innerHTML=msgs.map(x=>'<div class="m '+(x.me?'me':'them')+'">'+esc(x.t)+'</div>').join('');$('#msgs').scrollTop=$('#msgs').scrollHeight}async function send(){const t=$('#input').value.trim();if(!t)return;$('#input').value='';msgs.push({me:true,t});render();$('#status').className='status';$('#status').textContent='يكتب الآن…';try{const history=msgs.slice(-24,-1).map(x=>({role:x.me?'user':'assistant',content:x.t}));const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character:'mariam.photo',message:t,history})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));msgs.push({me:false,t:d.reply});$('#status').textContent='';render()}catch(e){$('#status').className='status err';$('#status').textContent='تعذر الرد: '+(e.message||e)}}$('#send').onclick=send;$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});</script></body></html>
