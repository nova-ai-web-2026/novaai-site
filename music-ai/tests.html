<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaBeat AI Tests</title><style>body{font-family:system-ui;background:#0b0b12;color:#f5f5fa;margin:0;padding:24px}.box{max-width:720px;margin:auto;background:#14141e;border:1px solid #2a2a3a;border-radius:18px;padding:20px}li{margin:10px 0;padding:10px;border-radius:10px;background:#0f0f17}.ok{color:#43e49d}.bad{color:#ff7482}button{padding:11px 14px;border:0;border-radius:10px;background:#725cff;color:#fff;font-weight:700}</style></head><body><div class="box"><h1>NovaBeat AI — Browser Tests</h1><p>الصفحة دي تختبر أهم حاجة: هل المتصفح يقدر يرندر صوت حقيقي غير صامت.</p><button id="run">تشغيل الاختبارات</button><ol id="out"></ol></div><script>
const out=document.querySelector('#out');function row(name,ok,extra=''){const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✓ ':'✗ ')+name+(extra?' — '+extra:'');out.appendChild(li)}
async function run(){out.innerHTML='';row('AudioContext موجود',!!window.AudioContext);row('OfflineAudioContext موجود',!!window.OfflineAudioContext);try{if(!window.OfflineAudioContext)throw new Error('OfflineAudioContext missing');const sr=44100,ctx=new OfflineAudioContext(1,sr*2,sr),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=220;g.gain.value=.2;o.connect(g);g.connect(ctx.destination);o.start(0);o.stop(1.5);const b=await ctx.startRendering();let e=0,d=b.getChannelData(0);for(let i=0;i<d.length;i+=64)e+=Math.abs(d[i]);row('الرندر ينتج Buffer',b.length>0,`${b.duration.toFixed(2)}s`);row('الملف غير صامت',e>1,`energy=${e.toFixed(2)}`);row('Sample rate صحيح',b.sampleRate===44100,String(b.sampleRate));}catch(err){row('اختبار الرندر',false,err.message)}}document.querySelector('#run').onclick=run;run();
</script></body></html>
