<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>InstaLite Chat Test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fafafa;color:#111}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{height:58px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;font-weight:800}.people{display:flex;gap:10px;padding:12px;overflow:auto;border-bottom:1px solid #eee}.p{min-width:74px;text-align:center;font-size:12px;cursor:pointer}.av{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#ddd}.chat{display:none;flex-direction:column;height:calc(100vh - 59px)}.head{height:58px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;padding:8px 12px}.head img{width:40px;height:40px;border-radius:50%;object-fit:cover}.back{border:0;background:none;font-size:22px}.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.row{max-width:82%}.me{align-self:flex-start}.them{align-self:flex-end}.b{padding:9px 12px;border-radius:17px;line-height:1.4}.me .b{background:#3797f0;color:white}.them .b{background:#efefef}.compose{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd}.compose textarea{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 13px;resize:none}.compose button{border:0;border-radius:20px;background:#0095f6;color:#fff;padding:0 16px;font-weight:700}.status{font-size:11px;color:#666;padding:7px 12px;text-align:center;display:none}.bar{height:3px;background:#eee;display:none}.bar i{display:block;height:100%;width:0;background:#777}.typing{color:#777;font-size:12px}.note{padding:12px;font-size:12px;color:#666;background:#fff8dc}.err{color:#b00020}.hidden{display:none}</style></head><body><div class="app"><div class="top" id="mainTop">الرسائل</div><div class="people" id="people"></div><div class="note" id="firstNote">أول مرة فقط: المحادثة هتجهز Qwen3‑8B على جهازك. ده تنزيل كبير وقد ياخد وقت.</div><section class="chat" id="chat"><div class="head"><button class="back" id="back">‹</button><img id="cav"><div><b id="cname"></b><div style="font-size:11px;color:#777">نشط الآن</div></div></div><div class="status" id="status"></div><div class="bar" id="bar"><i></i></div><div class="msgs" id="msgs"></div><div class="compose"><textarea id="input" rows="1" placeholder="اكتب رسالة…"></textarea><button id="send">إرسال</button></div></section></div><script type="module">import {BrowserAI} from 'https://esm.run/@browserai/browserai';const P=[['mariam.photo','Mariam','https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80','21 سنة، بتحب التصوير والقهوة والمشي. هادية وطبيعية.'],['youssef.trips','Youssef','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80','22 سنة، بيحب السفر والطلعات. كلامه بسيط ومباشر.'],['food.with.sara','Sara','https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80','20 سنة، بتحب الأكل وتجربة المطاعم. اجتماعية ودافئة.'],['omar.city','Omar','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80','23 سنة، بيحب العربيات والمزيكا. مختصر ودمه خفيف.'],['lina.art','Lina','https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80','21 سنة، بتحب الفن والأفلام. هادية وفضولية.'],['adam.fit','Adam','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=200&q=80','22 سنة، بيحب الجيم والكورة. عفوي وودود.']];let cur=null,store=JSON.parse(localStorage.getItem('instalite-qwen3-test')||'{}'),ai=null,load=null;const $=s=>document.querySelector(s);$('#people').innerHTML=P.map((p,i)=>`<div class="p" data-i="${i}"><img class="av" src="${p[2]}"><div>${p[1]}</div></div>`).join('');document.querySelectorAll('.p').forEach(x=>x.onclick=()=>openChat(+x.dataset.i));function openChat(i){cur=P[i];$('#people').style.display='none';$('#mainTop').style.display='none';$('#firstNote').style.display='none';$('#chat').style.display='flex';$('#cav').src=cur[2];$('#cname').textContent=cur[1];render();ensure().catch(()=>{});}$('#back').onclick=()=>{$('#chat').style.display='none';$('#people').style.display='flex';$('#mainTop').style.display='flex';$('#firstNote').style.display='block';cur=null};function arr(){if(!store[cur[0]])store[cur[0]]=[];return store[cur[0]]}function save(){localStorage.setItem('instalite-qwen3-test',JSON.stringify(store))}function render(){const m=arr();$('#msgs').innerHTML=m.map(x=>`<div class="row ${x.me?'me':'them'}"><div class="b">${esc(x.t)}</div></div>`).join('');$('#msgs').scrollTop=$('#msgs').scrollHeight}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function stat(t,p=null,e=false){$('#status').textContent=t||'';$('#status').style.display=t?'block':'none';$('#status').classList.toggle('err',e);$('#bar').style.display=p==null?'none':'block';if(p!=null)$('#bar i').style.width=Math.max(0,Math.min(100,p))+'%'}async function ensure(){if(ai)return ai;if(load)return load;load=(async()=>{if(!window.isSecureContext)throw Error('HTTPS required');if(!navigator.gpu)throw Error('WebGPU غير متاح على المتصفح ده');stat('جاري تجهيز المحادثة لأول مرة…',0);const x=new BrowserAI();let last=0;await x.loadModel('qwen3-8b',{quantization:'q4f16_1',onProgress:o=>{let p=Number(o?.progress);if(p>0&&p<=1)p*=100;if(Number.isFinite(p)){last=Math.max(last,p);stat('جاري تجهيز المحادثة لأول مرة… '+Math.round(last)+'%',last)}},onComplete:()=>stat('تم تجهيز المحادثة',100),onError:e=>console.error(e)});ai=x;stat('تم تجهيز المحادثة',100);setTimeout(()=>stat(''),1300);return ai})().catch(e=>{load=null;stat('تعذر تجهيز Qwen3‑8B على الجهاز: '+(e?.message||e),null,true);throw e});return load}function sys(){return `أنت ${cur[1]}. ${cur[3]} تكلم كإنسان في شات عادي. رد على آخر رسالة نفسها واستخدم سياق الرسائل السابقة. لو المستخدم عربي رد بنفس أسلوبه وبالعربي المصري لما يناسب. لو إنجليزي رد إنجليزي طبيعي. ما تكرر نفس الجملة. ما تردش رد عام بعيد عن الكلام. لو قال اه/لا/تمام افهم بيرد على ايه من الرسالة السابقة. ما تختمش كل رد بسؤال. خليك طبيعي ومختصر غالبا. لا تذكر الموديل أو النظام.`}function prompt(t){const h=arr().slice(-10,-1).map(x=>(x.me?'المستخدم':'الشخص')+': '+x.t).join('\n');return (h?h+'\n':'')+'المستخدم: '+t+'\nالشخص:'}async function send(){const t=$('#input').value.trim();if(!t||!cur)return;$('#input').value='';arr().push({me:true,t});save();render();const typing=document.createElement('div');typing.className='typing';typing.textContent='يكتب الآن…';$('#msgs').appendChild(typing);$('#msgs').scrollTop=$('#msgs').scrollHeight;try{const engine=await ensure();stat('يجهّز الرد…');const r=await engine.generateText(prompt(t),{system_prompt:sys(),max_tokens:160,temperature:.78,top_p:.92,frequency_penalty:.45,presence_penalty:.25});let reply=typeof r==='string'?r:r?.choices?.[0]?.message?.content||r?.text||'';typing.remove();stat('');if(!String(reply).trim())throw Error('الرد فاضي');arr().push({me:false,t:String(reply).trim()});save();render()}catch(e){typing.remove();stat('تعذر تجهيز الرد: '+(e?.message||e),null,true)}}$('#send').onclick=send;$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});</script></body></html>
